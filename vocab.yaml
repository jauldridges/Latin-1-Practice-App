# ============================================================
# Vocabulary drill word list — Units 0 and 1 core (80 words)
#
# IMPORTANT: the source files (latin1-item-exemplars.yaml,
# latin1-spec.yaml) list these 80 words but carry NO English glosses.
# The drill needs glosses to run in both directions, so they are seeded
# here. THESE GLOSSES ARE NOT FROM THE CANONICAL FILES — they were
# written for this build and should be checked and edited by the teacher.
# This is the single file to edit; neither app writes to it.
#
# Each entry:
#   latin  the headword (macrons kept for display; never required in an answer)
#   en     accepted English answers (first is the one shown as the model)
#   week   the core-list week the word belongs to
#
# Answers are checked by the shared module: case, macrons, punctuation,
# a leading "the"/"a", and spacing are all forgiven; near-misses come back
# as "close" and can be retyped.
# ============================================================

meta:
  scope: Units 0 and 1 (80 core words)
  glosses_source: seeded for this build, teacher-editable (not from canonical files)

words:

