{#- The Magister: a friendly Roman teacher -- laurel wreath, grey beard, toga
    with a red stripe, a scroll. Drawn inline so it scales on any screen and
    needs no image file. -#}
<svg class="magister-svg" viewBox="0 0 120 130" role="img" aria-label="The Magister">
  <!-- toga -->
  <path d="M18 130 C20 100 36 86 60 86 C84 86 100 100 102 130 Z" fill="#f4efe4" stroke="#cfc6b4" stroke-width="1.5"/>
  <path d="M38 92 C52 104 62 114 66 130" fill="none" stroke="#a23b3b" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 104 C44 110 54 118 58 130" fill="none" stroke="#e3dccd" stroke-width="2"/>
  <!-- scroll in hand -->
  <g transform="rotate(-18 92 104)">
    <rect x="78" y="98" width="26" height="12" rx="3" fill="#f7e7c1" stroke="#c9a96a" stroke-width="1.5"/>
    <circle cx="78" cy="104" r="6" fill="#f2dca6" stroke="#c9a96a" stroke-width="1.5"/>
    <circle cx="104" cy="104" r="6" fill="#f2dca6" stroke="#c9a96a" stroke-width="1.5"/>
    <line x1="84" y1="102" x2="98" y2="102" stroke="#c9a96a" stroke-width="1"/>
    <line x1="84" y1="106" x2="96" y2="106" stroke="#c9a96a" stroke-width="1"/>
  </g>
  <circle cx="86" cy="112" r="7" fill="#efc8a4" stroke="#d4a47f" stroke-width="1.2"/>
  <!-- neck and ears -->
  <rect x="51" y="70" width="18" height="18" rx="6" fill="#e9bc95"/>
  <ellipse cx="36" cy="50" rx="5" ry="7" fill="#e9bc95" stroke="#d4a47f" stroke-width="1"/>
  <ellipse cx="84" cy="50" rx="5" ry="7" fill="#e9bc95" stroke="#d4a47f" stroke-width="1"/>
  <!-- face -->
  <ellipse cx="60" cy="48" rx="24" ry="27" fill="#f1c9a5" stroke="#d4a47f" stroke-width="1.2"/>
  <!-- grey hair at the sides -->
  <path d="M37 40 C36 30 40 24 44 22" fill="none" stroke="#b9b6b0" stroke-width="5" stroke-linecap="round"/>
  <path d="M83 40 C84 30 80 24 76 22" fill="none" stroke="#b9b6b0" stroke-width="5" stroke-linecap="round"/>
  <!-- beard -->
  <path d="M37 50 C38 72 48 86 60 86 C72 86 82 72 83 50 C78 62 70 66 60 66 C50 66 42 62 37 50 Z"
        fill="#c9c6bf" stroke="#aaa69e" stroke-width="1.2"/>
  <!-- moustache and smile -->
  <path d="M48 60 C53 56 58 58 60 60 C62 58 67 56 72 60 C67 63 62 62 60 61 C58 62 53 63 48 60 Z" fill="#b2aea6"/>
  <path d="M53 66 C57 70 63 70 67 66" fill="none" stroke="#8a5a44" stroke-width="2" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M60 46 C58 52 57 55 61 56" fill="none" stroke="#c98f6b" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes and kind eyebrows -->
  <circle cx="50" cy="44" r="3" fill="#2b2a28"/>
  <circle cx="70" cy="44" r="3" fill="#2b2a28"/>
  <circle cx="51" cy="43" r="1" fill="#fff"/>
  <circle cx="71" cy="43" r="1" fill="#fff"/>
  <path d="M44 37 C47 34 52 34 55 36" fill="none" stroke="#9a968e" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 36 C68 34 73 34 76 37" fill="none" stroke="#9a968e" stroke-width="3" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <circle cx="44" cy="53" r="4" fill="#f2a98f" opacity=".45"/>
  <circle cx="76" cy="53" r="4" fill="#f2a98f" opacity=".45"/>
  <!-- laurel wreath -->
  <g fill="#4f8a3c" stroke="#3b6e2c" stroke-width=".8">
    <path d="M38 34 C40 22 50 15 60 14 C70 15 80 22 82 34" fill="none" stroke="#3b6e2c" stroke-width="2"/>
    <ellipse cx="39" cy="30" rx="5" ry="2.6" transform="rotate(-60 39 30)"/>
    <ellipse cx="43" cy="23" rx="5" ry="2.6" transform="rotate(-40 43 23)"/>
    <ellipse cx="49" cy="18" rx="5" ry="2.6" transform="rotate(-20 49 18)"/>
    <ellipse cx="56" cy="15" rx="5" ry="2.6" transform="rotate(-5 56 15)"/>
    <ellipse cx="81" cy="30" rx="5" ry="2.6" transform="rotate(60 81 30)"/>
    <ellipse cx="77" cy="23" rx="5" ry="2.6" transform="rotate(40 77 23)"/>
    <ellipse cx="71" cy="18" rx="5" ry="2.6" transform="rotate(20 71 18)"/>
    <ellipse cx="64" cy="15" rx="5" ry="2.6" transform="rotate(5 64 15)"/>
  </g>
</svg>
