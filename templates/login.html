{% extends "base.html" %}
{% block subtitle %}teacher{% endblock %}
{% block content %}
<h1>Teacher sign-in</h1>
{% if error %}<div class="answer-feedback wrong">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="small muted" for="password">Password</label>
  <input type="password" name="password" id="password" autocomplete="current-password"
         autofocus required>
  <button class="bigbtn" type="submit" style="margin-top:12px">Sign in</button>
</form>
<p class="small muted">Students don't come through here — they use the class code.</p>
{% endblock %}
