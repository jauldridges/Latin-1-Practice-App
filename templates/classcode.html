{% extends "base.html" %}
{% block subtitle %}class code{% endblock %}
{% block content %}
<h1>Class code</h1>
{% if error %}<div class="answer-feedback wrong">{{ error }}</div>{% endif %}
<p class="small muted">Type the code your teacher gave you. You only have to do
  this once on this phone or computer.</p>
<form method="post" action="{{ url_for('classcode') }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label class="small muted" for="code">Code</label>
  <input type="text" name="code" id="code" autocomplete="off" autocapitalize="off"
         autocorrect="off" spellcheck="false" autofocus required>
  <button class="bigbtn" type="submit" style="margin-top:12px">Go</button>
</form>
{% endblock %}
