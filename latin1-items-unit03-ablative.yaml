# Latin I — the ablative and prepositions (written November 2026)
#
# Taught in Week 13 (week of November 16): the ablative forms, prepositions
# with the ablative and with the accusative, in with either case, and the
# ablative of means set against cum (accompaniment). Those nodes were moved
# from their planned late-November and December dates to that week
# (latin1-spec.yaml), so a quiz on the week includes them.
#
# Three questions a node. As in every bank file, recall is a write-in box,
# the right answer is option a (the app shuffles the options per student),
# and Latin a student hasn't met is glossed in [brackets].

items:

# ---------- MS-080 — first declension ablative ----------

  - id: MS080-PRODUCE-01
    node: MS-080
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the ablative singular and the ablative plural of puella, puellae (girl)."
    boxes:
      - label: ablative singular
        answer: ["puella", "puellā"]
      - label: ablative plural
        answer: ["puellis", "puellīs"]
    touches: [MS-018]
    what_went_wrong:
      - text: "I wrote the accusative (puellam)"
        node: MS-080
      - text: "I mixed up the plural with another case"
        node: MS-080
    note: >
      Ablative singular -ā (long, unlike the nominative's short -a); ablative
      plural -īs, the same as the dative plural.
    teaching: ''

  - id: MS080-PARSE-01
    node: MS-080
    assess: parse
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "In sine pecūniā [without money], what case and number is pecūniā?"
    options:
      a: "Ablative singular"
      b: "Nominative singular"
      c: "Accusative singular"
      d: "Genitive singular"
    answer: a
    touches: [MS-083]
    what_went_wrong:
      - text: "I read -ā as the nominative -a"
        node: MS-080
      - text: "I forgot that sine takes the ablative"
        node: MS-083
    teaching: ''

  - id: MS080-PRODUCE-02
    node: MS-080
    assess: produce
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write in Latin: “with the queen” (queen = rēgīna, rēgīnae)."
    boxes:
      - label: with the queen
        answer: ["cum regina", "cum rēgīnā"]
    touches: [MS-083]
    what_went_wrong:
      - text: "I used the accusative after cum"
        node: MS-083
      - text: "I didn't know the ablative of rēgīna"
        node: MS-080
    teaching: ''

# ---------- MS-081 — second declension ablative ----------

  - id: MS081-PRODUCE-01
    node: MS-081
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the ablative singular and the ablative plural of amīcus, amīcī (friend)."
    boxes:
      - label: ablative singular
        answer: ["amico", "amīcō"]
      - label: ablative plural
        answer: ["amicis", "amīcīs"]
    touches: [MS-023]
    what_went_wrong:
      - text: "I wrote the accusative (amīcum)"
        node: MS-081
      - text: "I mixed up the plural with another case"
        node: MS-081
    note: >
      Second declension ablative: -ō singular, -īs plural, the same endings
      as the dative.
    teaching: ''

  - id: MS081-PRODUCE-02
    node: MS-081
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the ablative singular and the ablative plural of bellum, bellī (war)."
    boxes:
      - label: ablative singular
        answer: ["bello", "bellō"]
      - label: ablative plural
        answer: ["bellis", "bellīs"]
    touches: [MS-023]
    what_went_wrong:
      - text: "I used a neuter nominative ending (-a)"
        node: MS-081
      - text: "I didn't know the ablative endings"
        node: MS-081
    teaching: ''

  - id: MS081-PARSE-01
    node: MS-081
    assess: parse
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "agrīs can be dative plural or ablative plural. In ex agrīs, which is it?"
    options:
      a: "Ablative plural, because it follows ex, which takes the ablative"
      b: "Dative plural, because it means “to the fields”"
      c: "Nominative plural, because it ends in -īs"
      d: "Genitive plural, because it means “of the fields”"
    answer: a
    touches: [MS-083]
    what_went_wrong:
      - text: "I forgot to look at the preposition"
        node: MS-083
      - text: "I forgot the dative and ablative plural look the same"
        node: MS-081
    teaching: ''

# ---------- MS-082 — third declension ablative ----------

  - id: MS082-PRODUCE-01
    node: MS-082
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the ablative singular and the ablative plural of rēx, rēgis (king)."
    boxes:
      - label: ablative singular
        answer: ["rege", "rēge"]
      - label: ablative plural
        answer: ["regibus", "rēgibus"]
    touches: [MS-064]
    what_went_wrong:
      - text: "I put the ending on the nominative, not the stem rēg-"
        node: MS-062
      - text: "I didn't know the third declension ablative endings"
        node: MS-082
    note: >
      Stem from the genitive (rēg-), then -e singular and -ibus plural.
    teaching: ''

  - id: MS082-PRODUCE-02
    node: MS-082
    assess: produce
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write in Latin: “with the soldier” (soldier = mīles, mīlitis)."
    boxes:
      - label: with the soldier
        answer: ["cum milite", "cum mīlite"]
    touches: [MS-083]
    what_went_wrong:
      - text: "I used the nominative mīles after cum"
        node: MS-082
      - text: "I didn't find the stem mīlit-"
        node: MS-062
    teaching: ''

  - id: MS082-PARSE-01
    node: MS-082
    assess: parse
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "In cum mīlitibus, what form is mīlitibus?"
    options:
      a: "Ablative plural: -ibus can be dative or ablative, and cum takes the ablative"
      b: "Dative plural, because -ibus is always dative"
      c: "Nominative plural"
      d: "Accusative singular"
    answer: a
    touches: [MS-083]
    what_went_wrong:
      - text: "I thought -ibus could only be dative"
        node: MS-082
    teaching: ''

# ---------- MS-083 — prepositions with the ablative ----------

  - id: MS083-RECALL-01
    node: MS-083
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write three of the eight prepositions that take the ablative."
    order_matters: false
    boxes:
      - label: One
        answer: ["cum", "sine", "ab", "e", "ex", "de", "dē", "in", "sub", "pro", "prō"]
      - label: Another
        answer: ["cum", "sine", "ab", "e", "ex", "de", "dē", "in", "sub", "pro", "prō"]
      - label: A third
        answer: ["cum", "sine", "ab", "e", "ex", "de", "dē", "in", "sub", "pro", "prō"]
    touches: [MS-084]
    what_went_wrong:
      - text: "I wrote a preposition that takes the accusative"
        node: MS-084
      - text: "I couldn't remember three"
        node: MS-083
    note: >
      cum, sine, ā/ab, ē/ex, dē, in, sub, prō. (ā alone isn't accepted: the
      answer checker drops a lone "a" the way it drops an article.)
    teaching: ''

  - id: MS083-APPLY-01
    node: MS-083
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which phrase means “without a friend”?"
    options:
      a: "sine amīcō"
      b: "sine amīcum"
      c: "sine amīcī"
      d: "sine amīcus"
    answer: a
    touches: [MS-081]
    what_went_wrong:
      - text: "I used the accusative after sine"
        node: MS-083
      - text: "I didn't know the ablative of amīcus"
        node: MS-081
    teaching: ''

  - id: MS083-APPLY-02
    node: MS-083
    assess: apply
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write in Latin: “about the war” (war = bellum, bellī)."
    boxes:
