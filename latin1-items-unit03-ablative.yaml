# ---------- MS-085 — in with the ablative or the accusative ----------

  - id: MS085-TRANSLATE-01
    node: MS-085
    assess: translate
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Translate both phrases: in silvam and in silvā."
    boxes:
      - label: in silvam
        answer: ["into the forest", "into the woods", "into the wood", "into a forest", "to the forest", "onto the forest"]
      - label: in silvā
        answer: ["in the forest", "in the woods", "in the wood", "in a forest", "on the forest"]
    touches: [MS-083, MS-084]
    what_went_wrong:
      - text: "I translated both as “in”"
        node: MS-085
      - text: "I didn't notice the different endings"
        node: MS-085
    teaching: ''

  - id: MS085-EXPLAIN-01
    node: MS-085
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Antōnius [Antony] in Aegyptum [Egypt] nāvigat [sails] et in Aegyptō [Egypt] manet [stays]. Why are there two different endings?"
    options:
      a: "Because Aegyptum (accusative) shows motion into Egypt, and Aegyptō (ablative) shows where he stays"
      b: "Because Aegyptum is the subject of the sentence"
      c: "Because either ending is fine; they mean the same thing"
      d: "Because Aegyptō is plural"
    answer: a
    touches: [MS-083, MS-084]
    what_went_wrong:
      - text: "I thought the two endings meant the same"
        node: MS-085
    teaching: ''

  - id: MS085-TRANSLATE-02
    node: MS-085
    assess: translate
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which sentence means “The boys come into the field”?"
    options:
      a: "Puerī in agrum veniunt."
      b: "Puerī in agrō veniunt."
      c: "Puerī ex agrō veniunt."
      d: "Puerī ad agrīs veniunt."
    answer: a
    touches: [MS-084]
    what_went_wrong:
      - text: "I used the ablative for motion into"
        node: MS-085
      - text: "I mixed up into and out of"
        node: MS-083
    teaching: ''

# ---------- MS-088 — ablative of accompaniment with cum ----------

  - id: MS088-RECOG-01
    node: MS-088
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Octāvius [Octavius] cum amīcīs venit. What does cum amīcīs tell you?"
    options:
      a: "Who comes with him: accompaniment"
      b: "The tool he uses: means"
      c: "Where he comes from"
      d: "Whom he comes to"
    answer: a
    touches: [MS-089]
    what_went_wrong:
      - text: "I thought it was the ablative of means"
        node: MS-090
    teaching: ''

  - id: MS088-TRANSLATE-01
    node: MS-088
    assess: translate
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Translate cum mātre (māter, mātris = mother)."
    boxes:
      - label: cum mātre
        answer: ["with the mother", "with her mother", "with his mother", "with mother", "with a mother", "with my mother"]
    touches: [MS-082]
    what_went_wrong:
      - text: "I didn't know what cum means"
        node: MS-083
      - text: "I didn't recognize mātre as the ablative of māter"
        node: MS-082
    teaching: ''

  - id: MS088-TRANSLATE-02
    node: MS-088
    assess: translate
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which phrase means “with friends” (together with them)?"
    options:
      a: "cum amīcīs"
      b: "amīcīs, with no preposition"
      c: "sine amīcīs"
      d: "cum amīcōs"
    answer: a
    touches: [MS-089]
    what_went_wrong:
      - text: "I left out cum: people you are with take cum"
        node: MS-090
      - text: "I used the accusative after cum"
        node: MS-083
    teaching: ''

# ---------- MS-089 — ablative of means ----------

  - id: MS089-RECOG-01
    node: MS-089
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Mīles gladiō [sword] pugnat. What job is gladiō doing?"
    options:
      a: "Ablative of means: the tool he fights with"
      b: "Ablative of accompaniment: whom he fights with"
      c: "Dative: to the sword"
      d: "Direct object"
    answer: a
    touches: [MS-088]
    what_went_wrong:
      - text: "I thought a thing could be accompaniment"
        node: MS-090
      - text: "I read -ō as the dative"
        node: MS-081
    teaching: ''

  - id: MS089-TRANSLATE-01
    node: MS-089
    assess: translate
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Octāvius [Octavius] verbīs pugnat. Translate verbīs."
    boxes:
      - label: verbīs
        answer: ["with words", "by words", "using words", "with his words", "by means of words", "by his words"]
    touches: [MS-081]
    what_went_wrong:
      - text: "I translated it as “to words”"
        node: MS-089
      - text: "I didn't know verbum"
        node: MS-081
    teaching: ''

  - id: MS089-EXPLAIN-01
    node: MS-089
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Agrippa nāvibus [ships] superat. Why is there no preposition before nāvibus?"
    options:
      a: "Because the ships are the tool he wins with, and the ablative of means takes no preposition"
      b: "Because nāvibus is dative, so it needs no preposition"
      c: "Because the writer forgot the cum"
      d: "Because nāvibus is the subject of the sentence"
    answer: a
    touches: [MS-088]
    what_went_wrong:
      - text: "I expected cum before every “with”"
        node: MS-090
    teaching: ''

# ---------- MS-090 — means versus accompaniment ----------

  - id: MS090-APPLY-01
    node: MS-090
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which sentence has an ablative of means (a tool)? (gladiō [sword])"
    options:
      a: "Rēx gladiō pugnat."
      b: "Rēx cum mīlitibus pugnat."
      c: "Rēx in oppidō pugnat."
      d: "Rēx ex oppidō venit."
    answer: a
    touches: [MS-089, MS-088]
    what_went_wrong:
      - text: "I picked the one with cum"
        node: MS-088
      - text: "I picked a place phrase"
        node: MS-083
    teaching: ''

  - id: MS090-APPLY-02
    node: MS-090
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which sentence has an ablative of accompaniment (someone you are with)?"
    options:
      a: "Puer cum patre venit."
      b: "Puer verbīs pugnat."
      c: "Puer sine patre venit."
      d: "Puer ad patrem venit."
    answer: a
    touches: [MS-089, MS-088]
    what_went_wrong:
      - text: "I picked sine: that means without"
        node: MS-083
      - text: "I picked the tool"
        node: MS-089
    teaching: ''

  - id: MS090-EXPLAIN-01
    node: MS-090
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "How do you tell an ablative of means from an ablative of accompaniment?"
    options:
      a: "Accompaniment uses cum, because it is someone you are with; means has no preposition, because it is a tool you use"
      b: "Means always uses cum, so look for cum"
      c: "Accompaniment never has a preposition"
      d: "They are the same, so either answer is right"
    answer: a
    touches: [MS-088, MS-089]
    what_went_wrong:
      - text: "I mixed up which one takes cum"
        node: MS-090
    teaching: ''
