questions:
  - id: q1
    ask: "Sentence 1: Who are Tiberius and Gaius Gracchus?"
    look: [1]
    hint: {1: "sunt fīliī Cornēliae"}
    options:
      a: "Cornelia's sons"
      b: "two senators"
      c: "Scipio's soldiers"
      d: "rich men who buy land"
    answer: a

  - id: p1
    ask: "Use sentences 2–4 to explain why the farmers need help."
    look: [2, 3, 4]
    hint: {3: "Dum agricolae pugnant virī dīvitēs agrōs eōrum emunt", 4: "agricolae nihil agrī habent"}
    model: >-
      Many Roman farmers fight in long wars. While they are away fighting, rich
      men buy their land. Now the rich have big farms and many slaves, and the
      farmers have no land at all (nihil agrī).

  - id: q2
    ask: "Sentence 5: What is Tiberius, and whom does he support?"
    look: [5]
    hint: {5: "Tiberius est tribūnus Agricolīs miserīs favet"}
    options:
      a: "He is a tribune, and he supports the poor farmers."
      b: "He is a senator, and he supports the rich men."
      c: "He is a king, and he supports the soldiers."
      d: "He is a farmer, and he supports his brother."
    answer: a

  - id: p2
    ask: "What is Tiberius's plan? Who would lose land if it passed (sentences 6–8)?"
    look: [6, 7, 8]
    hint: {6: "Agrōs pūblicōs agricolīs dare dēbēmus", 8: "Multī senātōrēs agrōs pūblicōs tenent"}
    model: >-
      His plan is to give the public land to the farmers. The senators would
      lose land, because many senators hold the public land.

  - id: p3
    ask: "What do the senators shout in sentence 9? Why was that the worst accusation in Rome?"
    look: [9]
    hint: {9: "Tiberius rēgnum cupit"}
    model: >-
      "Tiberius rēgnum cupit!", "Tiberius wants to be king!" The Romans had
      driven out their kings and hated the very idea of a king, so calling a
      Roman a would-be king was the worst thing you could say about him.

  - id: q3
    ask: "Sentence 10: What do the senators do to Tiberius?"
    look: [10]
    hint: {10: "Tiberium et amīcōs eius in Capitōliō oppugnant et necant"}
    options:
      a: "They attack and kill him and his friends on the Capitoline Hill."
      b: "They send him out of Rome."
      c: "They make him a senator."
      d: "They give him public land."
    answer: a

  - id: p4
    ask: "How does Gaius help the people? Why would cheap grain make the people support him (sentence 13)?"
    look: [12, 13]
    hint: {12: "Gāius populō frūmentum parvō pretiō dat", 13: "Populus Gāiō favet"}
    model: >-
      He gives the people grain at a low price. Poor Romans needed grain to
      live, so cheap grain helped them every day, and so the people support
      him: Populus Gāiō favet.

  - id: q4
    ask: "Sentences 15–16: How does Cornelia face the loss of her sons, and how does Rome honor her?"
    look: [15, 16]
    hint: {15: "sed nōn lacrimat", 16: "populus Rōmānus statuam Cornēliae pōnit"}
    options:
      a: "She does not cry, and the Roman people set up a statue of her."
      b: "She cries, and the senators apologize."
      c: "She leaves Rome, and the people forget her."
      d: "She marries the king of Egypt, and Rome is angry."
    answer: a

  - id: p5
    ask: "What changes in Rome after the Gracchi (sentence 18)? Were the Gracchi heroes of the people or would-be kings? Give evidence for both sides."
    look: [18]
    hint: {18: "Rōmānī saepe inter sē pugnant et post centum annōs rēs pūblica nōn iam est"}
    model: >-
      After the Gracchi, Romans often fight each other, and within a hundred
      years the Republic no longer exists. Heroes: they helped poor farmers with
      land and cheap grain, and the people supported them. Would-be kings: the
      senators said they wanted a king's power, and the struggle they started
      ended with Romans fighting Romans.
