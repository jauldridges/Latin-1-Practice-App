questions:
  - id: q1
    ask: "Sentence 1: Who takes care of Tiberius and Gaius?"
    look: [1]
    hint: {1: "Cornēlia fīliōs sōla cūrat"}
    options:
      a: "Cornelia, by herself"
      b: "Their father"
      c: "Greek teachers"
      d: "Freed slaves"
    answer: a

  - id: p1
    ask: "Sentence 1 says Cornēlia raises the boys alone. What does sentence 2 add about how Roman sons treat their mothers?"
    look: [1, 2]
    hint: {2: "Puerī mātrī semper pārent"}
    model: >-
      Puerī mātrī semper pārent: the boys always obey their mother. Roman sons
      were expected to obey and respect their mothers.

  - id: p2
    ask: "Who teaches the boys, and what do they teach (sentences 3–5)? Why might a Roman mother hire Greek teachers?"
    look: [3, 4, 5]
    hint: {3: "magistrōs Graecōs", 4: "fābulās et verba poētārum nārrant"}
    model: >-
      Greek teachers, whom Cornēlia gets for her sons, teach them stories and
      the words of the poets; the boys like the stories and trust their
      teachers. Romans admired Greek learning, literature and public speaking,
      so a rich mother hired Greek teachers to give her sons the best
      education.

  - id: p3
    ask: "Cornēlia does not always favor the boys. What does sentence 6 show about Roman parenting?"
    look: [6]
    hint: {6: "Cornēlia fīliīs imperat Labōrāte fīliī"}
    model: >-
      When the boys don't work, she gives them orders: "Labōrāte, fīliī!",
      "Work, sons!" Roman parents were strict: they expected hard work, and
      they did not just give their children what they wanted.

  - id: p4
    ask: "Why doesn't Cornēlia believe Gaius (sentences 7–8)? Translate Cūr amīcō nocēs?"
    look: [7, 8]
    hint: {7: "Gāius amīcō nocet et amīcus lacrimat", 8: "Cūr amīcō nocēs"}
    model: >-
      Gaius has harmed his friend, and the friend is crying, so she does not
      take Gaius's side. Cūr amīcō nocēs? means "Why are you harming your
      friend?"

  - id: q2
    ask: "Sentence 9: What does Gaius say to his mother?"
    look: [9]
    hint: {9: "Amīcus meus mihi nocet"}
    options:
      a: "“My friend is harming me!”"
      b: "“I am harming my friend!”"
      c: "“My friend believes me!”"
      d: "“I obey my mother!”"
    answer: a

  - id: p5
    ask: "How does Cornēlia persuade Gaius? How does sentence 13 define pietās?"
    look: [10, 13]
    hint: {10: "Rōmānī bonī amīcīs semper favent", 13: "bonus Rōmānus mātrī amīcīs et patriae fīdus est"}
    model: >-
      She reminds him what good Romans do: "Rōmānī bonī amīcīs semper favent,"
      good Romans always support their friends. Sentence 13 says pietās is a
      good Roman being loyal to his mother, his friends, and his country.

  - id: q3
    ask: "Sentence 11: Whom do the sons support later in life?"
    look: [11]
    hint: {11: "fīliī patriae et populō Rōmānō favent"}
    options:
      a: "their country and the Roman people"
      b: "the king of Egypt"
      c: "their Greek teachers"
      d: "the senators"
    answer: a

  - id: q4
    ask: "Sentence 12: Why is Cornelia happy?"
    look: [12]
    hint: {12: "fīliī sunt ōrnāmenta sua"}
    options:
      a: "Her sons are her jewels."
      b: "She has many jewels."
      c: "Her sons are kings."
      d: "Her friends are loyal to her."
    answer: a
