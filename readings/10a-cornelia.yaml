questions:
  - id: q1
    ask: "Sentences 1–2: Who was Scipio, and what did he do?"
    look: [1, 2]
    hint: {2: "Scīpiō Hannibalem superat et Rōmam servat"}
    options:
      a: "A famous Roman who defeated Hannibal and saved Rome"
      b: "The general of Carthage who attacked Rome"
      c: "Cornelia's husband, a consul"
      d: "The king of Egypt"
    answer: a

  - id: q2
    ask: "Sentences 3–4: Why is Scipio's daughter called Cornēlia?"
    look: [3, 4]
    hint: {4: "Fīliae Rōmānae nōmen gentis habent"}
    model: >-
      Roman daughters took the name of their clan (nōmen gentis). Scipio's clan
      name is Cornēlius, so his daughter is Cornēlia.

  - id: q3
    ask: "Sentences 5–6: What happens to Cornelia's husband, and what does Cornelia become?"
    look: [5, 6]
    hint: {6: "marītus mortuus est Nunc Cornēlia est domina familiae"}
    options:
      a: "He dies, and she becomes the head of the household."
      b: "He becomes consul, and she becomes a priestess."
      c: "He leaves Rome, and she becomes a queen."
      d: "He frees the slaves, and she becomes their patron."
    answer: a

  - id: p1
    ask: "In sentence 6, the whole household looks to Cornēlia. What does sentence 7 show about how she leads?"
    look: [6, 7]
    hint: {7: "Cornēlia līberīs cōnsilium bonum semper dat"}
    model: >-
      She leads by guiding her children: Cornēlia līberīs cōnsilium bonum semper
      dat, she always gives the children good advice. She looks after and
      teaches the family that looks to her.

  - id: p2
    ask: "Use sentences 8–9 to explain clientēla. Who gives what? Who owes what?"
    look: [8, 9]
    hint: {8: "Cornēlia est patrōna lībertōrum", 9: "lībertīs pecūniam et auxilium dat et lībertī patrōnae grātī sunt"}
    model: >-
      Cornēlia frees her slaves and becomes their patrōna. As their patron she
      gives them money and help (pecūniam et auxilium). In return the freed
      slaves, her clients, owe her gratitude and loyalty: lībertī patrōnae grātī
      sunt.

  - id: p3
    ask: "Cornēliae is in sentence 5 and sentence 10. Which is genitive and which is dative?"
    look: [5, 10]
    hint: {5: "Marītus Cornēliae", 10: "Cornēliae amōrem nūntiat"}
    model: >-
      Sentence 5, Marītus Cornēliae, is genitive: "the husband of Cornelia."
      Sentence 10, Cornēliae amōrem nūntiat, is dative: the king announces his
      love to Cornelia, so she is the Indirect Object of nūntiat.

  - id: p4
    ask: "What does the king offer in sentence 11? Give two reasons Cornēlia says no (sentences 12–13)."
    look: [11, 12, 13]
    hint: {11: "rēgīna Aegyptī es Multam pecūniam et multās gemmās habēs", 12: "Rōmānī rēgēs nōn amant", 13: "Cornēliae līberī cārī sunt nōn dōna rēgis"}
    model: >-
      He offers to make her queen of Egypt, with much money and many jewels.
      She says no because she is Roman, and Romans do not love kings; and
      because her children are dear to her, not the king's gifts.

  - id: q4
    ask: "Sentences 14–15: What does the woman from Campania show Cornelia, and what does she ask her?"
    look: [14, 15]
    hint: {14: "Fēmina Cornēliae gemmās et ōrnāmenta sua mōnstrat", 15: "Ubi sunt ōrnāmenta tua"}
    options:
      a: "She shows off her jewels and asks where Cornelia's jewelry is."
      b: "She shows her children and asks about Cornelia's sons."
      c: "She shows a letter from the king and asks Cornelia to marry him."
      d: "She shows her house and asks Cornelia to stay."
    answer: a

  - id: q5
    ask: "Sentences 16–17: What are Cornelia's “jewels”?"
    look: [16, 17]
    hint: {16: "fēminae fīliōs mōnstrat", 17: "Haec sunt ōrnāmenta mea"}
    options:
      a: "her sons, Tiberius and Gaius"
      b: "the king's gifts"
      c: "her father's gold"
      d: "the freed slaves"
    answer: a

  - id: p5
    ask: "The king and the woman both offer wealth. How does Cornēlia answer both? How does Rome judge her (sentence 19)? Why did Romans tell this story (sentence 20)?"
    look: [16, 17, 19, 20]
    hint: {17: "Haec sunt ōrnāmenta mea", 19: "Rōmānī Cornēliam mātrem Gracchōrum vocant", 20: "mātrēs Rōmānae patriae fīliōs bonōs nōn gemmās dare dēbent"}
    model: >-
      Both times she chooses her children over riches: she will not have the
      king, and she shows the woman her sons, "These are my jewels!" Rome
      honors her: her sons become famous, and the Romans call her "mother of
      the Gracchi." Romans told the story because Roman mothers ought to give
      their country good sons, not jewels.
