# Comprehension, in English (CR-009), in story order. The app's own: the
# packet has no questions for this story.
questions:
  - id: q1
    ask: "Sentences 2–3: Who are Terra and Caelus?"
    look: [2, 3]
    hint: {3: "Terra est dea et Caelus est deus"}
    options:
      a: "Earth, a goddess, and Sky, a god"
      b: "Two of the Titans"
      c: "Saturn's children"
      d: "The first king and queen of Rome"
    answer: a

  - id: q2
    ask: "Sentences 4–5: Who are the Titans?"
    look: [4, 5]
    hint: {5: "sunt līberī Caelī et Terrae"}
    options:
      a: "The children of Sky and Earth"
      b: "The children of Jupiter"
      c: "Giants who live in the sea"
      d: "The enemies of Earth"
    answer: a

  - id: q3
    ask: "Sentences 6–7: What does Caelus do to his children?"
    look: [6, 7]
    hint: {7: "Caelus līberōs in terrā cēlat"}
    options:
      a: "He hides them inside the earth."
      b: "He swallows them."
      c: "He sends them to an island."
      d: "He makes them lords of the gods."
    answer: a

  - id: q4
    ask: "Sentence 8: Whom does Terra call for help, and how can you tell she is speaking straight to him?"
    look: [8]
    hint: {8: "Saturnum vocat Fīlī mī iuvā mātrem tuam"}
    model: >-
      She calls Saturn (Saturnum vocat). Fīlī mī is vocative, "my son", so she
      is talking to him directly: "My son, help your mother!"

  - id: q5
    ask: "Sentence 10: Where does Venus come from?"
    look: [10]
    hint: {10: "ex spūmā maris Venus nāscitur"}
    options:
      a: "From the foam of the sea"
      b: "From Jupiter's head"
      c: "From inside the earth"
      d: "From an island"
    answer: a

  - id: q6
    ask: "Sentences 12–13: Why does Saturn swallow his children?"
    look: [12, 13]
    hint: {12: "Fīlius tuus tē superāre potest", 13: "Saturnus timet"}
    options:
      a: "Earth warns him that his son can overcome him, and he is afraid."
      b: "He does not love his children, just like Caelus."
      c: "Ops tells him to."
      d: "He is hungry."
    answer: a

  - id: q7
    ask: "Sentences 14–15: How does Ops save Jupiter?"
    look: [14, 15]
    hint: {14: "Iovem in īnsulā cēlat", 15: "Ops saxum in fasciīs parat"}
    options:
      a: "She hides him on an island and gives Saturn a rock wrapped in baby blankets."
      b: "She asks Earth to hide him inside the earth."
      c: "She fights Saturn herself."
      d: "She sends him to Atlas."
    answer: a

  - id: q8
    ask: "Sentences 17–18: What happens after Jupiter defeats Saturn?"
    look: [17, 18]
    hint: {17: "Saturnus līberōs ēvomit", 18: "Tītānēs superant"}
    options:
      a: "Saturn throws up his children, and the gods and goddesses defeat the Titans."
      b: "Saturn swallows Jupiter too."
      c: "The Titans make Saturn lord of the gods again."
      d: "Jupiter hides Saturn inside the earth."
    answer: a

  - id: q9
    ask: "Sentences 19–20: Why does Atlas hold up the sky forever?"
    look: [19, 20]
    hint: {19: "Atlās contrā Iovem pugnat", 20: "Atlās caelum semper tenet"}
    options:
      a: "He fought against Jupiter."
      b: "He helped Jupiter."
      c: "Saturn ordered him to."
      d: "He is the god of the sky."
    answer: a

  - id: q10
    ask: "Sentences 9 and 20 both say “… est dominus deōrum.” Who is lord of the gods each time, and how did each one get there?"
    look: [9, 17, 20]
    hint: {9: "Saturnus Caelum superat", 17: "Iuppiter Saturnum superat", 20: "Iuppiter est dominus deōrum"}
    model: >-
      Sentence 9: Saturn, because he overcame Caelus (Saturnus Caelum
      superat). Sentence 20: Jupiter, because he overcame Saturn (Iuppiter
      Saturnum superat, sentence 17) and the gods defeated the Titans
      (sentence 18). Each son defeats his father.
