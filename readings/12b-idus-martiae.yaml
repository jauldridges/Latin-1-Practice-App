questions:
  - id: q1
    ask: "Sentence 3: What does the soothsayer answer?"
    look: [2, 3]
    hint: {3: "diēs nōndum fīnīta est"}
    options:
      a: "The day is not over yet."
      b: "Caesar is safe now."
      c: "The Ides of March are not here."
      d: "The Senate is waiting for him."
    answer: a

  - id: p1
    ask: "Brutus is Caesar’s friend (sentence 5). Why does he join the plot?"
    look: [5]
    hint: {5: "Brūtus rem pūblicam magis quam amīcum amat"}
    model: >-
      Brutus loves the Republic more than his friend. He thinks Caesar's
      power is destroying the Republic, so he chooses Rome over friendship.

  - id: p2
    ask: "Why do the conspirators hand Caesar a petition before they attack (sentences 6–7)?"
    look: [6, 7]
    hint: {6: "Caesarī libellum dant et multa verba dīcunt", 7: "Subitō coniūrātī gladiōs ostendunt"}
    model: >-
      To get close to him and distract him. While he reads and listens to
      their many words, they can surround him; then suddenly they show their
      swords.

  - id: p3
    ask: "What does “Et tū, Brūte?” show about how Caesar felt?"
    look: [8]
    hint: {8: "Et tū Brūte"}
    model: >-
      “You too, Brutus?” He is shocked and hurt: his own friend is among the
      killers. It shows he felt betrayed.

  - id: q2
    ask: "Sentence 9: What does Caesar do?"
    look: [9]
    hint: {9: "Caesar togam ad caput trahit et cadit"}
    options:
      a: "He pulls his toga over his head and falls."
      b: "He runs out of the Senate."
      c: "He calls his soldiers."
      d: "He reads the petition."
    answer: a

  - id: p4
    ask: "What do the conspirators think they have done? How do the people react (sentence 11)?"
    look: [10, 11]
    hint: {10: "Lībertās Tyrannum vincimus", 11: "populus coniūrātīs nōn favet"}
    model: >-
      They think they have defeated a tyrant and won back liberty. But the
      people don't support them.

  - id: q3
    ask: "Sentence 13: What do the angry people do?"
    look: [13]
    hint: {13: "Populus īrātus coniūrātōs ex urbe agit"}
    options:
      a: "They drive the conspirators out of the city."
      b: "They thank the conspirators."
      c: "They make Brutus dictator."
      d: "They stay home."
    answer: a

  - id: p5
    ask: "How does Antony turn the people (sentence 12)? What does sentence 15 say this story teaches?"
    look: [12, 15]
    hint: {12: "populō corpus Caesaris mōnstrat", 15: "Caesarem necāre facile est sed rem pūblicam servāre nōn est facile"}
    model: >-
      He shows the people Caesar's body and tells them Caesar left them land
      and money, so they turn against the killers. The lesson: killing Caesar
      is easy, but saving the Republic is not.
