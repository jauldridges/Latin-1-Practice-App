# Comprehension, in English (CR-009). Each question names the sentences that
# answer it (look) and the exact Latin that answers it (hint: sentence number
# -> words, punctuation ignored). A wrong answer offers "See hint", which
# highlights those words in the story.
questions:
  - id: q1
    ask: "Why does Rome have no king?"
    look: [1]
    hint: {1: "quod Rōmānī rēgem timent"}
    options:
      a: "The Romans fear kings."
      b: "The king is away at war."
      c: "The consuls forbid kings."
      d: "The Senate cannot choose one."
    answer: a

  - id: q2
    ask: "How many consuls rule Rome?"
    look: [2]
    hint: {2: "Duo cōnsulēs Rōmam regunt"}
    options:
      a: "Two"
      b: "One"
      c: "Three"
      d: "None — the Senate rules"
    answer: a

  - id: q3
    ask: "What can one consul do to the other?"
    look: [3]
    hint: {3: "Ūnus cōnsul alterum prohibēre potest Vetō clāmat"}
    options:
      a: "Stop him, by shouting “Vetō!”"
      b: "Make him leave Rome"
      c: "Name him dictator"
      d: "Send him to the field"
    answer: a

  - id: q4
    ask: "Who attacks the Romans?"
    look: [6]
    hint: {6: "Aequī populus Italicus Rōmānōs oppugnant"}
    options:
      a: "The Aequi, an Italian people"
      b: "The consuls"
      c: "The Senate"
      d: "Cincinnatus's messengers"
    answer: a

  - id: q5
    ask: "The consuls can't defeat the Aequi. What does the Senate do?"
    look: [8, 9]
    hint: {8: "Cōnsulēs Aequōs nōn superant", 9: "Senātus dictātōrem nōminat"}
    options:
      a: "It names a dictator."
      b: "It fights the Aequi itself."
      c: "It makes the consuls kings."
      d: "It warns the Aequi."
    answer: a

  - id: q6
    ask: "What is Cincinnatus doing when the messengers come?"
    look: [13, 14]
    hint: {13: "nunc agrum arat", 14: "Nūntiī ad agrum veniunt"}
    options:
      a: "Plowing his field"
      b: "Leading the army"
      c: "Talking to the Senate"
      d: "Ruling Rome as consul"
    answer: a

  - id: q7
    ask: "What does Cincinnatus tell the Romans to do?"
    look: [16]
    hint: {16: "arma portāte et pugnāte"}
    options:
      a: "Carry weapons and fight"
      b: "Run back to their fields"
      c: "Choose a new dictator"
      d: "Make peace with the Aequi"
    answer: a

  - id: q8
    ask: "How does Cincinnatus feel about power?"
    look: [18]
    hint: {18: "potestātem habet sed potestātem nōn amat"}
    options:
      a: "He has it, but he doesn't love it."
      b: "He loves it and wants more."
      c: "He is afraid of it."
      d: "He never has any."
    answer: a

  - id: q9
    ask: "What does Cincinnatus do after he saves Rome?"
    look: [19]
    hint: {19: "dictātūram dēpōnit et ad agrum redit"}
    options:
      a: "He gives up the dictatorship and goes back to his field."
      b: "He becomes king of Rome."
      c: "He stays dictator forever."
      d: "He goes to fight another war."
    answer: a

  - id: q10
    ask: "Why do the Romans always praise Cincinnatus?"
    look: [20]
    hint: {20: "quod bonus cīvis est"}
    options:
      a: "Because he is a good citizen"
      b: "Because he is a rich farmer"
      c: "Because he was a king"
      d: "Because he defeated the Senate"
    answer: a
