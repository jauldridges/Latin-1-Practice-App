      est: "is — from sum"
      dictātor: "dictator · Predicate Nominative"
      parat: "prepares — from parō"
      et: "and"
      clāmat: "shouts"
      portāte: "carry! (a command to more than one person) — from portō"
      pugnāte: "fight! (a command to more than one person) — from pugnō"

  - n: 17
    text: "Rōmānī pugnant et Aequōs superant. Cincinnātus Rōmam servat!"
    words:
      Rōmānī: "the Romans · Subject, nominative"
