    new:
      Dictātor: "dictator · Subject, nominative"
      sōlus: "alone"
      imperat: "commands"

  - n: 11
    text: "Ubi est Cincinnātus?"
    words:
      Ubi: "where"
      est: "is — from sum"
      Cincinnātus: "Cincinnatus"

  - n: 12
    text: "Cincinnātus agricola est, sed ōlim cōnsul fuit."
    new:
      ōlim: "once, long ago"
      fuit: "he was"
    words:
      Cincinnātus: "Cincinnatus · Subject, nominative"
      agricola: "farmer · Predicate Nominative"
