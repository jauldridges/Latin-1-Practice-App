      prohibēre: "to stop"
      Vetō: "I forbid"
      clāmat: "shouts"
    words:
      potest: "is able, can"

  - n: 4
    text: "Senātus cōnsulēs monet."
    new:
      Senātus: "the Senate · Subject, nominative"
      cōnsulēs: "consuls · Direct Object, accusative (same form as sentence 2)"
    words:
      monet: "warns, advises — from moneō"

  - n: 5
    text: "Nunc bellum magnum est!"
    words:
      Nunc: "now"
      bellum: "war"
      magnum: "big, great — from magnus"
      est: "is — from sum"

  - n: 6
    text: "Aequī, populus Italicus, Rōmānōs oppugnant."
    new:
      Aequī: "the Aequi · Subject, nominative"
      populus Italicus: "an Italian people · Appositive (it renames Aequī)"
      oppugnant: "attack"
    words:
      Rōmānōs: "the Romans · Direct Object, accusative"

  - n: 7
    text: "Exercitus Rōmānus in perīculō est!"
    new:
      Exercitus: "army · Subject, nominative"
      in perīculō: "in danger"
    words:
      Rōmānus: "Roman"
      est: "is — from sum"

  - n: 8
    text: "Cōnsulēs Aequōs nōn superant."
    words:
      Cōnsulēs: "consuls · Subject, nominative"
