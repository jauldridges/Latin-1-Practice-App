questions:
  - id: p1
    ask: "Antony wants all the power (sentence 1). Who comes to challenge him, and from where?"
    look: [1, 2]
    hint: {2: "Octāvius ex Graeciā cum paucīs amīcīs venit"}
    model: >-
      Octavius, Caesar's heir. He comes out of Greece with only a few friends.

  - id: p2
    ask: "Why do Caesar’s soldiers leave Antony for Octavius? Think back to Marius’s soldiers."
    look: [3]
    hint: {3: "Mīlitēs Caesaris ab Antōniō discēdunt et cum Octāviō manent"}
    model: >-
      Since Marius, soldiers have been loyal to their general, not to Rome.
      Octavius has Caesar's name and is his son by his will, so Caesar's
      soldiers follow Caesar's heir.

  - id: q1
    ask: "Sentence 4: What does Antony say about Octavius?"
    look: [4]
    hint: {4: "Sine mē puer nihil est"}
    options:
      a: "“Without me the boy is nothing!”"
      b: "“The boy is my friend!”"
      c: "“The boy has many soldiers!”"
      d: "“The boy is Caesar's son!”"
    answer: a

  - id: q2
    ask: "Sentence 7: Who is the third leader the two share the power with?"
    look: [6, 7]
    hint: {7: "cum Lepidō tertiō duce imperium dīvidunt"}
    options:
      a: "Lepidus"
      b: "Brutus"
      c: "Cassius"
      d: "Agrippa"
    answer: a

  - id: q3
    ask: "Sentence 8: Whom do they defeat in Greece?"
    look: [8]
    hint: {8: "In Graeciā Brūtum et Cassium vincunt"}
    options:
      a: "Brutus and Cassius"
      b: "Cleopatra"
      c: "Lepidus"
      d: "the Senate"
    answer: a

  - id: p3
    ask: "The two say they fight for the Republic (sentence 5). What does sentence 9 say really happens to the Republic?"
    look: [5, 9]
    hint: {5: "prō rē pūblicā pugnāre dīcunt sed prō sē pugnant", 9: "sub duōbus ducibus rēs pūblica nōn lībera est"}
    model: >-
      They say they fight for the Republic, but they really fight for
      themselves. Under two generals the Republic is not free.
