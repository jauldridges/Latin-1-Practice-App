questions:
  - id: q1
    ask: "Sentence 1: Who is Pompey's father?"
    look: [1]
    hint: {1: "pater Pompeiī est dux clārus"}
    options:
      a: "a famous general"
      b: "a poor farmer"
      c: "Sulla"
      d: "a senator from Africa"
    answer: a

  - id: p1
    ask: "Pompey is not a senator and holds no office (sentence 2). Whose soldiers are these, and who pays them?"
    look: [2, 3]
    hint: {2: "exercitum suum habet", 3: "Mīlitēs Rōmānī ducī novō pārent"}
    model: >-
      They are Pompey's own army, not Rome's. They obey their new general,
      and Pompey pays them, the way Marius paid his soldiers.

  - id: q2
    ask: "Sentence 4: Whom does Pompey support?"
    look: [4]
    hint: {4: "Pompeius Sullae favet"}
    options:
      a: "Sulla"
      b: "Marius"
      c: "Sulla's enemies"
      d: "the Senate"
    answer: a

  - id: p2
    ask: "What new name does Sulla give Pompey? What does it mean?"
    look: [5, 6]
    hint: {5: "iuvenī nōmen novum dat Magnus", 6: "Pompeius Magnus"}
    model: >-
      Magnus: “the Great.” Now he is Pompeius Magnus, Pompey the Great.

  - id: p3
    ask: "What does Pompey demand (sentence 7), and why does the law say no?"
    look: [7, 8]
    hint: {7: "triumphum postulat", 8: "lēx Rōmāna iuvenī triumphum nōn dat"}
    model: >-
      A triumph, a victory parade through Rome. The law gave a triumph only to
      an elected official, and Pompey is a young man who holds no office.

  - id: p4
    ask: "Who is the rising sun in Pompey’s answer (sentence 10)? Who is the setting sun?"
    look: [10]
    hint: {10: "sōlem orientem quam occidentem"}
    model: >-
      Pompey is the rising sun: young, with his power growing. Sulla is the
      setting sun: old, with his power ending. More people follow the one who
      is rising.

  - id: q3
    ask: "Sentence 12: What does Sulla do after Pompey's answer?"
    look: [11, 12]
    hint: {12: "Sulla rīdet et clāmat Triumphet"}
    options:
      a: "He laughs and lets him have his triumph."
      b: "He gets angry and sends him away."
      c: "He gives him money."
      d: "He makes him a senator."
    answer: a

  - id: p5
    ask: "The law said no, but Pompey got his triumph. What does sentence 14 say this story teaches? Do you agree?"
    look: [13, 14]
    hint: {14: "sī dux mīlitēs et populum habet lēx parva est"}
    model: >-
      If a general has the soldiers and the people behind him, the law counts
      for little. Whether you agree is up to you; a good answer uses the story.
