questions:
  - id: q1
    ask: "Sentences 1–2: Who is Juno?"
    look: [1, 2]
    hint: {1: "Iūnō est rēgīna deōrum", 2: "Iūnō est soror et uxor Iovis"}
    options:
      a: "Queen of the gods, and Jupiter's sister and wife"
      b: "Jupiter's daughter"
      c: "The goddess of war"
      d: "A mortal woman Jupiter loves"
    answer: a

  - id: q2
    ask: "Sentence 4: What does Mars always love?"
    look: [4]
    hint: {4: "bellum semper amat"}
    options:
      a: "War"
      b: "Music"
      c: "Wine"
      d: "His mother"
    answer: a

  - id: q3
    ask: "Sentence 5: Vulcan is not handsome. What does he do?"
    look: [5]
    hint: {5: "arma deōrum parat"}
    options:
      a: "He makes the gods' weapons."
      b: "He carries the gods' messages."
      c: "He protects Athens."
      d: "He fights in every war."
    answer: a

  - id: q4
    ask: "Sentence 6: Why is Juno angry?"
    look: [6]
    hint: {6: "Iuppiter multās aliās fēminās amat"}
    options:
      a: "Jupiter loves many other women."
      b: "Mars always loves war."
      c: "Vulcan is not handsome."
      d: "Jupiter is lord of the gods."
    answer: a

  - id: q5
    ask: "Sentence 9: What are Apollo and Diana the gods of?"
    look: [9]
    hint: {9: "Apollō est deus mūsicae et lūcis Diāna est dea silvārum et lūnae"}
    options:
      a: "Apollo: music and light. Diana: the forests and the moon."
      b: "Apollo: war. Diana: wisdom."
      c: "Apollo: wine. Diana: grain."
      d: "Apollo: the sea. Diana: the sky."
    answer: a

  - id: q6
    ask: "Sentence 11: What are Mercury's two jobs?"
    look: [11]
    hint: {11: "nūntius deōrum et deus pecūniae"}
    options:
      a: "Messenger of the gods and god of money"
      b: "God of war and god of fire"
      c: "King of the gods and god of the sky"
      d: "God of wine and god of music"
    answer: a

  - id: q7
    ask: "Iovis appears in sentences 3, 10 and 12. What case is it, and what does it mean each time?"
    look: [3, 10, 12]
    hint: {3: "Fīliī Iovis", 10: "Fīlius Māiae et Iovis", 12: "Fīlius Semelēs et Iovis"}
    model: >-
      Genitive: "of Jupiter". Fīliī Iovis = the sons of Jupiter; Fīlius Māiae
      et Iovis = the son of Maia and Jupiter; Fīlius Semelēs et Iovis = the son
      of Semele and Jupiter. The story names each child "of" its parents with
      the genitive.

  - id: q8
    ask: "Sentences 12–13: How is Bacchus's mother different from the other mothers in the story?"
    look: [12]
    hint: {12: "Semelē est fēmina mortālis"}
    model: >-
      Semele is a mortal, human woman (fēmina mortālis). The other mothers are
      goddesses (Juno, Ceres) or Titans' daughters (Latona, Maia).

  - id: q9
    ask: "Sentences 16–17: Why does Minerva have no mother?"
    look: [16, 17]
    hint: {17: "ē capite Iovis nāscitur"}
    options:
      a: "She is born out of Jupiter's head."
      b: "Her mother is hidden inside the earth."
      c: "She is born from the foam of the sea."
      d: "Juno is angry with her mother."
    answer: a

  - id: q10
    ask: "Sentence 18: Which city does Minerva protect?"
    look: [18]
    hint: {18: "Athēnās servat"}
    options:
      a: "Athens"
      b: "Rome"
      c: "Troy"
      d: "Carthage"
    answer: a
