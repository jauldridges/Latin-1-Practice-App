questions:
  - id: p1
    ask: "Cicero is a homō novus like Marius (sentence 1). How is Cicero’s strength different from Marius’s (sentence 2)?"
    look: [1, 2]
    hint: {2: "verba Cicerōnis sunt arma eius"}
    model: >-
      Marius's strength was his soldiers. Cicero is not a soldier: his words
      are his weapons.

  - id: q1
    ask: "Sentence 4: What does Cicero become?"
    look: [4]
    hint: {4: "Cicerō est cōnsul"}
    options:
      a: "consul"
      b: "dictator"
      c: "a soldier"
      d: "king"
    answer: a

  - id: p2
    ask: "Catiline is a noble. What is his plan (sentences 6–7)?"
    look: [6, 7]
    hint: {6: "mīlitēs fortēs parat", 7: "cōnsulēs necāre et Rōmam incendere cupit"}
    model: >-
      He does not obey the laws and gets brave soldiers ready. He wants to
      kill the consuls and burn Rome.

  - id: p3
    ask: "Cicero calls the Senate, not soldiers (sentence 8). How do the senators treat Catiline after the speech?"
    look: [8, 9, 10]
    hint: {10: "Omnēs senātōrēs Catilīnam spectant sed nūllus senātor nōbilī malō favet"}
    model: >-
      They all look at him, but not one senator supports him, even though he
      is a noble.

  - id: q2
    ask: "Sentence 11: What does Catiline do?"
    look: [11]
    hint: {11: "Catilīna Rōmam relinquit et ad mīlitēs suōs fugit"}
    options:
      a: "He leaves Rome and runs to his soldiers."
      b: "He burns Rome."
      c: "He becomes consul."
      d: "He obeys the laws."
    answer: a

  - id: p4
    ask: "How did Cicero save Rome without an army (sentences 9–12)?"
    look: [9, 10, 11, 12]
    hint: {9: "Quō usque tandem abūtēre Catilīna patientiā nostrā", 12: "Verba fortia Cicerōnis senātōribus omnibus placent"}
    model: >-
      With a speech. He called the Senate and spoke against Catiline to his
      face; no senator would support Catiline, so he left Rome. Cicero's
      strong words won over all the senators.

  - id: q3
    ask: "Sentence 13: What name does the Senate give Cicero?"
    look: [13]
    hint: {13: "Pater Patriae"}
    options:
      a: "Father of the Fatherland"
      b: "the Great"
      c: "Lucky"
      d: "a new man"
    answer: a

  - id: p5
    ask: "Cicero put citizens to death without a trial (sentence 14). Did he save the law or break it? Use sentences 15–16."
    look: [14, 15, 16]
    hint: {14: "sine iūdiciō necat", 15: "Cicerō Rōmam relinquere dēbet"}
    model: >-
      Both answers can be argued. He saved the Republic with words, not
      weapons (sentence 16), but he broke the law by killing citizens without
      a trial, and later many Romans turned against him and he had to leave
      Rome (sentence 15).
