questions:
  - id: q1
    ask: "Sentence 1: What is Marius's father?"
    look: [1]
    hint: {1: "Pater Mariī est agricola"}
    options:
      a: "a farmer"
      b: "a senator"
      c: "a consul"
      d: "a king"
    answer: a

  - id: q2
    ask: "Sentence 3: Who is Jugurtha?"
    look: [3]
    hint: {3: "In Āfricā est rēx malus Iugurtha"}
    options:
      a: "a bad king in Africa"
      b: "a Roman senator"
      c: "a soldier in Marius's army"
      d: "a new man from Rome"
    answer: a

  - id: p1
    ask: "Why would a king give money to Roman senators? What does that say about the Senate?"
    look: [4, 5]
    hint: {4: "rēx senātōribus pecūniam dat", 5: "Senātōrēs pecūniam rēgis amant itaque rēgem nōn superant"}
    model: >-
      To bribe them. The senators love the king's money, so they do not fight
      him, even though he harms Romans. The Senate cared more about money
      than about Rome.

  - id: p2
    ask: "Sentence 6 says the people are angry. Who are they angry at, and why?"
    look: [5, 6]
    hint: {6: "Populus Rōmānus īrātus est"}
    model: >-
      At the Senate: the senators took Jugurtha's money and did not defeat
      him, though he was harming Romans. So the people trusted Marius instead
      and made him consul.

  - id: q3
    ask: "Sentence 6: What does Marius become?"
    look: [6]
    hint: {6: "Marius est cōnsul"}
    options:
      a: "consul"
      b: "king"
      c: "a farmer"
      d: "a senator"
    answer: a

  - id: p3
    ask: "A Roman soldier used to need land (sentence 7). Who does Marius let into the army now?"
    look: [7, 8]
    hint: {7: "mīles Rōmānus agrum habēre dēbet", 8: "Marius hominī miserō arma et pecūniam dat"}
    model: >-
      Poor men with no land. Many farmers have no fields, so Marius gives a
      poor man weapons and money, and now he is a Roman soldier.

  - id: p4
    ask: "Who pays the soldier now: Rome or his general? Why does that matter?"
    look: [10]
    hint: {10: "dux mīlitī pecūniam dat"}
    model: >-
      His general pays him. So the soldier always obeys his own general, not
      Rome or the Senate: an army now belongs to the man who pays it.

  - id: q4
    ask: "Sentence 11: What happens to Jugurtha?"
    look: [11]
    hint: {11: "Marius Iugurtham superat"}
    options:
      a: "Marius defeats him."
      b: "He pays Marius money."
      c: "He becomes consul."
      d: "He runs away to Rome."
    answer: a

  - id: p5
    ask: "Who does the soldier love now (sentence 13)? Use sentence 14: why did Romans tell this story?"
    look: [13, 14]
    hint: {13: "mīles nōn senātum sed ducem amat", 14: "ubi mīles ducī magis quam lēgī pāret rēs pūblica in perīculō est"}
    model: >-
      He loves his general, not the Senate. Romans told the story as a
      warning: when a soldier obeys his general more than the law, the
      Republic is in danger.
