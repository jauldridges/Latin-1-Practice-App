# Comprehension, in English (CR-009), in story order. The app's own: the
# packet has no questions for this story.
questions:
  - id: q1
    ask: "Sentence 4: Who is Pluto?"
    look: [4]
    hint: {4: "Plūtō deus mortuōrum"}
    options:
      a: "The god of the dead"
      b: "The messenger of the gods"
      c: "Proserpina's father"
      d: "The god of the fields"
    answer: a

  - id: q2
    ask: "Sentences 3–5: What happens to Proserpina in the meadow?"
    look: [3, 4, 5]
    hint: {5: "Plūtō Prōserpinam rapit et sub terram ad rēgnum suum portat"}
    options:
      a: "Pluto carries her off under the earth to his kingdom."
      b: "She runs away from her mother."
      c: "She gets lost in the forest."
      d: "Mercury takes her to Jupiter."
    answer: a

  - id: q3
    ask: "Sentences 6–8: Ceres can't find her daughter. What happens to the fields?"
    look: [6, 7, 8]
    hint: {7: "agrōs nōn cūrat", 8: "agrī nihil frūmentī habent"}
    options:
      a: "Ceres stops taking care of them, and they grow no grain."
      b: "They grow more grain than ever."
      c: "Pluto takes them for his kingdom."
      d: "The farmers stop working, so Ceres is angry."
    answer: a

  - id: q4
    ask: "Sentence 9: Why are even the gods afraid?"
    look: [9]
    hint: {9: "hominēs nūlla dōna deīs dant"}
    options:
      a: "People give the gods no gifts."
      b: "Pluto is coming for them too."
      c: "Ceres is going to fight Jupiter."
      d: "The people want a new king."
    answer: a

  - id: q5
    ask: "Sentences 10–11: What does Jupiter tell Mercury to do?"
    look: [10, 11]
    hint: {11: "Portā Prōserpinam ad mātrem"}
    options:
      a: "Bring Proserpina back to her mother."
      b: "Punish Pluto."
      c: "Give the gods gifts."
      d: "Take care of the fields."
    answer: a

  - id: q6
    ask: "Sentence 11: Find the two commands Jupiter gives, and the word that shows whom he is talking to."
    look: [11]
    hint: {11: "Mercurī clāmat Iuppiter iuvā Cererem Portā"}
    model: >-
      The commands are iuvā ("help!") and portā ("carry, bring!"). Mercurī is
      vocative, so Jupiter is talking to Mercury.

  - id: q7
    ask: "Sentences 13–14: Why can't Proserpina just go home for good?"
    look: [13, 14]
    hint: {13: "sex grāna Pūnicī mālī gustat", 14: "sī cibum mortuōrum gustās in rēgnō mortuōrum manēre dēbēs"}
    options:
      a: "She tasted six pomegranate seeds, and the gods' law says whoever tastes the food of the dead must stay."
      b: "Pluto won't let Mercury into his kingdom."
      c: "She wants to stay with Pluto forever."
      d: "Jupiter changes his mind."
    answer: a

  - id: q8
    ask: "Sentence 15: How does Proserpina spend her year?"
    look: [15]
    hint: {15: "sex mēnsēs cum Plūtōne et sex mēnsēs cum mātre habitat"}
    options:
      a: "Six months with Pluto and six months with her mother"
      b: "All year with her mother"
      c: "All year with Pluto"
      d: "Six seeds' worth of days with Pluto, then home for good"
    answer: a

  - id: q9
    ask: "Sentences 16–18: What do the Romans explain with this story? Use the Latin to show which season goes with which half of Proserpina's year."
    look: [16, 17, 18]
    hint: {16: "Cerēs laeta est", 17: "Cerēs misera est", 18: "hiemem et aestātem explicant"}
    model: >-
      Winter and summer (hiemem et aestātem, sentence 18). When Proserpina is
      with her mother, Ceres is happy (laeta) and the fields have a lot of
      grain: summer (sentence 16). When she is under the earth, Ceres is
      unhappy (misera) and the fields have nothing: winter (sentence 17).
