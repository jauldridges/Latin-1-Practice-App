questions:
  - id: q1
    ask: "Sentence 2: Where does Octavius come with a big army?"
    look: [2]
    hint: {2: "ad urbem Alexandrīam venit"}
    options:
      a: "to the city of Alexandria"
      b: "to Rome"
      c: "to Actium"
      d: "to Greece"
    answer: a

  - id: p1
    ask: "What happens to Antony’s army (sentence 3)? What false message comes to him (sentence 4)?"
    look: [3, 4]
    hint: {3: "Mīlitēs Antōniī ducem suum relinquunt et ad Octāvium trānseunt", 4: "Cleopātra mortua est"}
    model: >-
      His soldiers leave their own general and go over to Octavius. A false
      message comes: “Cleopatra is dead!”

  - id: p2
    ask: "gladiō has no preposition. What job is it doing?"
    look: [5]
    hint: {5: "sē gladiō suō necat"}
    model: >-
      It's the tool he uses: he kills himself with his own sword. An ablative
      with no preposition that answers “with what?” is the ablative of means.

  - id: q2
    ask: "Sentence 7: Where does Antony die?"
    look: [6, 7]
    hint: {7: "Antōnius in bracchiīs Cleopātrae moritur"}
    options:
      a: "in Cleopatra's arms"
      b: "on his ship"
      c: "in the Senate"
      d: "in Rome"
    answer: a

  - id: p3
    ask: "Why does Octavius want Cleopatra alive? Use sentences 8–9."
    look: [8, 9]
    hint: {8: "Rēgīnam vīvam capere cupit", 9: "Octāvius Cleopātram in triumphō per viās Rōmae dūcere cupit"}
    model: >-
      He wants to capture her alive so he can lead her through the streets of
      Rome in his triumph, showing off the defeated queen.

  - id: p4
    ask: "How does Cleopatra keep Octavius from leading her in his triumph (sentences 10–12)?"
    look: [10, 11, 12]
    hint: {11: "serpentem in calathō cum fīcīs portat", 12: "Cleopātra serpente sē necat"}
    model: >-
      She sees through his plan. A loyal slave brings her a snake hidden in a
      basket of figs, and she kills herself with the snake, so she never
      walks in his triumph.

  - id: q3
    ask: "Sentence 15: What does Egypt become?"
    look: [15]
    hint: {15: "Nunc Aegyptus est prōvincia Rōmāna"}
    options:
      a: "a Roman province"
      b: "a free kingdom"
      c: "Octavius's home"
      d: "Antony's province"
    answer: a

  - id: p5
    ask: "Sentences 17–19 show how Rome remembered Cleopatra. Sentence 20 asks who tells her story. Why does that question matter?"
    look: [17, 18, 19, 20]
    hint: {20: "hanc fābulam scrībunt amīcī Octāviī Quis fābulam Cleopātrae nārrat"}
    model: >-
      The story we have was written by Octavius's friends and poets, the
      winners, so it makes Rome good and Egypt bad. Cleopatra's side never
      got to tell it. When only one side tells a story, we should ask what
      the other side would say.
