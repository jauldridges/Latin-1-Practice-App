questions:
  - id: q1
    ask: "Sentences 1–2: What are the two orders in Rome, and how are the patricians different?"
    look: [1, 2]
    hint: {2: "Patriciī sunt paucī sed multum pecūniae et multōs agrōs habent"}
    options:
      a: "Patricians and plebeians; the patricians are few but have a lot of money and land."
      b: "Patricians and plebeians; the patricians are many and poor."
      c: "Senators and slaves; the senators are farmers."
      d: "Kings and soldiers; the kings fight in the wars."
    answer: a

  - id: p1
    ask: "Who gives orders to whom in sentence 4? What does that tell you about who holds power?"
    look: [4]
    hint: {4: "Patriciī plēbēiīs imperant"}
    model: >-
      The patricians give orders to the plebeians (Patriciī plēbēiīs imperant),
      and the plebeians must obey the patricians. The patricians hold the power.

  - id: p2
    ask: "Use sentences 4–5: why are the plebeians miserī?"
    look: [4, 5]
    hint: {4: "patriciī plēbēiīs nōn favent", 5: "Multī plēbēiī patriciīs pecūniam dēbent et patriciī plēbēiīs saepe nocent"}
    model: >-
      The patricians don't support them and give them orders; many plebeians
      owe the patricians money, and the patricians often harm them.

  - id: q2
    ask: "Sentences 6–7: What do the plebeians do, and why is that a problem for Rome?"
    look: [6, 7]
    hint: {6: "Rōmam relinquunt et in Monte Sacrō manent", 7: "Rōma nūllōs agricolās et nūllōs mīlitēs habet"}
    options:
      a: "They leave Rome for the Sacred Mount, so Rome has no farmers and no soldiers."
      b: "They attack the patricians, so Rome is at war."
      c: "They stop paying their debts, so Rome has no money."
      d: "They choose a king, so Rome is no longer free."
    answer: a

  - id: q3
    ask: "Sentences 8–9: What do the frightened patricians do?"
    look: [8, 9]
    hint: {8: "Menēnium Agrippam virum clārum ad plēbēiōs mittunt"}
    options:
      a: "They send Menenius Agrippa, a famous man, to the plebeians, and he tells them a story."
      b: "They send soldiers to bring the plebeians back."
      c: "They write the laws on twelve tablets."
      d: "They give the plebeians their land."
    answer: a

  - id: p3
    ask: "In Menenius's story, what do the parts of the body refuse to do, and what happens (sentences 10–11)?"
    look: [10, 11]
    hint: {11: "membra ventrī cibum nōn dant Sed nunc tōtum corpus aegrum est"}
    model: >-
      The parts of the body complain that the stomach does no work, so they
      refuse to give the stomach food. Then the whole body is sick.

  - id: p4
    ask: "In sentence 12, who is the stomach and who are the parts of the body? Who benefits if the plebeians believe this story?"
    look: [12]
    hint: {12: "Patriciī sunt venter vōs plēbēiī estis membra"}
    model: >-
      The patricians are the stomach, and the plebeians are the parts of the
      body. The patricians benefit: if the plebeians believe the story, they
      come back to farm and fight for Rome, and the patricians keep their place.

  - id: p5
    ask: "What does a tribune do (sentences 14–15)? How does sentence 17 explain why Romans told this story?"
    look: [14, 15, 17]
    hint: {15: "sī patricius plēbēiō nocet tribūnus Vetō clāmat", 17: "sine concordiā Rōma magna nōn est"}
    model: >-
      A tribune protects the plebeians: if a patrician harms a plebeian, the
      tribune shouts "Vetō!", "I forbid!" Sentence 17 says that without
      harmony (sine concordiā) Rome is not great, so Romans told the story to
      praise unity between the orders.

  - id: q4
    ask: "Sentence 16: What do the Romans do with the laws later?"
    look: [16]
    hint: {16: "lēgēs in duodecim tabulīs scrībunt et omnēs lēgēs vident"}
    options:
      a: "They write them on twelve tablets, so everyone can see them."
      b: "They give them to the king."
      c: "They hide them in a temple."
      d: "They send them to the Sacred Mount."
    answer: a
