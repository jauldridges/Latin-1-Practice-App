questions:
  - id: q1
    ask: "Sentence 1: What kind of Roman is Sulla?"
    look: [1]
    hint: {1: "est patricius et dux clārus"}
    options:
      a: "a patrician and a famous general"
      b: "a new man and a farmer"
      c: "a poor soldier"
      d: "a king in Asia"
    answer: a

  - id: p1
    ask: "The Senate gave the war to Sulla (sentence 3). Who takes it away? Why does Marius want it?"
    look: [3, 4]
    hint: {3: "Senātus Sullae bellum in Asiā dat", 4: "Marius nōmen clārum cupit et populus Mariō bellum dat"}
    model: >-
      The people take the war from Sulla and give it to Marius. Marius wants
      a famous name, and a big war in rich Asia means glory and money.

  - id: p2
    ask: "Why is sentence 7 so shocking? Use what you know about Marius’s soldiers."
    look: [5, 6, 7]
    hint: {5: "Mīlitēs Sullae ducī suō nōn senātuī pārent", 7: "nūllus dux mīlitēs Rōmam dūcit"}
    model: >-
      No general had ever led soldiers against Rome itself. Since Marius,
      soldiers are paid by their general and obey him, not the Senate, so
      Sulla's army follows him even into Rome.

  - id: q2
    ask: "Sentence 8: What does Marius do?"
    look: [8]
    hint: {8: "Marius ex urbe fugit"}
    options:
      a: "He runs away out of the city."
      b: "He fights Sulla in the city."
      c: "He becomes dictator."
      d: "He gives Sulla the war."
    answer: a

  - id: q3
    ask: "Sentence 9: What does Sulla become?"
    look: [9]
    hint: {9: "Sulla est dictātor"}
    options:
      a: "dictator, with all the power"
      b: "consul for one year"
      c: "a senator"
      d: "a farmer in Asia"
    answer: a

  - id: p3
    ask: "What does Sulla write on the tablets? Why would a list of names terrify Rome?"
    look: [10]
    hint: {10: "nōmina inimīcōrum in tabulīs scrībit"}
    model: >-
      The names of his enemies. Anyone could be on the list, and a name on it
      meant death, so every Roman was afraid.

  - id: p4
    ask: "What happens to a man whose name is on the list (sentences 11–12)?"
    look: [11, 12]
    hint: {11: "caput hominis pretium habet", 12: "nūllus Rōmānus tūtus est"}
    model: >-
      There is a price on his head: anyone who kills him gets paid. No Roman
      is safe.

  - id: q4
    ask: "Sentence 13: What new name does Sulla give himself?"
    look: [13]
    hint: {13: "sibi nōmen novum dat Fēlīx"}
    options:
      a: "“Fēlīx,” Lucky"
      b: "“Magnus,” the Great"
      c: "“Pater Patriae,” Father of the Fatherland"
      d: "“Dictātor,” Dictator"
    answer: a

  - id: p5
    ask: "Sulla calls himself “Lucky,” then gives up his power (sentence 14). Why did Romans tell this story (sentence 15)?"
    look: [13, 14, 15]
    hint: {14: "Sulla imperium relinquit", 15: "ubi dux mīlitēs Rōmam dūcit lēgēs nihil valent"}
    model: >-
      As a warning: when a general leads his soldiers into Rome, the laws are
      worth nothing. Sulla gave power back, but he had shown every general
      after him how to take it.
