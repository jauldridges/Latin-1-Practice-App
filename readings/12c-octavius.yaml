questions:
  - id: q1
    ask: "Sentence 1: Who is Caesar to Octavius?"
    look: [1]
    hint: {1: "Caesar est avunculus eius"}
    options:
      a: "his great-uncle"
      b: "his father"
      c: "his teacher"
      d: "his enemy"
    answer: a

  - id: p1
    ask: "Where is Octavius when he hears the news? What does Caesar’s will do (sentence 3)?"
    look: [2, 3]
    hint: {2: "in Apollōniā trāns mare", 3: "Caesar Octāvium fīlium suum facit"}
    model: >-
      He is in Apollonia, across the sea. In his will Caesar makes Octavius
      his own son, so now his name is “Caesar.”

  - id: p2
    ask: "His mother warns him (sentence 4). Why does he go anyway?"
    look: [4, 5]
    hint: {5: "Rōmam veniō quod nōmen Caesaris habeō"}
    model: >-
      Because he has Caesar's name: “I'm coming to Rome, because I have the
      name of Caesar.” He thinks the name gives him the right, and the duty,
      to go.

  - id: p3
    ask: "Why would Caesar’s soldiers follow an 18-year-old? Think back to Marius’s soldiers."
    look: [6]
    hint: {6: "Mīlitēs Caesaris nōmen Caesaris audiunt et ad iuvenem veniunt"}
    model: >-
      They hear Caesar's name. Since Marius, soldiers have been loyal to
      their general, not to Rome; Caesar's soldiers follow Caesar's heir, who
      can also pay them.

  - id: p4
    ask: "Antony calls him a boy who knows nothing (sentence 7). How does sentence 8 prove Antony wrong?"
    look: [7, 8]
    hint: {7: "Puer est Nihil scit", 8: "Octāvius multa scit coniūrātōs invenit et vincit"}
    model: >-
      Octavius knows a lot: he finds the conspirators and defeats them. The
      “boy” wins.

  - id: q2
    ask: "Sentence 10: What does Octavius tell the Romans about Antony?"
    look: [9, 10]
    hint: {10: "Antōnius nōn iam Rōmānus est Rēgīnae Aegyptī pāret"}
    options:
      a: "He is no longer a Roman; he obeys the queen of Egypt."
      b: "He is the best Roman of all."
      c: "He has gone back to Rome."
      d: "He is Caesar's son."
    answer: a

  - id: q3
    ask: "Sentence 13: What name does the Senate give Octavius?"
    look: [13]
    hint: {13: "Augustus"}
    options:
      a: "Augustus, “the honored one”"
      b: "Caesar"
      c: "Magnus, “the Great”"
      d: "Pater Patriae"
    answer: a

  - id: p5
    ask: "Augustus says he gives the Republic back (sentence 14), but everyone obeys him (sentence 15). Is the Republic free? Use sentence 16."
    look: [14, 15, 16]
    hint: {14: "Rem pūblicam Rōmānīs reddō", 15: "omnēs Augustō pārent", 16: "rēs pūblica lībera nōn iam est"}
    model: >-
      No. He calls himself not a king and says he gives the Republic back,
      but everyone obeys him. He brings peace, but the Republic is no longer
      free.
