questions:
  - id: p1
    ask: "Where does Antony go after Philippi? How does Cleopatra meet him (sentence 2)?"
    look: [1, 2]
    hint: {1: "trāns mare in Asiam nāvigat", 2: "Cleopātra ad Antōnium in nāve aureā venit"}
    model: >-
      After the victory at Philippi he sails across the sea to Asia, the Roman
      East. Cleopatra comes to him in a golden ship.

  - id: p2
    ask: "Sentence 3 has in Aegyptum and in Aegyptō. Why the two different endings?"
    look: [3]
    hint: {3: "in Aegyptum nāvigat et in Aegyptō multōs annōs manet"}
    model: >-
      In with the accusative (Aegyptum) shows motion: he sails into Egypt.
      In with the ablative (Aegyptō) shows a place: he stays in Egypt.

  - id: q1
    ask: "Sentence 4: Who is Octavia?"
    look: [4]
    hint: {4: "Octāvia soror Octāviī est uxor Antōniī"}
    options:
      a: "Octavius's sister, and Antony's wife"
      b: "Cleopatra's daughter"
      c: "Antony's sister"
      d: "Octavius's mother"
    answer: a

  - id: q2
    ask: "Sentence 5: What does Antony give Cleopatra and her children?"
    look: [5]
    hint: {5: "terrās Rōmānās dat"}
    options:
      a: "Roman lands"
      b: "a golden ship"
      c: "his will"
      d: "an army"
    answer: a

  - id: p3
    ask: "What does Octavius read in the Senate (sentence 6)? Why does the Senate declare war on Cleopatra, not Antony (sentences 7–9)?"
    look: [6, 7, 8, 9]
    hint: {6: "testāmentum Antōniī legit", 8: "Senātus bellum contrā Cleopātram nūntiat"}
    model: >-
      He reads Antony's will. He says Antony obeys a foreign queen and fights
      against Rome. Declaring war on Cleopatra makes it a war against Egypt,
      not another civil war of Roman against Roman, and the story says a good
      Roman obeys his country, not a queen.
