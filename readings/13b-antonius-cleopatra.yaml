    words:
      bellum: "war · Direct Object, accusative"
      contrā: "against — with the accusative"
      Cleopātram: "Cleopatra · accusative"
      nūntiat: "announces, declares — from nūntiō"

  - n: 9
    text: "Rōmānī hanc fābulam nārrant: bonus Rōmānus patriae, nōn rēgīnae, pāret."
    new:
