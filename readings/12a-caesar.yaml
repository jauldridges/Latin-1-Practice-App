questions:
  - id: q1
    ask: "Sentence 2: What does Caesar do?"
    look: [2]
    hint: {2: "Caesar mīlitēs trāns Rubicōnem dūcit et Pompeium superat"}
    options:
      a: "He leads his soldiers across the Rubicon and defeats Pompey."
      b: "He leaves his soldiers and runs away from Pompey."
      c: "He sends Pompey a letter."
      d: "He obeys the Senate."
    answer: a

  - id: p1
    ask: "Caesar laughs at the warning (sentences 4–5). What does his question show about him?"
    look: [4, 5]
    hint: {4: "Cavē Īdūs Mārtiās", 5: "cūr Īdūs Mārtiās timēre dēbeō"}
    model: >-
      He asks why he should fear the Ides of March: he thinks nothing can hurt
      him. It shows he is proud and overconfident, and doesn't take the
      warning seriously.

  - id: p2
    ask: "What does Calpurnia see (sentence 7)? What two commands does she give?"
    look: [7, 8]
    hint: {7: "somnium malum videt", 8: "Nōlī ad senātum venīre Caesar Fac quod dīcō"}
    model: >-
      She sees a bad dream. Her commands: “Nōlī ad senātum venīre!”, Don't
      come to the Senate!, and “Fac quod dīcō!”, Do what I say!

  - id: q2
    ask: "Sentence 9: How does Caesar treat his wife's warning?"
    look: [9]
    hint: {9: "Caesar uxōrī nōn crēdit"}
    options:
      a: "He doesn't believe her."
      b: "He obeys her and stays home."
      c: "He tells the Senate about it."
      d: "He asks the soothsayer about it."
    answer: a

  - id: p3
    ask: "What do Caesar’s friends want him to bring? What does his answer in sentence 11 show?"
    look: [10, 11]
    hint: {10: "Dūc mīlitēs tuōs ad senātum", 11: "Mīlitēs nōn dūcō Rōmānī mē amant"}
    model: >-
      They want him to bring his soldiers to the Senate. He refuses: “I don't
      lead soldiers. The Romans love me.” He trusts that he is loved and
      thinks he needs no protection.

  - id: p4
    ask: "What warning is in the letter? Why does it matter that Caesar doesn’t read it (sentence 13)?"
    look: [12, 13]
    hint: {12: "Coniūrātī tē necāre cupiunt", 13: "Caesar epistulam tenet sed nōn legit"}
    model: >-
      The letter warns that conspirators want to kill him. He holds the
      warning in his hand but doesn't read it, so he walks into the Senate
      without knowing; he could have been saved.

  - id: q3
    ask: "Sentence 14: What does Caesar order the senators to do?"
    look: [14]
    hint: {14: "Dīcite mihi verba vestra"}
    options:
      a: "Tell him what they have to say."
      b: "Leave the Senate."
      c: "Bring their soldiers."
      d: "Read a letter."
    answer: a

  - id: p5
    ask: "Caesar gives orders even to the senators. What does sentence 15 say this story teaches?"
    look: [14, 15]
    hint: {15: "deī et amīcī Caesarem monent sed superbus Caesar nēminī pāret"}
    model: >-
      The gods and his friends warn Caesar, but the proud Caesar obeys no one.
      Pride that won't listen to any warning leads to a fall.
