      v3:
        change: "Two options — the pointing reason and the copying model."
        options: {a: "Because the ending is what shows which noun the adjective belongs to, and an ending that agrees with nothing points at nothing.", b: "Because the adjective copies the noun's spelling, so it has no choice."}
        answer: a
    teaching: ''

  - id: MS045-APPLY-02
    node: MS-045
    assess: apply
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "The adjective is clāra. Which one of these nouns could it be describing?"
    options:
      a: "fēmina"
      b: "dominus"
      c: "bellum"
      d: "puerī"
    answer: a
    touches: [MS-042, MS-043, MS-044, MS-026]
    what_went_wrong:
      - text: "I picked a masculine noun"
        node: MS-045
      - text: "I picked a neuter noun"
        node: MS-045
      - text: "I picked a plural"
        node: MS-044
    note: >
      SHAPE ADDED: the reverse direction. MS045-APPLY-01 gives the noun and asks
      for the adjective, which is the writing task; this gives the adjective and
      asks which noun it can belong to, which is the reading task — and it is
      the harder of the two, because the student must run agreement backwards.
      Each wrong choice fails once: b in gender, c in gender, d in number.
      clāra could in principle also be a neuter plural, so no neuter plural is
      offered; bellum is singular and safe.
    versions:
      v2: {change: "Glosses added: clāra [famous], fēmina [woman], dominus [master], bellum [war], puerī [boys]; one option per line."}
      v3:
        change: "Two options — the feminine singular and the masculine singular."
        options: {a: "fēmina", b: "dominus"}
        answer: a
    teaching: ''

  - id: MS047-TRANS-02
    node: MS-047
    assess: translate
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: >-
      Write two pieces of Latin: one meaning "the good queen", and one meaning
      "The queen is good."
    boxes:
      - label: "the good queen"
        answer: [regina bona, bona regina]
      - label: "The queen is good."
        answer: [regina est bona, regina bona est, bona est regina, est regina bona]
    order_matters: true
    touches: [MS-041, MS-042, MS-040, MS-046]
    what_went_wrong:
      - text: "I wrote the same thing in both boxes"
        node: MS-047
      - text: "I put est in the phrase as well"
        node: MS-041
      - text: "I left est out of the sentence"
        node: MS-041
    note: >
      SHAPE ADDED: producing both positions. MS047-RECOG-01 asks which of four
      is attributive and MS047-TRANS-01 is a self-check on two Latin sentences —
      both start from Latin already written. Writing the pair is what makes the
      difference physical: one needs est and one must not have it, and a student
      who writes the same thing twice has shown you the misunderstanding
      directly. Several word orders are accepted because Latin allows them and
      MS-012 says so.
    versions:
      v2: {change: "Placeholders 'two words' and 'three words'; the two English cues on separate lines."}
      v3:
        change: "Reduced to matching: which of rēgīna bona and rēgīna est bona means 'the good queen'."
        format: choice
        options: {a: "rēgīna bona", b: "rēgīna est bona"}
        answer: a
    teaching: ''

  - id: MS048-RECOG-02
    node: MS-048
    assess: recognize
    tier: 3
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "In Bona laudāmus, what is bona doing?"
    options:
      a: "Standing in for a noun — 'good things', the object of the verb."
      b: "Describing a noun that appears later in the sentence."
      c: "Acting as the subject — 'a good woman'."
      d: "Working as part of the verb."
    answer: a
    touches: [MS-042, MS-027, MS-037, MS-028]
    what_went_wrong:
      - text: "I read bona as a feminine singular"
        node: MS-027
      - text: "I looked for a noun for it to describe"
        node: MS-048
      - text: "I didn't check who the verb's subject was"
        node: MS-037
    note: >
      SHAPE ADDED: a substantive that is not multī, and a neuter one.
      MS048-RECOG-01 and MS048-TRANS-01 both use Multī pugnant, where the
      adjective is masculine plural and unmistakably the subject — so a student
      can learn the node as "multī means many men". bona is harder in the right
      way: it could be a feminine singular subject until you notice laudāmus is
      first person plural and already has its subject, which leaves bona as a
      neuter plural object. Choice c is that first reading, and counting it is
      worth more than the item.
    versions:
      v2: {change: "Glosses added: laudāmus [we praise]; the sentence on its own line; one option per line."}
      v3:
        change: "Two options — standing in for a noun, and the feminine-singular subject reading (the instructive trap)."
        options: {a: "Standing in for a noun — 'good things', the object of the verb.", b: "Acting as the subject — 'a good woman'."}
        answer: a
    teaching: ''

