# Latin I — Units 0 and 1 morphosyntax, third questions
#
# WHY THIS FILE EXISTS
# Thirty-five of the 54 morphosyntax nodes in Units 0 and 1 carried fewer than
# three questions, so a student who practised a node twice met the same card
# twice. This file brings every one of them to three: 33 nodes get one more
# question, and MS-030 and MS-044 — which had a single question each — get two.
# Thirty-seven items.
#
# WHY IT IS A SEPARATE FILE
# latin1-items-unit01.yaml has been reviewed and largely approved. Adding to it
# would mean rewriting a file whose every item already carries a decision. The
# loader reads every latin1-items-unit*.yaml, so this file is picked up with no
# code change, and a re-import leaves existing decisions alone.
#
# NOT PADDING — A DIFFERENT SHAPE
# The original bank stopped short on ten of these nodes on purpose, and said so
# in its own review section: the eight cells of the noun tables would become
# paradigm recitation, and a single-fact node would only restate itself. That
# argument was against a third *drill*, not against a third *question*. So none
# of the items below is another instance of a shape the node already has. Where
# a node had a parse and a produce, this file adds a discrimination across four
# different nouns, or a production cued by English meaning rather than by a
# paradigm slot, or an error to diagnose. Every item names, in its note, what
# shape it adds.
#
# SCOPE. Each item stays inside what its own node's day allows, with the same
# convention the first bank used: the four first-declension cells (Sep 9-10),
# the second-declension masculine cells (Sep 14) and the neuter cells (Sep 15)
# are each treated as one block, because the nodes are a day apart and the
# original items already answer across them. Verbs are the line not crossed
# casually; the two places an item leans a day forward say so in a note.
#
# ONE NODE PER ITEM. `node` is what a wrong answer counts against; everything
# else the item touches is in `touches`.

meta:
  course: Latin I
  scope: Units 0 and 1 morphosyntax — the 35 nodes that carried fewer than three questions
  spec_version: 2.0
  built_against_exemplars: latin1-item-exemplars.yaml (draft v2)
  companion_to: latin1-items-unit01.yaml
  status: >
    Draft for review. Teaching text left blank on every item, as everywhere
    else — it is written and approved separately at /teaching.

items:

# ==========================================================================
# Unit 0 — pronunciation, syllables and stress (MS-002 to MS-010)
# ==========================================================================

  - id: MS002-APPLY-03
    node: MS-002
    assess: apply
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      A student reads amīcī with the c of "city" and rēgīna with the g of
      "gem", because that is what those letters do before i in English. What
      rule are they missing?
    options:
      a: "In Classical Latin c is always hard, as in 'cat', and g is always hard, as in 'go' — whatever vowel follows."
      b: "c and g are hard only before a, o and u."
      c: "c and g are hard only at the start of a word."
      d: "c and g soften before e and i, exactly as in English."
    answer: a
    touches: [MS-001]
    what_went_wrong:
      - text: "I let the English pronunciation decide"
        node: MS-002
      - text: "I thought the following vowel changed the sound"
        node: MS-002
    note: >
      SHAPE ADDED: the rule stated as a rule. The node's other two items each
      ask how one letter in one word is pronounced; neither asks whether the
      rule holds everywhere, which is the part English interference breaks.
      Choice b is the half-learned version and the most common wrong model.
    versions:
      v2: {change: "One option per line; the two Latin words printed larger with their macrons."}
      v3:
        change: "Two options — the rule and the English-interference version."
        options: {a: "In Classical Latin c is always hard, as in 'cat', and g is always hard, as in 'go' — whatever vowel follows.", b: "c and g soften before e and i, exactly as in English."}
        answer: a
    teaching: ''

  - id: MS003-APPLY-03
    node: MS-003
    assess: apply
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: >-
      In Classical Latin the v in via sounds like an English letter that is not
      v, and the i in Troia [Troy] sounds like an English letter that is not i.
      Write each of those English letters.
    boxes:
      - label: "v sounds like"
        answer: [w]
      - label: "i sounds like"
        answer: [y]
    order_matters: true
    touches: [MS-001]
    what_went_wrong:
      - text: "I gave the English sound of the letter as written"
        node: MS-003
      - text: "I had one of the two but not the other"
        node: MS-003
    note: >
      SHAPE ADDED: production instead of recognition. The node's other two items
      are four-option questions about one letter each; this one asks for both
      sounds with nothing to choose from, which is what reading aloud actually
      demands. Troia is supplied and glossed, as in MS003-APPLY-02.
    versions:
      v2: {change: "Placeholder 'a letter' in each box; the two Latin words on separate lines."}
      v3:
        change: "Word bank above the boxes: w, y, f, j."
    teaching: ''

  - id: MS005-RECOG-02
    node: MS-005
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: true
    read_aloud_safe: false
    stem: "The macrons decide this one. In fēmina, which of the three vowels is long?"
    options:
      a: "Only the e."
      b: "The e and the i."
      c: "All three."
      d: "None of them."
    answer: a
    touches: [MS-006, MS-009]
    what_went_wrong:
      - text: "I wasn't reading the macrons"
        node: MS-006
      - text: "I thought every vowel in a word was the same length"
        node: MS-005
    note: >
      SHAPE ADDED: length inside one word. MS005-RECOG-01 asks which word out of
      four begins with a long vowel; this asks which vowels within a single word
      are long, which is the form the question takes when a student is working
      out where the stress goes. Sets up MS-009 and MS-010, where fēmina is the
      example that moves the stress back.
    versions:
      v2: {change: "No usable v2 — the macrons are the item and are already printed. A read-aloud student gets a different MS-005 item."}
      v3:
        change: "Two options — only the e, and all three."
        options: {a: "Only the e.", b: "All three."}
        answer: a
    teaching: ''

  - id: MS006-EXPLAIN-02
    node: MS-006
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      A macron is not an accent mark, though both are marks written over a
      vowel. What does a macron tell you that an accent mark does not?
    options:
      a: "It marks how long the vowel is held, because length is what it records; an accent would mark which syllable is said with more force."
      b: "It marks which syllable is said with more force, since that is what a mark over a vowel means."
      c: "It marks that the vowel is really a different letter, so the word is spelled differently."
      d: "Nothing different — a macron is just another way of writing an accent."
    answer: a
    touches: [MS-005, MS-010]
    what_went_wrong:
      - text: "I thought the macron showed the stress"
        node: MS-010
      - text: "I thought the macron changed which letter it was"
        node: MS-005
    note: >
      SHAPE ADDED: the boundary of the concept. MS006-RECOG-01 asks what a
      macron looks like and MS006-EXPLAIN-01 asks what it does; neither
      separates it from stress, which is the confusion that then breaks MS-010 —
      a student who reads a macron as an accent will stress rēgīna correctly by
      accident and fēmina wrongly.
    versions:
      v2: {change: "Plain-English wrapper shortened; one option per line."}
      v3:
        change: "Two options — length, and the stress misreading."
        options: {a: "It marks how long the vowel is held, because length is what it records; an accent would mark which syllable is said with more force.", b: "It marks which syllable is said with more force, since that is what a mark over a vowel means."}
        answer: a
    teaching: ''

  - id: MS007-APPLY-01
    node: MS-007
    assess: apply
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "nauta is written with three vowel letters — a, u, a. How many syllables does it have?"
    options:
      a: "Two — au is a diphthong, so the two letters make one vowel sound."
      b: "Three — one syllable for each vowel letter."
      c: "Two — because the word has two consonants."
      d: "One — the vowels all run together."
    answer: a
    touches: [MS-008, MS-010]
    what_went_wrong:
      - text: "I counted one syllable per vowel letter"
        node: MS-007
      - text: "I didn't notice au was a diphthong"
        node: MS-007
      - text: "I wasn't sure how to divide the word"
        node: MS-008
    note: >
      SHAPE ADDED: what a diphthong is FOR. The node's other two items both ask
      the student to spot a diphthong; neither asks what follows from spotting
      one. Counting syllables is where it pays off, and getting it wrong here
      moves the stress in MS-010. This is also the node's `apply` assessment,
      which the bank did not previously cover. Answers the standing cap note on
      MS-007 — the cap was on more recognition items, and this is not one.
    versions:
      v2: {change: "Glosses added: nauta [sailor]; one option per line."}
      v3:
        change: "Two options — two syllables and three."
        options: {a: "Two — au is a diphthong, so the two letters make one vowel sound.", b: "Three — one syllable for each vowel letter."}
        answer: a
    teaching: ''

  - id: MS008-APPLY-03
    node: MS-008
    assess: apply
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "How does aqua divide into syllables?"
    options:
      a: "a-qua"
      b: "aq-ua"
      c: "a-qu-a"
      d: "aqua — it is one syllable"
    answer: a
    touches: [MS-004, MS-007]
    what_went_wrong:
      - text: "I split the qu"
        node: MS-004
      - text: "I treated the u as its own vowel"
        node: MS-004
      - text: "I wasn't sure where the break went"
        node: MS-008
    note: >
      SHAPE ADDED: a cluster that does NOT split. MS008-APPLY-01 (patria) and
      MS008-APPLY-02 (puella) both practise breaking consonants apart; a student
      who has only met those over-applies the rule and writes aq-ua. qu is one
      sound and travels together, which is MS-004 doing real work.
    versions:
      v2: {change: "Glosses added: aqua [water]; one option per line."}
      v3:
        change: "Two options — the correct division and the split qu."
        options: {a: "a-qua", b: "aq-ua"}
        answer: a
    teaching: ''

  - id: MS009-RECOG-02
    node: MS-009
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: true
    read_aloud_safe: false
    stem: >-
      In fēmina the first syllable fē- is long, even though only one consonant
      follows it. What makes it long?
    options:
      a: "The vowel itself is long — the syllable is long by nature."
      b: "The consonants that follow it — it is long by position."
      c: "It carries the word's stress, and stressed syllables are long."
      d: "It is the first syllable, and first syllables are always long."
    answer: a
    touches: [MS-005, MS-006, MS-010]
    what_went_wrong:
      - text: "I said long by position when nothing followed it"
        node: MS-009
      - text: "I confused being long with being stressed"
        node: MS-010
      - text: "I wasn't reading the macron"
        node: MS-006
    note: >
      SHAPE ADDED: the other half of the node. MS009-RECOG-01 and
      MS009-EXPLAIN-01 both cover long BY POSITION; nothing in the bank asked
      about long by nature, which is the half a macron alone decides. Choice c
      is the inversion that matters — length decides stress, not the reverse.
    versions:
      v2: {change: "No usable v2 — the macron is the evidence and is already printed. A read-aloud student gets a different MS-009 item."}
      v3:
        change: "Two options — long by nature and long by position."
        options: {a: "The vowel itself is long — the syllable is long by nature.", b: "The consonants that follow it — it is long by position."}
        answer: a
    teaching: ''

  - id: MS010-APPLY-02
    node: MS-010
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Where does the stress fall in a two-syllable Latin word such as terra?"
    options:
      a: "On the first syllable — in a two-syllable word the stress is always there."
      b: "On the last syllable."
      c: "On the first, but only if its vowel is long."
      d: "Two-syllable words carry no stress."
    answer: a
    touches: [MS-009, MS-008]
    what_went_wrong:
      - text: "I applied the long-or-short test to a two-syllable word"
        node: MS-010
      - text: "I stressed the last syllable"
        node: MS-010
    note: >
      SHAPE ADDED: the easy case, which is the one the bank skipped.
      MS010-APPLY-01 and MS010-EXPLAIN-01 are both about three-syllable words,
      where the penult's length decides. In a two-syllable word there is nowhere
      for the stress to move back to, so the length test never applies — choice
      c is the over-application, and it is the wrong answer a strong student
      gives.
    versions:
      v2: {change: "Glosses added: terra [land]; one option per line."}
      v3:
        change: "Two options — the first syllable, and the length test."
        options: {a: "On the first syllable — in a two-syllable word the stress is always there.", b: "On the first, but only if its vowel is long."}
        answer: a
    teaching: ''

# ==========================================================================
# Unit 1 — inflection, case, and the first declension (MS-013 to MS-021)
# ==========================================================================

  - id: MS013-EXPLAIN-03
    node: MS-013
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      English mostly lost case, but a trace survives in its pronouns: we say
      "he sees her", never "him sees she". Why is that worth noticing when you
      start Latin?
    options:
      a: "Because it shows a word changing its form to fit its job — which is what every Latin noun does, not just a handful of pronouns."
      b: "Because Latin pronouns and English pronouns are the same words."
      c: "Because English word order was borrowed from Latin."
      d: "Because it shows that Latin, like English, relies on the order of the words."
    answer: a
    touches: [MS-011, MS-012]
    what_went_wrong:
      - text: "I couldn't see what English pronouns had to do with Latin"
        node: MS-013
      - text: "I thought Latin used word order the way English does"
        node: MS-012
    note: >
      SHAPE ADDED: the concept reached from something the student already owns.
      MS013-EXPLAIN-01 and -02 both define case from the Latin side. This one
      starts in English, where a fourteen-year-old already applies case
      correctly a hundred times a day without a name for it. Deliberately uses
      no Latin: MS-013 is taught 8 September, when no declined form has been
      met yet.
    versions:
      v2: {change: "Shorter wrapper; the he/him pair on its own line; one option per line."}
      v3:
        change: "Two options — form changing with job, and the word-order misreading."
        options: {a: "Because it shows a word changing its form to fit its job — which is what every Latin noun does, not just a handful of pronouns.", b: "Because it shows that Latin, like English, relies on the order of the words."}
        answer: a
    teaching: ''

  - id: MS016-RECALL-02
    node: MS-016
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: >-
      Here is a dictionary entry: nauta, nautae, m. Read the answers off it —
      what gender is the noun, and what is its genitive singular?
    boxes:
      - label: "Gender"
        answer: [masculine, m, masc]
      - label: "Genitive singular"
        answer: [nautae]
    order_matters: true
    touches: [MS-017, MS-022]
    what_went_wrong:
      - text: "I guessed the gender from the -a ending instead of reading it"
        node: MS-016
      - text: "I wasn't sure which part was the genitive"
        node: MS-016
    note: >
      SHAPE ADDED: using an entry rather than describing one. MS016-RECALL-01
      asks what the three parts of an entry are; MS016-EXPLAIN-01 asks why the
      genitive is one of them. Neither puts an entry in front of the student and
      asks them to get something out of it, which is the only thing they will
      ever actually do with one. nauta is chosen because its gender cannot be
      guessed and must be read — which is the node's whole argument for printing
      it. That requires no knowledge of MS-022 (10 September): the answer is on
      the page.
    versions:
      v2: {change: "Placeholders 'masculine, feminine or neuter' and 'one word'; the entry printed on its own line."}
      v3:
        change: "Word bank above the boxes: masculine, feminine, neuter, nauta, nautae, nautam."
    teaching: ''

  - id: MS018-RECOG-01
    node: MS-018
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which one of these is a nominative singular?"
    options:
      a: "silva"
      b: "puellam"
      c: "terrās"
      d: "stēllae"
    answer: a
    touches: [MS-019, MS-020, MS-021, MS-014]
    what_went_wrong:
      - text: "I picked an accusative"
        node: MS-019
      - text: "I picked a plural"
        node: MS-020
      - text: "I couldn't tell the endings apart"
        node: MS-018
    note: >
      SHAPE ADDED: discrimination across four different nouns. The node already
      has a parse (one word, four labels) and a produce (one form from an
      entry). What it did not have is the task reading actually sets — four
      words go past and only one of them is the subject form. Each wrong choice
      is wrong in exactly one way: b in case, c in case and number, d in number.
      Sits inside the first-declension block (9-10 September), the same scope
      MS018-PARSE-01 already assumes by offering plural labels.
    versions:
      v2: {change: "Glosses added: silva [forest], puellam [girl], terrās [lands], stēllae [stars]; one option per line."}
      v3:
        change: "Two options — the nominative singular and the accusative singular."
        options: {a: "silva", b: "puellam"}
        answer: a
    teaching: ''

  - id: MS019-RECOG-01
    node: MS-019
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      You want to say that the water is the thing being carried — the object,
      not the one doing the carrying. Which form of aqua do you use?
    options:
      a: "aquam"
      b: "aqua"
      c: "aquae"
      d: "aquās"
    answer: a
    touches: [MS-015, MS-018, MS-021]
    what_went_wrong:
      - text: "I used the dictionary form"
        node: MS-018
      - text: "I made it plural"
        node: MS-021
      - text: "I knew it was the object but not which ending to use"
        node: MS-019
    note: >
      SHAPE ADDED: the job first, the form second. MS019-PARSE-01 hands over
      portam and asks what it is; MS019-PRODUCE-01 asks for the accusative
      singular by name. Both start from grammatical vocabulary. This one starts
      from what the student wants to say, which is the direction they will need
      when they write Latin, and it is the only item on the node that does not
      require them to already know the word "accusative".
    versions:
      v2: {change: "Gloss added: aqua [water]; one option per line."}
      v3:
        change: "Two options — the accusative singular and the dictionary form."
        options: {a: "aquam", b: "aqua"}
        answer: a
    teaching: ''

  - id: MS020-PRODUCE-02
    node: MS-020
    assess: produce
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: >-
      Write the Latin for "the star" as the subject of a sentence, and then for
      "the stars" as the subject.
    boxes:
      - label: "the star"
        answer: [stella]
      - label: "the stars"
        answer: [stellae]
    order_matters: true
    touches: [MS-018, MS-014]
    what_went_wrong:
      - text: "I wrote the same form in both boxes"
        node: MS-020
      - text: "I used an accusative ending for the plural"
        node: MS-021
      - text: "I wasn't sure which ending makes a plural subject"
        node: MS-020
    note: >
      SHAPE ADDED: the singular and the plural side by side. MS020-PRODUCE-01
      asks for the nominative plural of stēlla on its own, so a student can
      produce it by recalling one ending. Holding both at once is what makes the
      contrast visible, and a student who writes the same word twice has told
      you something a single box could not. Macrons stripped, so stēlla and
      stella both pass.
    versions:
      v2: {change: "Placeholder 'one word' in each box; English cue on its own line."}
      v3:
        change: "Word bank above the boxes: stēlla, stēllae, stēllam, stēllās."
    teaching: ''

  - id: MS021-PRODUCE-01
    node: MS-021
    assess: produce
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: >-
      Write the Latin for "the islands" when it is the object of the sentence —
      the thing being acted on, and more than one.
    boxes:
      - label: "the islands, as object"
        answer: [insulas]
    touches: [MS-019, MS-020, MS-015]
    what_went_wrong:
      - text: "I wrote the nominative plural"
        node: MS-020
      - text: "I left it singular"
        node: MS-019
      - text: "I wasn't sure of the plural accusative ending"
        node: MS-021
    note: >
      SHAPE ADDED: production, which the node lacked. MS021-PARSE-01 and
      MS021-RECOG-01 both hand the student a form to judge; neither asks them to
      build one, and the accusative plural is the cell they build least often.
      No verb appears, because MS-021 is taught 10 September and the present
      tense is not delivered until the 16th. Macrons stripped, so īnsulās and
      insulas both pass.
    versions:
      v2: {change: "Placeholder 'one word'; gloss added: īnsula [island]."}
      v3:
        change: "Four-option choice from the answer plus wrong forms."
        format: choice
        options: {a: "īnsulās", b: "īnsulae", c: "īnsulam", d: "īnsula"}
        answer: a
    teaching: ''

# ==========================================================================
# Unit 1 — the second declension (MS-024 to MS-029)
# ==========================================================================

  - id: MS024-RECOG-01
    node: MS-024
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which one of these is an accusative plural?"
    options:
      a: "amīcōs"
      b: "amīcī"
      c: "dominum"
      d: "ager"
    answer: a
    touches: [MS-023, MS-021, MS-025]
    what_went_wrong:
      - text: "I picked a nominative plural"
        node: MS-024
      - text: "I picked a singular"
        node: MS-023
      - text: "I couldn't tell -ōs from -ī"
        node: MS-024
    note: >
      SHAPE ADDED: discrimination across four different nouns, which is how
      these forms arrive when reading. MS024-PARSE-01 labels virī and
      MS024-PRODUCE-01 builds one form of servus; both keep the student inside a
      single word, where the ending can be found by elimination against a
      remembered table. Each wrong choice fails once: b in case, c in number, d
      in both. All four are real forms — the first-declension over-application
      (-ās on a second-declension noun) is the error this node's produce item
      already catches, and it is left there rather than printed here as a word
      that does not exist.
    versions:
      v2: {change: "Glosses added: amīcōs [friends], amīcī [friends], dominum [master], ager [field]; one option per line."}
      v3:
        change: "Two options — the accusative plural and the nominative plural."
        options: {a: "amīcōs", b: "amīcī"}
        answer: a
    teaching: ''

  - id: MS026-PRODUCE-01
    node: MS-026
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "The dictionary entry is dōnum, dōnī, n. Write the accusative singular."
    boxes:
      - label: "Accusative singular"
        answer: [donum]
    touches: [MS-028, MS-023, MS-016]
    what_went_wrong:
      - text: "I changed the ending to make it accusative"
        node: MS-026
      - text: "I wasn't sure whether a neuter noun changes at all"
        node: MS-028
      - text: "I wrote the plural"
        node: MS-027
    note: >
