# ============================================================
# VOCABULARY
# Not spec-noded. Individual headwords are their own items,
# tagged to the week's core list. See Year Architecture §3.
# ============================================================

vocabulary:
  source_primary: DCC Core Latin Vocabulary (1000 headwords, frequency ranked)
  source_filter: NLE / NLVE Latin I vocabulary list
  weekly_core_size: 12-15
  target_by_nle: ~310 headwords
  target_by_june: ~440 headwords
  item_fields:
    - headword
    - full_dictionary_entry
    - gloss
    - part_of_speech
    - declension_or_conjugation
    - core_list_week
    - dcc_frequency_rank
    - derivative_links   # references MW nodes
  rules:
    - Weekly core list is a cohort floor, taught and quizzed. Non-negotiable.
    - Self-paced SRS accumulation sits on top of the floor, never instead of it.
    - Unit exams and quizzes draw ONLY from cumulative core lists.
    - Self-pacing yields access advantage, never grade advantage.
    - Every core word carries at least one derivative link to an MW node.
  core_lists:
    - week: 2026-08-24
      count: 10
      note: Latin already in English. Taught as phrases, not paradigms.
      words: [et cetera, per sē, ad hoc, alma māter, ē plūribus ūnum,
              carpe diem, sīc, versus, id est, exemplī grātiā]
    - week: 2026-08-31
      count: 15
      note: First declension nouns. Chosen for transparent Spanish cognates.
      words: [aqua, terra, via, porta, īnsula, silva, puella, fēmina,
              nauta, agricola, patria, fāma, vīta, lūna, stēlla]
    - week: 2026-09-07
      count: 12
      note: First conjugation verbs plus two particles.
      words: [amō, laudō, portō, vocō, spectō, nārrō, parō, servō,
              superō, pugnō, et, nōn]
    - week: 2026-09-14
      count: 14
      note: Second declension masculine and neuter, plus second conjugation verbs.
      words: [dominus, servus, amīcus, puer, vir, ager, bellum, oppidum,
              dōnum, verbum, videō, habeō, teneō, moneō]
    - week: 2026-09-21
      count: 14
