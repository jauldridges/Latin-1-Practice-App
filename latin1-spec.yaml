# ============================================================
# Latin I — Spec Node List
# Libertas Academy Charter School · FY27 · J. Sullivan
# Draft v1 · August 2026
#
# CANONICAL SOURCE OF TRUTH.
# Both the human scope-and-sequence and the app's item tagging
# derive from this file. Nothing is defined twice.
#
# ID RULE: IDs are opaque, sequential within strand, and PERMANENT.
# Unit assignment is a field, not part of the ID. Nodes will move
# between units; IDs must never change once an item references them.
# New nodes append at the end of their strand. Never renumber.
# ============================================================

meta:
  course: Latin I
  school: Libertas Academy Charter School
  year: FY27
  teacher: J. Sullivan
  sections: [Block 3, Block 4, Block 5, Block 7]
  external_anchor: National Latin Exam, Introduction to Latin / Latin I
  nle_window: 2027-03-08/2027-03-12
  version: 2.0
  updated: 2026-08-20

strands:
  MS:
    name: Morphosyntax
    pacing: cohort-locked
    description: Forms, endings, syntax, agreement.
  VO:
    name: Vocabulary
    pacing: floor-plus-ceiling
    description: >
      Knowing the Latin word. Handled by weekly core lists rather than
      spec nodes; individual headwords are their own items. See vocabulary
      section at end of file.
  RW:
    name: Roman World
    pacing: self-paced-modules
    description: The ancient world on its own terms.
  MW:
    name: Modern World
    pacing: daily-opener-plus-modules
    description: The through-line to now. Etymology, descent, application, reception.
  CR:
    name: Connected Reading
    pacing: cohort-floor-individual-ceiling
    description: Strategies and stamina for reading sustained Latin prose.

# Item types referenced by the `assess` field:
#   recall     - retrieve a fact or form from memory
#   recognize  - identify a form/feature when shown it
#   produce    - generate a form from a stem or rule
#   parse      - state case/number/gender or person/number/tense/voice
#   translate  - render Latin into English or English into Latin
#   apply      - use the knowledge in a novel sentence or context
#   explain    - articulate the reason or rule
#
# PLACEMENT FIELDS (v1.1):
#   week      - ISO Monday date of the teaching week. Dated, not ordinal,
#               so a cancellation shifts one field instead of renumbering.
#   day       - ISO date. Null only for module-paced nodes.
#   vehicle   - where in the lesson the node is delivered:
#               lesson        body of the lesson
#               reading       carried by the connected reading passage
#               vocab         carried by the core word it attaches to
#               do_now        introduced as a Do Now item, then stays in
#                             the cumulative retrieval pool
#               opener        the daily 3-4 minute opener
#               consolidation Friday, after the quiz
#               module        self-paced, no fixed day

# Mastery thresholds (see Project Brief §4):
#   4 of last 5 correct, across 2+ sessions, 1+ proctored,
#   1+ attempt 7 days after first exposure. Decays after 45 days idle.

nodes:

