# DI mode — the first-declension strand, Lessons 0–12.
#
# Transcribed from the teacher's DI plan ("DI Mode: First Declension Strand").
# Where the plan lists items they are copied as written; where it describes a
# set without listing it (some Part C rounds, Lesson 12's fast round) the
# items here follow its writing rules (section 7). di.py works out every
# answer, translation and distractor from the Latin, so an item is one line.
#
# Item lines (one per screen):
#   F1 <latin>                 meaning: 1 of 3
#   F2 <latin with **word**>   job of the bold word        [| buttons: subject dobj ...]
#   F2F3 <latin **word**>      job, then one / more than one (F3F2: the other way)
#   F2T <latin **word**>       job, then pick the translation
#   F3 <latin or **word**>     One / More than one
#   F4 <English, target **bold**> | <Latin with stem___> | <ending>   build: tap the ending
#   F5 <latin with verb stem__>            tap -t or -nt
#   F6 <latin>                 sentence steps, then the translation
#   F6N / F6V                  ...with One/More than one on the object / with -t/-nt on the verb
#   F7 <latin form>            echo: hear it, tap the ending
#   F8 <latin>                 type the English
#   F8E <English, target **bold**> | <Latin with stem___> | <ending>  type the ending
#   E3 <subject> / <verb> [/ <object>]     English: tap verb, subject, direct object (or No direct object)
#   E2 <English with **words**> | <job>    English: name the job of the bold words  [| buttons: ...]
#   ET <English with [chunks]> | <answer chunk or none> | <prompt>   English: tap a chunk
#   EV <English with a verb__> | <s or none>   English verb ending (Lesson 4 warm-up)
#   Q  <question> | <right> | <wrong> | <wrong>   a reading question
#   NOTE <text>                a note on screen after the item before it
#   (a lesson's names: renames a part on screen, e.g. Lesson 0's Part B)
#   ... | gloss: word = meaning   a word the lesson hasn't taught yet, glossed on screen
#
# Model screens: text uses **bold**, *Latin*, and a blank line between lines;
# TABLE nom acc ... draws the ending table with those rows. audio is read
# aloud: *Latin* in a Latin voice, the rest in English.

strand: first-declension
title: First declension, step by step

placement:
  - "E2 **The sailor** watches the girl. | subject"
  - "E2 The sailor watches **the girl**. | dobj"
  - "F2 **Puella** nautam vocat."
  - "F2 Nauta **puellam** vocat."
  - "F2 Nauta **puellās** vocat."
  - "F3 Nauta **puellās** vocat."
  - "F5 Puellae aquam port__"
  - "F6 Puellās nautae vocant."
  - "F2 Fēmina fāmam **nautārum** laudat."
  - "F2 Fēmina vītam **puellae** laudat."
  - "F2 **Puellae** fābulam nārrant."
  - "F2 Nauta **puellīs** fābulam nārrat."
  - "F2 Nauta **puellae** fābulam nārrat."
  - "F2 Nauta in **īnsulā** pugnat."
  - "F2 Agricolae in **silvīs** pugnant."
  - "F6 Fēmina agricolīs aquam portat."
  - "F6 Puella cum fēminā aquam portat."
  - "F6 Nautae fāmam patriae laudant."

# Placement: each item's lesson (0-based, in the order above). A student
# starts at the lowest lesson among the items they miss; all right goes to
# Lesson 12. The plan's table stops at item 14; item 15 (cum fēminā, -ā) is
# taken as Lesson 10 and item 16 (patriae, possession) as Lesson 7.
placement_rule: [0, 0, 1, 2, 3, 3, 4, 4, 6, 7, 7, 8, 9, 10, 11, 11, 10, 7]

lessons:

# ==========================================================================
- n: 0
  title: Jobs in a sentence
  subtitle: English only
  today: "Every word in a sentence has a job. Today you find the jobs in English, so you know what the Latin endings have to show."
  why: {B: "Three jobs, one at a time, in English: the Latin endings will show these same jobs."}
  names: {B: Three jobs}
  A: []
  B:
    models:
      - text: "The **verb** is the action word.\n\n*The girl **calls** the sailor.*"
        plain: true
      - text: "The **subject** is who or what does the verb.\n\nAsk: who calls? *The girl.*\n\n***The girl** calls the sailor.*"
        plain: true
      - text: "The **direct object** is who or what receives the verb.\n\nAsk: calls whom? *The sailor.*\n\n*The girl calls **the sailor**.*"
        plain: true
        audio: "Every word in a sentence has a job. The verb is the action. The subject does the verb. The direct object receives the verb. The girl calls the sailor. Verb: calls. Subject: the girl. Direct object: the sailor."
    test: [E3 The girl / calls / the sailor]
    examples:
      - "E3 The girl / calls / the sailor"
      - "E3 The sailor / calls / the girl"
      - "NOTE Sentences 1 and 2 use the same words. In English, the order decides which word is the subject. Latin won't work that way."
      - "E3 The farmer / loves / the land"
      - "E3 The woman / carries / the water"
      - "E3 The sailors / watch / the stars"
      - "E3 The girl / calls"
      - "NOTE Some sentences have no direct object. *The girl calls* has a subject and a verb, and nothing receives the call."
      - "E3 The women / praise / the farmer"
      - "E3 The farmer / praises / the women"
      - "E3 The sailor / watches"
      - "E3 The girls / love / the island"
  C:
    - "E2 **The farmer** watches the girl. | subject"
    - "E2 The farmer watches **the girl**. | dobj"
    - "E2 **She** calls him. | subject"
    - "E2 She calls **him**. | dobj"
    - "NOTE English changes some words when they become the direct object: *she → her, he → him, they → them.* Latin does this to every noun."
    - "E2 **The sailors** praise the women. | subject"
    - "E2 The sailors praise **the women**. | dobj"
  D: 0
  E:
    - "E3 The woman / loves / the forest"
    - "E3 The girls / carry / the water"
    - "E3 The farmer / fights"
    - "E3 The sailors / save / the homeland"
  F:
    A:
      - "ET [The sailor] [praises] [the farmer]. | The sailor | Tap the subject."
      - "ET [The woman] [watches] [the moon]. | the moon | Tap the direct object."
      - "ET [The girls] [call] [the women]. | call | Tap the verb."
      - "E2 **They** watch the stars. | subject | buttons: subject dobj"
      - "E2 The farmer loves **her**. | dobj | buttons: subject dobj"
      - "ET [The girl] [fights]. | none | Tap the direct object."
      - "ET [The women] [carry] [the water]. | The women | Tap the subject."
      - "ET [The sailor] [calls] [the girls]. | the girls | Tap the direct object."
    B:
      - "ET [The farmer] [praises] [the sailor]. | The farmer | Tap the subject."
      - "ET [The girl] [watches] [the stars]. | the stars | Tap the direct object."
      - "ET [The sailors] [call] [the farmers]. | call | Tap the verb."
      - "E2 **He** watches the moon. | subject | buttons: subject dobj"
      - "E2 The woman loves **them**. | dobj | buttons: subject dobj"
      - "ET [The sailor] [fights]. | none | Tap the direct object."
      - "ET [The girls] [carry] [the water]. | The girls | Tap the subject."
      - "ET [The woman] [calls] [the farmer]. | the farmer | Tap the direct object."
  delayed: E3 The sailor / calls / the girl

# ==========================================================================
- n: 1
  title: "-a: the subject"
  subtitle: nominative
  today: "In Latin, word order doesn't tell you who does what. The ending does. Today: -a marks the subject."
  new: a
  A:
    words: [puella, fēmina, nauta, agricola, aqua, vocat, spectat, portat, amat, laudat]
    twice: true
  B:
    models:
      - text: "In English, word order shows which word is the subject. In Latin, the ending does.\n\n**-a** marks the subject. The subject is in the **nominative** case.\n\n*Puella vocat.* The girl calls."
        audio: "*Puella.* The ending is -a. -a marks the subject. The subject is in the nominative case. *Puella vocat.* The girl calls."
    echo: [F7 puella, F7 fēmina, F7 nauta]
    test: [F6 Puella vocat.]
    examples:
      - "F6 Fēmina spectat."
      - "F6 Spectat fēmina."
      - "F6 Nauta laudat."
      - "NOTE *Nauta* and *agricola* name men. The ending is still -a. The ending shows the job in the sentence, not whether the person is a man or a woman."
      - "F6 Laudat agricola."
      - "F6 Agricola amat."
      - "F6 Portat puella."
      - "F6 Nauta vocat."
      - "F6 Amat fēmina."
  C:
    - "F2 Vocat **puella**. | buttons: verb subject"
    - "F2 **Nauta** spectat. | buttons: verb subject"
    - "F2 Laudat **fēmina**. | buttons: verb subject"
    - "F2 **Agricola** portat. | buttons: verb subject"
    - "F2 Amat **nauta**. | buttons: verb subject"
    - "F2 **Puella** laudat. | buttons: verb subject"
  D: 4
  E:
    - "F6 Agricola spectat."
    - "F6 Vocat nauta."
    - "F6 Fēmina portat."
    - "F6 Laudat puella."
  F:
    A: [F6 Nauta spectat., F6 Vocat fēmina., F1 agricola, F1 portat, "F2 Laudat **puella**.", F6 Puella amat., F1 aqua, F6 Spectat agricola.]
    B: [F6 Fēmina vocat., F6 Laudat nauta., F1 fēmina, F1 spectat, "F2 **Agricola** amat.", F6 Portat puella., F1 nauta, F6 Amat agricola.]
  delayed: F6 Laudat agricola.

