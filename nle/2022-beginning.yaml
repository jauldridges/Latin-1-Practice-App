- id: magic-river-1
  title: THE SEARCH FOR THE MAGIC RIVER
  subtitle: Pachacoutec, a famous Incan, needs help solving a problem.
  note: Pachacoutec is nom. sing. (pa-shuh-KOO-tek)
  source: ''
  questions:
  - 29
  - 34
  lines:
  - n: 1
    latin: Ōlim habitābat rēx superbus, nōmine Pachacoutec. Rēx senēscēbat
    gloss: senēscēbat = was growing old
    underline:
    - senēscēbat
  - n: 2
    latin: et fīlius rēgis, nōmine Topa, aegrotābat. Rēx dē vītā fīliī dēspērābat. Itaque
    gloss: aegrotābat = was sick; Itaque = And so
    underline:
    - aegrotābat
    - Itaque
  - n: 3
    latin: multōs medicōs ad aulam convocāvit. Medicī autem fīlium adiuvāre nōn
    gloss: aulam = palace
    underline:
    - aulam
  - n: 4
    latin: poterant. Statim Pachacoutec miser ad āram sacram appropinquāvit et
    gloss: āra = altar
    underline:
    - āram
  - n: 5
    latin: 'auxilium petīvit. Rēx vōcem ex ārā audīvit: “Cum prīmum Topa aquam'
    gloss: Cum prīmum = As soon as
    underline:
    - Cum prīmum
  - n: 6
    latin: ē flūmine magicō bibit, sānus erit. Poteris aquam mīram invenīre ubi flūmen
    gloss: erit = he will be; Poteris = You will be able
    underline:
    - erit
    - Poteris
  - n: 7
    latin: caelum tangit. Necesse est virīs invenīre flūmen."
    gloss: tangit = touches
    underline:
    - tangit
  - n: 8
    latin: Pachacoutec igitur virōs petēbat. Itaque nūntiōs per tōtum rēgnum mittēbat.
    gloss: igitur = therefore
    underline:
    - igitur
  - n: 9
    latin: Mox duo frātrēs longum iter ad flūmen facere cōnstituērunt. Frātrēs
    gloss: iter = journey; cōnstituērunt = decided
    underline:
    - iter
    - cōnstituērunt
  - n: 10
    latin: suam sorōrem, Sumam, cum parentibus relīquērunt.
    gloss: suam = their
    underline:
    - suam
- id: magic-river-2
  title: THE SEARCH FOR THE MAGIC RIVER — the story continues
  subtitle: ''
  note: ''
  source: Inspired by an Ecuadorian folktale
  questions:
  - 35
  - 40
  lines:
  - n: 11
    latin: Sed frātrēs sine aquā revēnērunt. Itaque Pachacoutec eōs in carcerem
    gloss: eōs = them; carcerem = prison
    underline:
    - eōs
    - carcerem
  - n: 12
    latin: īrātē iēcit. Suma ad aulam festīnāvit et ante omnēs fortiter stetit et
    gloss: aulam = palace
  - n: 13
    latin: 'exclāmāvit: “Heus! Sine dubiō aquam magicam reportāre possum.”'
    gloss: Heus = Hey
    underline:
    - Heus
  - n: 14
    latin: Pachacoutec diū rīdēbat sed tandem cōnsēnsit.
  - n: 15
    latin: Prīmā lūce Suma exiit. Post multās hōrās Suma dēfessa in viā cōnsēdit.
    gloss: Prīmā lūce = At dawn
    underline:
    - Prīmā lūce
  - n: 16
    latin: Dum cēnābat, trēs avēs pulchrās vīdit. Suma avibus cibum laetē dedit. Subitō
  - n: 17
    latin: avēs in caelum volāvērunt et Sumam ad flūmen, ubi caelum tangit, dūxērunt.
  - n: 18
    latin: Triumphāns Suma aquam reportāvit. Topa nunc erat sānus. Itaque
  - n: 19
    latin: Pachacoutec frātrēs Sumae līberāvit.
