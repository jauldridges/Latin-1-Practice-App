passages:
- id: butterflies
  title: WHY BUTTERFLIES DON’T LIVE IN HOUSES
  subtitle: Mariposa copes with her sorrow.
  note: Mariposa means butterfly in Spanish.
  source: Based on a Mexican folktale
  questions:
  - 30
  - 40
  lines:
  - n: 1
    latin: Ōlim papiliōnēs in domibus habitābant. Puella, nōmine Maripōsa,
    gloss: papiliōnēs = butterflies; domibus = houses
    underline:
    - papiliōnēs
    - domibus
  - n: 2
    latin: in parvā domō habitābat. Dum in viā ambulat, subitō pecūniam
  - n: 3
    latin: cōnspexit. “Quam fortūnāta sum!” Maripōsa clāmāvit. “Ad forum
  - n: 4
    latin: festīnāre cupiō.” In forō textum multīs colōribus rēgālibus cōnspexit.
    gloss: textum = fabric; rēgālibus = royal
    underline:
    - textum
    - rēgālibus
  - n: 5
    latin: Maripōsa exclāmāvit, “Textum mihi magnopere placet!”
    gloss: magnopere = greatly
    underline:
    - magnopere
  - n: 6
    latin: Maripōsa stolam pulchram ē textō fēcit et saepe stolam gerēbat quae
  - n: 7
    latin: multōs colōrēs rēgālēs habēbat. Ūnō diē in forō puer, Pūblius Flōrus,
    gloss: diē = day
    underline:
    - diē
  - n: 8
    latin: Maripōsam gerentem stolam vīdit. Puer exclāmāvit, “Salvē, mea rēgīna!”
    gloss: gerentem = wearing
    underline:
    - gerentem
  - n: 9
    latin: Mox puella et puer erant amīcī.
  - n: 10
    latin: Post multōs annōs Pūblius dēclārāvit, “Volō tē in mātrimōnium dūcere.”
  - n: 11
    latin: Maripōsa laetē respondit, “Ita vērō! Amō tē.” Ante diem nūptiālem
    gloss: nūptiālem = wedding
    underline:
    - nūptiālem
  - n: 12
    latin: Pūblius tamen ē vītā discessit. Post mortem Pūblī, Maripōsa misera erat.
    gloss: discessit = departed
    underline:
    - discessit
  - n: 13
    latin: Amīcī multōs et variōs flōrēs Maripōsae dōnāvērunt. Incēpit amāre
    gloss: Incēpit = She began
    underline:
    - Incēpit
  - n: 14
    latin: odōrem flōrum. Itaque Maripōsa inter flōrēs circum oppidum volābat et
    gloss: volābat = was flying
    underline:
    - volābat
  - n: 15
    latin: domum numquam reveniēbat. Hodiē papiliōnēs, sīcut Maripōsa, nōn iam
    gloss: sīcut = just like
    underline:
    - sīcut
  - n: 16
    latin: in domibus vīvunt, sed hūc illūc volant et flōrēs olfaciunt.
    gloss: hūc illūc = here and there; olfaciunt = smell
    underline:
    - hūc illūc
    - olfaciunt
