  - n: 8
    latin: immortālitātem sed nōn quoque adulēscentiam perpetuam petīverat! Post multōs
    gloss: petīverat = had sought
    underline:
    - petīverat
  - n: 9
    latin: annōs Tīthōnus erat senex. Vīvēbat miserē quod nōn morī poterat! Tandem
    gloss: senex = an old man; morī = to die
    underline:
    - senex
    - morī
  - n: 10
    latin: Tīthōnus neque ambulāre neque verba dīcere poterat. Aurōra eum in cicādam
    gloss: cicādam = cicada/cricket-like insect
    underline:
    - cicādam
  - n: 11
    latin: misericordiā mūtāvit. Hodiē Tīthōnus, nunc etiam cicāda, in parvā ollā
    gloss: misericordiā = out of pity; ollā = jar
    underline:
    - misericordiā
    - ollā
