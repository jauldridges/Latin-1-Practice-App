  lines:
  - n: 1
    latin: Trēs annōs fuit pestilentia in urbe Rōmā. Itaque sacerdōtēs Rōmānī
    gloss: pestilentia = plague; sacerdōtēs = priests
  - n: 2
    latin: lēgātōs ad Graeciam mīsērunt. Lēgātī auxilium ab Aesculapiō, deō
    gloss: lēgātōs = ambassadors
  - n: 3
    latin: sānātiōnis, petēbant. Virī Rōmānī ad templum deī vēnērunt. Subitō
    gloss: sānātiōnis = of healing
  - n: 4
    latin: Rōmānī serpentem vīdērunt. Serpēns templum relinquēbat et ad mare
  - n: 5
    latin: lentē sē movēbat. Serpēns in nāvem Rōmānam ascendit. Prīmō nautae
    gloss: sē movēbat = moved; Prīmō = At first
  - n: 6
    latin: ā nāve fūgērunt quod erant perterritī. Mox rediērunt quod sēnsērunt
    gloss: sēnsērunt = realized
  - n: 7
    latin: serpentem esse deum. Serpēns in mediā nāve sē cēlābat. Nautae cibum
    gloss: sē cēlābat = hid
  - n: 8
    latin: et aquam serpentī dedērunt. Tandem post sex diēs nautae ad urbem
  - n: 9
    latin: Rōmam advēnērunt. Serpēns dē nāve dēscendit et ad īnsulam in flūmine
  - n: 10
    latin: Tiberī natābat. Propter adventum serpentis, Rōmānī erant laetī quod
    gloss: Propter adventum = Because of the arrival
  - n: 11
    latin: pestilentia nōn iam in urbe erat.
