passages:
- id: games
  title: THE GAMES WE PLAY
  subtitle: King Janus welcomes the god Saturn into Italy.
  note: ''
  source: Adapted from Macrobius, Saturnalia I.7.22
  questions:
  - 31
  - 40
  lines:
  - n: 1
    latin: Saturnus, quem Iuppiter vīcerat, dē caelō ad terram fūgit
    gloss: quem = whom; vīcerat = had overthrown
    underline:
    - quem
    - vīcerat
  - n: 2
    latin: et in Italiam nāvigāvit. Fugitīvus ad rēgem Iānum, quī tum
    gloss: Fugitīvus = As a fugitive
    underline:
    - Fugitīvus
  - n: 3
    latin: terram regēbat, magna beneficia ferēbat. Populī antīquī Italiae
    gloss: ferēbat = he was bringing
    underline:
    - ferēbat
  - n: 4
    latin: erant ferī et sine cultū lēgibusque vīvēbant. Populī domōs nōn
    gloss: ferī = wild; cultū = culture; domōs = houses
    underline:
    - ferī
    - cultū
    - domōs
  - n: 5
    latin: habēbant sed in cavernīs aut in arboribus habitābant. Nucēs
    gloss: Nucēs = nuts
    underline:
    - Nucēs
  - n: 6
    latin: et frūctūs et crūdam carnem edēbant. Saturnus igitur lēgēs dedit
    gloss: frūctūs = fruits; crūdam carnem = raw meat
    underline:
    - frūctūs
    - crūdam carnem
  - n: 7
    latin: et populōs docuit domōs aedificāre et agrōs colere et cibum
    gloss: aedificāre = to build; colere = to cultivate
    underline:
    - aedificāre
    - colere
  - n: 8
    latin: coquere. Prō hīs beneficiīs, Iānus Saturnō grātiās agēbat.
    gloss: hīs = these
    underline:
    - hīs
  - n: 9
    latin: Postquam Saturnus ab Italiā nāvigāvit, Iānus populōs celebrāre
  - n: 10
    latin: hunc deum voluit. Ergō, ubi nummōs faciēbat, ex ūnā parte
    gloss: hunc = this; nummōs = coins; ex ūnā parte = on one side
    underline:
    - hunc
    - nummōs
    - ex ūnā parte
  - n: 11
    latin: imāginem capitis Iānī, ex alterā parte imāginem nāvis exprimēbat.
    gloss: exprimēbat = he was representing
    underline:
    - exprimēbat
  - n: 12
    latin: Ubi puerī Rōmānī lūdēbant, nummōs in sublīme iactābant et
    gloss: in sublīme = into the air; iactābant = they tossed
    underline:
    - in sublīme
    - iactābant
  - n: 13
    latin: “Capita!” aut “Nāvia!” exclāmābant.
    gloss: Nāvia = Nāvēs
    underline:
    - Nāvia
