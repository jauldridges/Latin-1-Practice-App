  lines:
  - n: 1
    latin: Ōlim erat dea iūstitiae, nōmine Astraea. Astraea erat fīlia Iovis et in terrā cum
    gloss: iūstitiae = of justice; Iovis = of Jupiter
  - n: 2
    latin: hominibus habitābat. Astraea erat bona et iūsta. Itaque hominēs deam amābant,
    gloss: iūsta = just
  - n: 3
    latin: et dea hominēs amābat. Pulchra erat dea et semper in manibus lībram tenēbat.
    gloss: lībram = a set of scales
  - n: 4
    latin: 'Lībra erat īnstrūmentum quod duās partēs habet: altera prō bonō, altera prō malō.'
    gloss: altera…altera = one…the other
  - n: 5
    latin: Astraea hominibus bonīs dōna semper dabat, nihil hominibus malīs.
  - n: 6
    latin: Sed post multōs annōs, hominēs mōrēs malōs habēbant. Saepe erant īrātī et
    gloss: mōrēs = habits
  - n: 7
    latin: bella semper faciēbant. Nōn iam lēgēs et iūra observābant. Iūstitiam nōn amābant.
    gloss: Nōn iam = no longer; iūra = rights
  - n: 8
    latin: “Cūr hominēs mōrēs malōs nunc habent?” Astraea rogāvit. “Cūr dē iūstitiā nōn
  - n: 9
    latin: iam cōgitant?”
  - n: 10
    latin: Dea trīstis diū lacrimābat. Tandem dīxit, “Nōn possum hīc manēre. Hominēs
    gloss: Tandem = At last; hīc = here
  - n: 11
    latin: nōn iam mōrēs bonōs habent.” Tum dea sine lacrimīs et cūrā in caelum celeriter
  - n: 12
    latin: ascendit. Ibi inter stellās stetit. Nunc hominēs eam “Virginem” vocant, quod dea
    gloss: Virginem = Virgo
  - n: 13
    latin: virgō erat.
    gloss: virgō = maiden
  - n: 14
    latin: Dea nōn sōla ascendit, quod etiam īnstrūmentum sēcum portāvit.
    gloss: sēcum = with her
  - n: 15
    latin: Nunc in caelō fulgent. “Virgō” appāret inter stellās ubi diēs non iam calidī sunt et
    gloss: fulgent = they shine
  - n: 16
    latin: folia dē arboribus cadunt. Nunc, ubi hominēs Astraeam et īnstrūmentum eius in
    gloss: folia = leaves
  - n: 17
    latin: caelō vident, dē iūstitiā cōgitant.
