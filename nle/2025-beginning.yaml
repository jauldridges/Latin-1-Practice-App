  lines:
  - n: 1
    latin: Nocte in caelō sunt multae stellae et hominēs multās cōnstellātiōnēs
  - n: 2
    latin: vident. Inter eās est quaedam cōnstellātiō, Scorpiō nōmine. Haec est
    gloss: quaedam = a certain; Haec = This
    underline:
    - quaedam
    - Haec
  - n: 3
    latin: 'fābula dē Scorpiōne et dē īrā deae:'
    gloss: dē = about
    underline:
    - dē
  - n: 4
    latin: Diāna, dea vēnātiōnis, īrāta erat quod Ōrīōn, vir fortis sed malus,
    gloss: vēnātiōnis = of the hunt
    underline:
    - vēnātiōnis
  - n: 5
    latin: multa animālia in silvīs interfēcit. Erat cervus sacer, quī Diānam valdē
    gloss: cervus = stag
    underline:
    - cervus
  - n: 6
    latin: dēlectābat. Ōrīōn cervum sacrum capere cupiēbat. Itaque Diāna
    gloss: cupiēbat = was wanting
    underline:
    - cupiēbat
  - n: 7
    latin: maximum scorpiōnem mittere cōnstituit quod Ōrīōnem pūnīre cupiēbat.
    gloss: cōnstituit = decided
    underline:
    - cōnstituit
  - n: 8
    latin: Ubi Ōrīōn per silvās ambulābat, maximus scorpiō ad Ōrīōnem vēnit
  - n: 9
    latin: et eum caudā vulnerāvit. Cauda scorpiōnis habēbat multum venēnum.
    gloss: caudā = with its tail; venēnum = poison
    underline:
    - caudā
    - venēnum
  - n: 10
    latin: Ōrīōn valdē dolēbat et mox erat mortuus. Posteā, Diāna scorpiōnem
    gloss: valdē dolēbat = he was suffering very much
    underline:
    - valdē dolēbat
  - n: 11
    latin: inter stellās posuit, quod dea hominēs scīre dē malō Ōrīōne cupiēbat.
  - n: 12
    latin: Nunc, ubi hominēs in caelō Scorpiōnem vident, semper fābulam
  - n: 13
    latin: Ōrīōnis in memoriā tenent et animālia servāre cupiunt.
