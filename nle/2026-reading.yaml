items:
- n: 1
  stem: Which of the following qualities was shared by both Hector and Achilles, according to line 1?
  options:
    a: strength
    b: being Greek
    c: being Trojan
    d: affection
  answer: a
  node: CR-009
  passage: achilles-1
- n: 2
  stem: According to lines 2-3, what caused Achilles to feel sad and angry?
  options:
    a: The Greeks have fought for too long.
    b: Achilles’ soldiers were taken from him.
    c: Achilles was afraid of losing the battle.
    d: Hector killed Achilles’ friend.
  answer: d
  node: CR-009
  passage: achilles-1
- n: 3
  stem: In lines 2-3, what did Achilles want to do (Itaque Achillēs...volēbat)?
  options:
    a: see his friend Patroclus
    b: refuse to fight in battle
    c: kill the enemy whom he blames
    d: seek the comfort of his parents
  answer: c
  node: CR-009
  passage: achilles-1
- n: 4
  stem: Who or what was described as swift and strong (lines 4-5)?
  options:
    a: Patroclus’ weapons
    b: Achilles’ horses
    c: Neptune
    d: the Greeks
  answer: b
  node: CR-009
  passage: achilles-1
- n: 5
  stem: To whom does fīliō fortī (line 5) refer?
  options:
    a: Neptune
    b: a sea nymph
    c: Patroclus
    d: Achilles
  answer: d
  node: CR-015
  passage: achilles-1
- n: 6
  stem: How did Achilles come to own Xanthus and Balius (line 5)?
  options:
    a: They were a present.
    b: They were spoils of war.
    c: They appeared in a storm.
    d: They were saved from a disaster.
  answer: a
  node: CR-009
  passage: achilles-1
- n: 7
  stem: In line 6, (Equī…habēbant), what do we learn that the horses possessed?
  options:
    a: strength and aggression
    b: intelligence and loyalty
    c: training and discipline
    d: curiosity and independence
  answer: b
  node: CR-009
  passage: achilles-1
- n: 8
  stem: What does et…et mean in line 6?
  options:
    a: again…again
    b: both…and
    c: neither…nor
    d: either…or
  answer: b
  node: MS-051
  passage: achilles-1
- n: 9
  stem: Who is the subject of cūrābant (line 6)?
  options:
    a: the gods
    b: the Greeks
    c: the horses
    d: the Trojans
  answer: c
  node: CR-003
  passage: achilles-1
- n: 10
  stem: In line 7, what was the first way the horses showed affection for their master (Dominō…solēbant)?
  options:
    a: making angry faces at his enemies
    b: refusing to let others approach
    c: neighing at his presence
    d: only eating food given by him
  answer: c
  node: CR-009
  passage: achilles-1
- n: 11
  stem: How else did the horses acknowledge their master in line 7?
  options:
    a: They lowered their heads when he approached them.
    b: They swished their tails at his arrival.
    c: They perked up their ears to listen to him.
    d: They touched him with their noses.
  answer: a
  node: CR-009
  passage: achilles-1
- n: 12
  stem: According to line 8, what did the horses usually do?
  options:
    a: make more noise than other horses
    b: pull a chariot for many Greek soldiers
    c: bring Achilles into battle
    d: neigh to attract other horses
  answer: c
  node: CR-009
  passage: achilles-1
- n: 13
  stem: In lines 8-9, what did the horses do?
  options:
    a: leave Patroclus alone in battle
    b: bring Patroclus dressed as Achilles into battle
    c: allow Patroclus to rescue Achilles from battle
    d: bring Hector out of battle to fight Patroclus
  answer: b
  node: CR-009
  passage: achilles-1
- n: 14
  stem: According to line 10, where were the horses?
  options:
    a: on a mountain
    b: behind Hector
    c: beside Patroclus
    d: in their stalls
  answer: c
  node: CR-009
  passage: achilles-1
- n: 15
  stem: In line 10, the horses are described as _____.
  options:
    a: sorrowful
    b: angry
    c: disinterested
    d: violent
  answer: a
  node: CR-009
  passage: achilles-1
- n: 16
  stem: Why was Achilles dissatisfied with the horses in lines 11-12?
  options:
    a: for not being fast enough
    b: for not bringing back Patroclus’ corpse
    c: for refusing to let him kill Hector
    d: for refusing to fight
  answer: b
  node: CR-009
  passage: achilles-1
- n: 17
  stem: What did Achilles order Xanthus and Balius to do (line 12)?
  options:
    a: bring soldiers to help
    b: take him into battle
    c: kill Hector
    d: thank the gods
  answer: b
  node: MS-077
  passage: achilles-1
- n: 18
  stem: According to line 12, what did Achilles want to do?
  options:
    a: to find his armor
    b: to curse the gods
    c: to avenge a friend
    d: to save a family member
  answer: c
  node: CR-009
  passage: achilles-1
- n: 19
