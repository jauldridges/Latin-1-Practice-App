passages:
- id: phaethon
  title: AN UNFORTUNATE REQUEST
  subtitle: Phaethon asks Phoebus Apollo for a favor.
  note: ''
  source: Inspired by Ovid, Metamorphoses I and II
  questions:
  - 31
  - 40
  lines:
  - n: 1
    latin: Phaethon, fīlius Phoebī Apollinis, superbus erat quod pater
  - n: 2
    latin: deus sōlis erat.
  - n: 3
    latin: Ōlim, amīcus Phaethontis, “Pater tuus,” inquit, “NŌN est deus!”
    gloss: Phaethontis = of Phaethon; inquit = says
    underline:
    - Phaethontis
    - inquit
  - n: 4
    latin: Phaethon, commōtus īrā, deum vīsitāvit. Equōs et currum sōlis
    gloss: commōtus = moved; currum = chariot
    underline:
    - commōtus
    - currum
  - n: 5
    latin: agere voluit. Patrem igitur rogābat, “Possumne currum
    gloss: agere = to drive; igitur = therefore
    underline:
    - agere
    - igitur
  - n: 6
    latin: sōlis hodiē agere?” Pater nōn laetus erat et prīmum negāvit.
    gloss: negāvit = said no
    underline:
    - negāvit
  - n: 7
    latin: Phaethon tandem Phoebō persuāsit et pater cōnsēnsit.
    gloss: Phoebō persuāsit = persuaded Phoebus
    underline:
    - Phoebō persuāsit
  - n: 8
    latin: “Perīculōsum est,” inquit, “agere currum sōlis! Cavē!
  - n: 9
    latin: Age currum magnā cum cūrā!”
  - n: 10
    latin: Phaethon currum per caelum agēbat. Equī sēnsērunt puerum
  - n: 11
    latin: incertum et celeriter currēbant. Phaethon currum agere bene
  - n: 12
    latin: nōn potuit. Multae terrae frīgidae fīēbant quod equī ad caelum
    gloss: fīēbant = became
    underline:
    - fīēbant
  - n: 13
    latin: altum volābant. Tum equī prope terram volābant. Calor sōlis
    gloss: volābant = were flying; Calor = The heat
    underline:
    - volābant
    - Calor
  - n: 14
    latin: multās urbēs et silvās īnflāmmāvit. Flūmina erant sicca.
    gloss: sicca = dry
    underline:
    - sicca
  - n: 15
    latin: Hominēs erant perterritī et trīstēs.
    gloss: trīstēs = sad
    underline:
    - trīstēs
  - n: 16
    latin: Iuppiter perīculum vīdit et fulminibus currum dēlēvit.
    gloss: fulminibus = by lightning bolts; dēlēvit = destroyed
    underline:
    - fulminibus
    - dēlēvit
  - n: 17
    latin: Necesse est igitur mandāta parentum semper audīre!
