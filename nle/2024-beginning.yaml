passages:
- id: numa
  title: A BATTLE OF WITS
  subtitle: Numa employs three magic words against Jupiter’s powers.
  note: ''
  source: Adapted from Plutarch, Numa 15, and Ovid, Fasti 3
  questions:
  - 31
  - 40
  lines:
  - n: 1
    latin: Numa, secundus rēx Rōmānōrum, religiōnem populō Rōmānō dabat. Rēx
  - n: 2
    latin: tamen volēbat capere duōs satyrōs, Pīcum et Faunum, quī verba magica contrā
    gloss: satyrōs = satyrs (woodland creatures)
    underline:
    - satyrōs
  - n: 3
    latin: Iovem dīcere sciēbant. Numa satyrōs dēcēpit et cēpit. Duo satyrī rēgī dīxērunt
    gloss: Iovem = Jupiter; dēcēpit = deceived
    underline:
    - Iovem
    - dēcēpit
  - n: 4
    latin: tria verba magica quae fulmina deī repellere poterant.
    gloss: fulmina = thunderbolts
    underline:
    - fulmina
  - n: 5
    latin: Iuppiter, quod Numa nunc erat superbus, erat īrātus et ad terram dē caelō
    gloss: superbus = arrogant
    underline:
    - superbus
  - n: 6
    latin: dēscendit. Iuppiter Numae clāmāvit, “Potesne repellere fulmina mea ab urbe
  - n: 7
    latin: tuā? Dēmōnstrā mihi potentiam tuam!”
    gloss: potentiam = power
    underline:
    - potentiam
  - n: 8
    latin: Numa rogāvit, “Ita vērō, omnipotēns, sed quōmodo?”
  - n: 9
    latin: “Capitibus!” Iuppiter statim nūntiāvit.
    gloss: Capitibus = With heads
    underline:
    - Capitibus
  - n: 10
    latin: “Capitibus bulbōrum?” prīmum Numa callidē rogāvit.
    gloss: bulbōrum = of onions; callidē = cleverly
    underline:
    - bulbōrum
    - callidē
  - n: 11
    latin: “Virōrum!” Iuppiter respondit.
  - n: 12
    latin: “Capillīs virōrum?” tum Numa sine morā prōposuit.
    gloss: Capillīs = With hair; morā = delay
    underline:
    - Capillīs
    - morā
  - n: 13
    latin: Iuppiter inquit, “Minimē! Vītās poscō!”
    gloss: poscō = I demand
    underline:
    - poscō
  - n: 14
    latin: “Vītās piscium? Piscēs ē marī igitur tibi dabimus,” tandem Numa prōmīsit.
  - n: 15
    latin: Postquam Iuppiter tria verba magica, “bulbōs” et “capillōs” et “piscēs,” audīvit,
  - n: 16
    latin: fulmina torquēre nōn poterat. Etiam hodiē Rōmānī fulmina magicīs verbīs,
    gloss: torquēre = to throw
    underline:
    - torquēre
  - n: 17
    latin: “bulbīs” et “capillīs” et “piscibus,” repellunt.
