items:
- n: 1
  stem: What was Marcella unable to do (line 1)?
  options:
    a: see
    b: read
    c: count
    d: walk
  answer: d
  node: CR-009
  passage: marcella-1
- n: 2
  stem: According to lines 1-2, how many children are in this family?
  options:
    a: I
    b: II
    c: III
    d: IV
  answer: c
  node: CR-009
  passage: marcella-1
- n: 3
  stem: According to lines 1-2 (Marcella…temptābant), what were Marcella’s family members trying to do?
  options:
    a: have her play with the dog
    b: teach her to walk
    c: make a doll for her
    d: feed her a meal
  answer: b
  node: CR-009
  passage: marcella-1
- n: 4
  stem: Where did Rex the dog often sleep (lines 2-3, Rēx…dormiēbat)?
  options:
    a: in the atrium
    b: in the kitchen
    c: in the bedroom
    d: in the garden
  answer: d
  node: CR-009
  passage: marcella-1
- n: 5
  stem: According to lines 3-5 (Ūnō diē…dēmōnstrābat), who was located closest to Marcella?
  options:
    a: the dog
    b: Tiberius
    c: Aulus
    d: the mother
  answer: b
  node: CR-009
  passage: marcella-1
- n: 6
  stem: Why does Tiberius lift up Marcella (lines 3-4, Tiberius…tollēbat)?
  options:
    a: He is standing her up onto her feet.
    b: He wants to show her the picture on the wall.
    c: He is moving her away from the water.
    d: He is separating her from her brother Aulus.
  answer: a
  node: CR-009
  passage: marcella-1
- n: 7
  stem: Which of the following English words is NOT a derivative of the root of the verb form stābat (line 4)?
  options:
    a: stance
    b: station
    c: stagnant
    d: statue
  answer: c
  node: MW-009
  passage: marcella-1
- n: 8
  stem: What is Aulus doing from across the room (lines 4-5, Aulus…dēmōnstrābat)?
  options:
    a: He is laughing at Marcella trying to sing.
    b: He makes animal noises to distract Marcella.
    c: He is hiding his toys from Marcella.
    d: He is showing the doll to Marcella.
  answer: d
  node: CR-009
  passage: marcella-1
- n: 9
  stem: According to line 5, how does Tiberius try to encourage Marcella?
  options:
    a: He talks to her calmly.
    b: He holds the dog for her to pet.
    c: He gives her the doll.
    d: He claps his hands.
  answer: a
  node: CR-009
  passage: marcella-1
- n: 10
  stem: In lines 5-6 (Aulus…clāmābat), what is one way Aulus tries to get Marcella’s attention?
  options:
    a: He makes crying sounds like a baby.
    b: He sings a silly song.
    c: He throws toys at her.
    d: He repeatedly calls out her name.
  answer: a
  node: CR-009
  passage: marcella-1
- n: 11
  stem: In lines 7-8 (Aulus…dēiciēbat), how does Aulus react to Marcella’s efforts?
  options:
    a: He gives praise.
    b: He becomes happy.
    c: He loses his temper.
    d: He makes fun of her.
  answer: c
  node: CR-009
  passage: marcella-1
- n: 12
  stem: According to lines 8-9, what often makes Marcella scream and cry?
  options:
    a: Tiberius not paying attention to her
    b: Marcella’s mother putting her to bed
    c: Marcella losing her doll
    d: Aulus making fun of her
  answer: c
  node: CR-009
  passage: marcella-1
- n: 13
  stem: Which of the following is TRUE, according to lines 8-9?
  options:
    a: The dog once made Marcella happy.
    b: The dog always attacked intruders.
    c: The dog never left Marcella’s side.
    d: The dog sometimes caused Marcella to cry.
  answer: d
  node: CR-009
  passage: marcella-1
- n: 14
  stem: Which Olympian god was associated with an equum which he first created in a competition to win the patronage
    of the city of Athens?
  options:
    a: Neptune
    b: Jupiter
    c: Mercury
    d: Vulcan
  answer: a
  node: RW-064
  passage: marcella-2
- n: 15
  stem: In line 10, to whom or what does quī refer?
  options:
    a: the brothers
    b: the horse
    c: the wheels
    d: the house
  answer: b
  node: CR-015
  passage: marcella-2
- n: 16
  stem: According to lines 10-11, what was Aulus doing to the small wooden horse?
  options:
    a: painting it
    b: destroying it
    c: pulling it
    d: building it
  answer: c
  node: CR-009
  passage: marcella-2
- n: 17
  stem: In line 11, we learn that Tiberius was playing with a small boat in the impluvium. In what part of their
    Roman house would this be located?
  options:
    a: peristȳlium
    b: cubiculum
    c: ātrium
    d: trīclīnium
  answer: c
  node: RW-048
  passage: marcella-2
- n: 18
  stem: According to line 12, what was the dog doing?
  options:
    a: chewing on a bone
    b: barking at the boys
    c: chasing a mouse
    d: lying in the sun
  answer: d
  node: CR-009
  passage: marcella-2
- n: 19
  stem: What happened to Marcella in lines 12-13 (māter…dēposuit)?
  options:
    a: She was knocked over by the dog.
    b: She was placed near her brothers.
    c: Someone took her doll.
    d: Her brothers made her cry.
  answer: b
  node: CR-009
  passage: marcella-2
- n: 20
  stem: According to lines 13-14 (Tiberius…discēdēbat), why did Tiberius become angry?
  options:
    a: Aulus was making waves in the impluvium.
    b: His boat did not stay upright in the water.
    c: His mother told him not to play in the impluvium.
    d: Marcella wanted to play with the boat.
