    c: talking to his mother
    d: cleaning up after the dog
  answer: a
  node: CR-009
  passage: marcella-2
- n: 23
  stem: A derivative in English for serpere (line 16) is “serpent.” What does Marcella begin to do (serpere incipit)?
  options:
