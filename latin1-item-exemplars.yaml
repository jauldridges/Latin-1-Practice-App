# ============================================================
# Latin I — Seed Exemplar Items
# Libertas Academy Charter School · FY27 · J. Sullivan
# Draft v2 · August 2026
#
# COMPANION TO latin1-spec.yaml v2.0. Read that file first.
#
# WHAT THIS IS
# Hand-built example items covering Unit 0 and Unit 1 only.
# These are patterns to generate against, not a bank to ship.
# Every judgment call a generator has to make is demonstrated
# here at least once, including the ones that are easy to get
# wrong.
#
# CHANGED IN v2
# - Answer checking rewritten. Write-in answers are now split
#   into small separately-checked boxes, or handed to the
#   student to check themselves. See `answer_checking` below.
#   This is the whole reason v2 exists.
# - Translate items moved off exact-match entirely.
# - Vocabulary rule clarified: a Latin word may appear in a
#   stem if it is glossed there. It must be on the list only
#   if the student has to know it or produce it.
# ============================================================

meta:
  course: Latin I
  scope: Units 0 and 1 only (Aug 21 – Oct 8, 2026)
  spec_version: 2.0
  exemplar_count: 75
  status: >
    Teaching text on every node is a blank slot. Nothing
    student-facing ships unread.

# ============================================================
# ANSWER CHECKING
# The most important section in this file. Every write-in item
# below is built to these rules, and generated items must be
# too. Getting this wrong produces an app that marks correct
# work incorrect, which will lose the room in a week.
# ============================================================

answer_checking:

  principle: >
    Never ask a student to type a long string and then compare
    it whole. Break the answer into the smallest pieces that
    can stand alone, or hand the checking to the student.

  clean_before_comparing: >
    Strip all of the following before any comparison:
      - capital letters
      - macrons
      - punctuation
      - extra or repeated spaces
      - a leading dash on an ending (-mus and mus are the same)
      - a leading "the" or "a"
    None of these require judgment. All of them cause false
    wrong marks.

  three_results: >
    Right, close, or wrong — not just right or wrong.
    CLOSE means the typed answer is within two characters of an
    accepted answer. The app says the spelling needs another
    look and lets the student retype. Close never counts
    against them and never triggers the what-went-wrong menu.
    A student who typed "puela" knows the answer. Marking that
    wrong teaches them the app is unfair, and they stop using
    it.

  formats:

    boxes: >
      The default for recall and short produce items. The answer
      is split into separate boxes, each holding one or two
      words. Each box is checked and reported on its own, so a
      student who gets four of six verb endings sees four right
      and two wrong rather than one red X.
      Where the order of the boxes does not matter, the item
      says so with `order_matters: false` and any box may hold
      any correct answer.

    choice: >
      Multiple choice. Unchanged from v1.

    self-check: >
      The student types their answer, then sees the model
      answer, then reports: I had it · I was close · I didn't
      have it.
      This is legitimate here for one specific reason: the app
      grades nothing. Mastery for the gradebook comes only from
      proctored work. Self-check is how flashcards have always
      worked and it is honest about what free text can and
      cannot be checked mechanically.
      What the student typed is logged next to what they
      reported. The gap between the two is its own signal — a
      student who consistently says "I had it" over answers
      that do not match is worth a conversation.

    tag-then-translate: >
      For sentences. The student first labels each word with
      its case and its job. Those labels are checked by the
      app, box by box. Then the English translation is
      self-checked.
      This is the preferred shape for translation because a
      finished English sentence hides how it was reached. The
      labels show whether the student read the endings or
      guessed from word order, which is the single thing this
      course is trying to find out in the fall.

  never: >
    Do not have a language model judge free text at the moment
    a student answers. It is slow, it costs money on every
    attempt, and models get Latin morphology wrong in exactly
    the places that matter — macrons, irregular stems,
    ambiguous endings. A confident wrong judgment is worse
    than no judgment.

# ============================================================
# HARD RULES FOR GENERATION
# Violating any of these produces items that must be thrown out.
# ============================================================

rules:

  vocabulary_ceiling: >
    Units 0 and 1 deliver 78 words (80 if the two conjunctions
    in ISSUE-03 are added). A student may only be asked to KNOW
    or PRODUCE a word from that list.

    A Latin word from outside the list MAY appear in a stem if
    it is glossed right there and is the object of study rather
    than something to be recalled. This covers three legitimate
    cases: the word pairs used to show what a macron does; the
    Latin words cited in Spanish sound-change items; and Roman
    household and institutional vocabulary in the Roman World
    strand.

    The test is simple. If the student has to have learned the
    word to answer, it must be on the list. If the word is
    handed to them in the question, it does not.

    The full list is at the bottom of this file.

  one_node_per_item: >
    Each item has exactly one `node`. That is the thing the
    item is about, and the only node the item reports on.
    `touches` lists the other concepts a student could get
    wrong here. It defaults to that node's prerequisites in
    the spec. Override it by hand when the real mistake lies
    somewhere the prerequisite list does not reach.

  what_went_wrong_menu: >
    On a wrong answer the app shows the right answer, then
    asks the student what happened. Every choice on that menu
    is tagged to the node that explains that specific mistake,
    drawn from `touches`. Three fixed choices always appear at
    the bottom and are not written per item:
      - I don't know
      - I didn't know the word
      - I think my answer should be right
    The last one flags the item for re-review.
    A CLOSE result never triggers this menu.

  explain_items: >
    An explain item gives the student the answer in the stem
    and asks for the reason. The choices are competing reasons,
    never competing answers. If the choices are answers, the
    item is a recognize item and must be retagged. This rule
    governs about a third of the whole course, so it is the
    one worth checking twice.

  recall_items: >
    Recall means retrieving from memory with nothing in front
    of you. Recall items never use multiple choice — the moment
    you give four options it becomes a recognize item. Recall
    items use boxes.
    Many recall items have no meaningful wrong-answer menu —
    the student either knew it or didn't. Leave the menu empty
    rather than inventing one.

  macrons: >
    Macrons are stripped before checking, except on items
    flagged `macron_matters: true`. Those are items where the
    macron is the whole point. On those the stem must tell the
    student that the macron counts.

  paper: >
    `paper_ok: true` means the item works on a printed quiz.
    Anything depending on instant feedback, a follow-up menu,
    or self-reporting is `paper_ok: false`.

  tier: >
    1 = first encounter, straightforward.
    2 = normal quiz difficulty.
    3 = hardest version of this node a Latin I student should
        meet. Traps allowed.

  accommodated_versions: >
    Every item exists in up to three versions. v1 is the item
    as written. v2 and v3 are generated from v1 by applying the
    transformations below — never by writing a new item.

    The distinction that governs everything: an ACCOMMODATION
    changes how a student reaches the answer. A MODIFICATION
    changes what is being asked. v2 items report to the same
    node at the same bar. v3 items report to the same node at a
    lower bar and must be marked as such wherever mastery is
    displayed.

    v2 — ACCOMMODATED. Same content, same difficulty, fewer
    barriers between the student and the Latin.
      1. One question per screen. No stem with two parts.
      2. Plain-English question wrapper. Shorten and simplify
         the English around the Latin. The Latin itself is
         never simplified — that is the thing being tested.
      3. Every Latin word in the stem that is NOT the thing
         being tested carries an English gloss in brackets. A
         vocabulary gap must never hide grammar knowledge.
      4. Macrons always printed. Never required in an answer.
      5. Answer boxes carry their expected shape as placeholder
         text — "one word", "an ending", "a number".
      6. No time pressure. Response latency is still logged but
         is not surfaced to the student.

    v3 — MODIFIED. Lower bar. Use only where an IEP or 504 calls
    for it.
      1. Multiple choice drops from four options to two. Keep
         the correct answer and the single most instructive
         wrong one — which is almost always the trap named in
         the item's note, not the most distant option.
      2. Write-in items become recognition items. A produce
         item with one box becomes a four-option choice built
         from that box's answer plus three wrong forms. This is
         a real reduction in what is assessed and is the reason
         v3 is a modification.
      3. Box items get a word bank above them containing every
         correct answer plus two extras.
      4. Tier 3 items are not offered. If a node has only tier 3
         items, generate a tier 1 v3 rather than reducing a
         tier 3.
      5. Multi-box items are cut to the two most important
         boxes. For the six verb endings, that is the first
         person singular and the third person plural.

    WHAT NEVER CHANGES ACROSS VERSIONS
      - The node the item reports to.
      - The correct answer.
      - The what-went-wrong menu and its node tags. A student on
        a modified version still generates the same diagnostic
        data, which is the entire point of carrying the version
        field.

    ONE CONFLICT WORTH KNOWING. Items flagged
    macron_matters: true cannot be read aloud — the whole
    distinction is visual. They are marked
    read_aloud_safe: false. A student whose accommodation is
    read-aloud gets a different item on that node, not a read
    version of this one. There is no way around this; a macron
    is not a sound a reader can produce.

    These transformations were written without access to the
    roster. Check them against the actual IEP and 504 language
    once accommodation data exists, and expect at least one to
    need changing.

  teaching_text: >
    Each node gets a short explanation, worked examples, and
    post-answer explanations. These are written or approved by
    Jack. Generators leave `teaching` empty.

# ============================================================
# THE TRAP THAT MATTERS MOST
# ============================================================
#
# A distractor that turns out to be correct teaches a
# falsehood, and it will survive all year unless something
# catches it. Three ways this happens in Unit 1, all
# demonstrated below.
#
# 1. AMBIGUOUS BY NATURE. Neuter nouns have the same form for
#    subject and object. Asking "what case is bellum?" has two
#    right answers. See EX-PARSE-003.
#
# 2. IDENTICAL STRINGS. The plural subject form and plural
#    object form of a neuter noun are the same word. Neither
#    can be a wrong choice for the other. See EX-PRODUCE-004.
#
# 3. TRUE IN LATIN, WRONG IN THIS COURSE. `puellae` really is
#    a genitive singular. Students do not meet the genitive
#    until Unit 2. A generator that knows all of Latin will
#    mark that distractor correct and delete it; it must not.
#    Scope beats truth. See EX-PARSE-007.
#
# The check that catches all three: before an item ships, ask
# of every wrong choice, "could a good student defend this?"
# If yes, the item is broken.

# ============================================================
# ITEMS
# ============================================================

items:

# ------------------------------------------------------------
# RECALL — 12 items · boxes · all paper-safe
# ------------------------------------------------------------

  - id: EX-RECALL-001
    node: MS-001
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Classical Latin does not use two letters that English has. Write one in each box."
    order_matters: false
    boxes:
      - label: "Letter"
        answer: ["j"]
      - label: "Letter"
        answer: ["w"]
    touches: []
    what_went_wrong: []
    versions: {}
    teaching: ""

  - id: EX-RECALL-002
    node: MS-016
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "A Latin noun's dictionary entry gives three pieces of information. Name them."
    order_matters: false
    boxes:
      - label: "First"
        answer: ["nominative", "nominative singular", "nom"]
      - label: "Second"
        answer: ["genitive", "genitive singular", "gen"]
      - label: "Third"
        answer: ["gender"]
    touches: [MS-013]
    what_went_wrong:
      - text: "I listed cases instead of the three parts of the entry"
        node: MS-013
      - text: "I forgot gender was one of them"
        node: MS-016
    note: >
      Order does not matter and each box accepts the short form.
      This is the model for every list-shaped recall item: one
      box per fact, generous on abbreviation, silent on order.
    versions: {}
    teaching: ""

  - id: EX-RECALL-003
    node: MS-022
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "First declension nouns are usually what gender?"
    boxes:
      - label: "Gender"
        answer: ["feminine", "fem", "f"]
    touches: []
    what_went_wrong: []
    versions: {}
    teaching: ""

  - id: EX-RECALL-004
    node: MS-022
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Three first declension nouns in our vocabulary are masculine, not feminine. Write one in each box."
    order_matters: false
    boxes:
      - label: "Noun"
        answer: ["nauta"]
      - label: "Noun"
        answer: ["agricola"]
      - label: "Noun"
        answer: ["poeta"]
    touches: [MS-018]
    what_went_wrong:
      - text: "I wrote words ending in -us instead"
        node: MS-023
      - text: "I thought all first declension nouns were feminine"
        node: MS-022
    note: >
      Only three exist in the Unit 0–1 vocabulary. Do not
      generate variants asking for four. There are not four.
      Macrons are stripped, so poēta and poeta both pass.
    versions: {}
    teaching: ""

  - id: EX-RECALL-005
    node: MS-031
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the six personal endings for active verbs, in order."
    order_matters: true
    boxes:
      - label: "I"
        answer: ["o", "m", "o/m"]
      - label: "you"
        answer: ["s"]
      - label: "he, she, it"
        answer: ["t"]
      - label: "we"
        answer: ["mus"]
      - label: "you all"
        answer: ["tis"]
      - label: "they"
        answer: ["nt"]
    touches: [MS-030]
    what_went_wrong:
      - text: "I know the endings but had the order wrong"
        node: MS-031
      - text: "I wrote noun endings instead of verb endings"
        node: MS-030
    note: >
      Six boxes, one ending each, with the English person as the
      box label. A student who gets four right sees four right.
      Leading dashes are stripped, so -mus and mus both pass.
      This item is the clearest case of why v1's approach was
      broken: as one string it had roughly two hundred
      defensible spellings.
    versions:
      v2:
        change: "Placeholder text added to every box reading 'an ending'. No other change — the item is already one question with one task."
      v3:
        change: "Cut to two boxes, plus a word bank."
        boxes:
          - label: "I"
            answer: ["o", "m", "o/m"]
          - label: "they"
            answer: ["nt"]
        word_bank: ["-o", "-s", "-t", "-mus", "-tis", "-nt", "-am", "-ur"]
    teaching: ""

  - id: EX-RECALL-006
    node: MS-032
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write the first two principal parts of the verb meaning 'I praise'."
    order_matters: true
    boxes:
      - label: "First"
        answer: ["laudo"]
      - label: "Second"
        answer: ["laudare"]
    touches: [MS-076]
    what_went_wrong:
      - text: "I gave the English meaning instead of the Latin"
        node: MS-032
      - text: "I wasn't sure what the second part looks like"
        node: MS-076
    versions: {}
    teaching: ""

  - id: EX-RECALL-007
    node: MS-040
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Write all six present-tense forms of sum."
    order_matters: true
    boxes:
      - label: "I am"
        answer: ["sum"]
      - label: "you are"
        answer: ["es"]
      - label: "he/she/it is"
        answer: ["est"]
      - label: "we are"
        answer: ["sumus"]
      - label: "you all are"
        answer: ["estis"]
      - label: "they are"
        answer: ["sunt"]
    touches: [MS-031]
    what_went_wrong:
      - text: "I mixed up es and est"
        node: MS-040
      - text: "I tried to build it from the regular endings"
        node: MS-031
    note: >
      The es/est confusion is the most common sum error and it
      is now visible at the box level rather than buried in a
      wrong string. Worth counting all year.
    versions: {}
    teaching: ""

  - id: EX-RECALL-008
    node: RW-007
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "According to legend, who founded Rome, and in what year?"
    order_matters: true
    boxes:
      - label: "Founder"
        answer: ["romulus"]
      - label: "Year"
        answer: ["753", "753 bce", "753 bc"]
    touches: []
    what_went_wrong:
      - text: "I said Remus instead of Romulus"
        node: RW-007
      - text: "I said Aeneas"
        node: RW-008
    versions: {}
    teaching: ""

  - id: EX-RECALL-009
    node: RW-015
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "How many consuls held office at once, and for how long did they serve?"
    order_matters: true
    boxes:
      - label: "How many"
        answer: ["2", "two"]
      - label: "How long"
        answer: ["one year", "1 year", "a year", "year"]
    touches: [RW-014]
    what_went_wrong: []
    versions: {}
    teaching: ""

  - id: EX-RECALL-010
    node: RW-017
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "SPQR stands for three Latin words. Write them in order."
    order_matters: true
    boxes:
      - label: "S"
        answer: ["senatus"]
      - label: "PQ"
        answer: ["populusque"]
      - label: "R"
        answer: ["romanus"]
    reveal_after: "The Senate and the Roman people. The -que attached to Populus is the word for 'and'."
    touches: [RW-016, MS-051]
    what_went_wrong:
      - text: "I knew the meaning but not the Latin"
        node: RW-017
      - text: "I missed that -que means 'and'"
        node: MS-051
    note: >
      The English meaning is shown after the answer rather than
      scored. Asking a student to type "the Senate and the Roman
      people" into a box is exactly the mistake this version of
      the file exists to remove.
      DEPENDS ON ISSUE-03 — the -que tagging assumes the word
      has actually been delivered.
    versions: {}
    teaching: ""

  - id: EX-RECALL-011
    node: MW-002
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "What does the prefix trans- mean, and give one English word that uses it."
    order_matters: true
    boxes:
      - label: "Meaning"
        answer: ["across", "over", "through"]
      - label: "English word"
        answer_rule: "any English word beginning with trans"
    touches: [MW-001]
    what_went_wrong:
      - text: "I gave a word but couldn't say what the prefix means"
        node: MW-001
    note: >
      The second box uses a rule rather than a list, because any
      of dozens of words is correct. Use `answer_rule` sparingly
      and only where the rule can be stated in one line and
      checked without judgment.
    versions: {}
    teaching: ""

  - id: EX-RECALL-012
    node: MW-044
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "i.e. stands for two Latin words. Write them, then give the English meaning."
    order_matters: true
    boxes:
      - label: "First word"
        answer: ["id"]
      - label: "Second word"
        answer: ["est"]
      - label: "Means"
        answer: ["that is", "thats", "in other words"]
    touches: [MW-043]
    what_went_wrong:
      - text: "I gave the meaning of e.g. instead"
        node: MW-044
    note: >
      Generate the e.g. mirror item. The confusion between them
      is the point of the node.
    versions: {}
    teaching: ""

# ------------------------------------------------------------
# RECOGNIZE — 12 items · multiple choice
# ------------------------------------------------------------

  - id: EX-RECOG-001
    node: MS-007
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which of these words contains a diphthong?"
    options:
      a: "nauta"
      b: "poēta"
      c: "patria"
      d: "silva"
    answer: a
    touches: [MS-005, MS-008]
    what_went_wrong:
      - text: "I picked poēta because I saw o and e next to each other"
        node: MS-007
      - text: "I wasn't sure what counts as a diphthong"
        node: MS-007
      - text: "I thought any two vowels in a row make one"
        node: MS-005
    note: >
      poēta is the whole point. The o and e are adjacent but
      belong to separate syllables — po-ē-ta. It is the only
      word in the Unit 0–1 vocabulary that sets that trap.
    versions: {}
    teaching: ""

  - id: EX-RECOG-002
    node: MS-005
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: true
    stem: "Which word begins with a long vowel?"
    options:
      a: "fāma"
      b: "patria"
      c: "silva"
      d: "porta"
    answer: a
    touches: [MS-006]
    what_went_wrong:
      - text: "I wasn't looking at the macrons"
        node: MS-006
      - text: "I thought long meant a different sound, not a longer one"
        node: MS-005
    versions: {}
    teaching: ""

  - id: EX-RECOG-003
    node: MS-009
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: true
    stem: "In puella, the middle syllable -el- is long. Which is true of it?"
    options:
      a: "It is long by position, because two consonants follow the vowel."
      b: "It is long by nature, because the vowel itself is long."
      c: "It is long because it carries the stress."
      d: "It is long because the word has three syllables."
    answer: a
    touches: [MS-005, MS-008]
    what_went_wrong:
      - text: "I thought a long syllable always means a long vowel"
        node: MS-009
      - text: "I confused syllable length with stress"
        node: MS-010
      - text: "I divided the syllables wrong"
        node: MS-008
    versions: {}
    teaching: ""

  - id: EX-RECOG-004
    node: MS-014
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "In Nauta puellam videt, which word is the subject?"
    options:
      a: "Nauta"
      b: "puellam"
      c: "videt"
      d: "There is no subject."
    answer: a
    touches: [MS-015, MS-012, MS-038]
    what_went_wrong:
      - text: "I picked the first noun without checking the ending"
        node: MS-011
      - text: "I thought puellam was the subject because of word order"
        node: MS-012
      - text: "I picked the verb"
        node: MS-014
    note: >
      Generate the scrambled twin (Puellam nauta videt) and keep
      both. A student who passes the first and fails the second
      has learned English word order, which is the failure this
      unit exists to prevent.
    versions: {}
    teaching: ""

  - id: EX-RECOG-005
    node: MS-021
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which form is the accusative plural of silva?"
    options:
      a: "silvās"
      b: "silvae"
      c: "silvam"
      d: "silva"
    answer: a
    touches: [MS-018, MS-019, MS-020]
    what_went_wrong:
      - text: "I picked the plural but the wrong case"
        node: MS-020
      - text: "I picked the right case but the singular"
        node: MS-019
      - text: "I picked the dictionary form"
        node: MS-018
    note: >
      The model for every paradigm-cell recognize item. Each
      wrong choice is wrong in exactly one way and tagged to the
      cell it actually belongs to. Do not generate wrong choices
      that are wrong in two ways at once — they tell you nothing.
    versions: {}
    teaching: ""

  - id: EX-RECOG-006
    node: MS-026
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which of these nouns is neuter?"
    options:
      a: "bellum"
      b: "dominus"
      c: "puella"
      d: "nauta"
    answer: a
    touches: [MS-022, MS-023]
