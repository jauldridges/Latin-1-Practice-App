  - id: EX-APPLY-002
    node: MS-010
    assess: apply
    tier: 3
    format: choice
    paper_ok: true
    macron_matters: true
    stem: >
      These two words have the same shape and the same number of
      syllables. Which syllable is stressed in each?
      rēgīna · fēmina
    options:
      a: "rē-GĪ-na and FĒ-mi-na"
      b: "RĒ-gī-na and FĒ-mi-na"
      c: "rē-GĪ-na and fē-MI-na"
      d: "RĒ-gī-na and fē-MI-na"
    answer: a
    touches: [MS-009, MS-008, MS-006, MS-005]
    what_went_wrong:
      - text: "I ignored the macrons"
        node: MS-006
      - text: "I stressed both words the same way"
        node: MS-009
      - text: "I divided the syllables wrong"
        node: MS-008
      - text: "I know the rule but couldn't tell if the middle syllable was long"
        node: MS-009
    note: >
      THIS IS THE MACRON ITEM. The two words are identical in
      shape and differ in stress for exactly one reason: the ī
      in rēgīna is long, the i in fēmina is short. Strip the
      macrons and the item cannot be answered — which is the
      argument for printing them at all.
      Do not generate stress items from words whose vowel
      lengths are unmarked in the vocabulary list.
    read_aloud_safe: false
    versions:
      v2:
        change: "No usable accommodation. A reader saying the words aloud gives away the stress, which is the answer. A student whose accommodation is read-aloud gets a different MS-010 item, not this one."
      v3:
        change: "Two options — the correct pattern and the one that ignores the macron."
        options:
          a: "rē-GĪ-na and FĒ-mi-na"
          b: "RĒ-gī-na and fē-MI-na"
        answer: a
    teaching: ""

