  - id: EX-PARSE-002
    node: MS-021
    assess: parse
    tier: 3
    format: choice
    paper_ok: false
    macron_matters: false
    stem: >
      Parse portās as it is used here:
      Nauta portās spectat.
    options:
      a: "accusative plural — the gates, object of the verb"
      b: "nominative plural — the gates, subject of the verb"
      c: "second person singular — you carry"
      d: "accusative singular — the gate, object of the verb"
    answer: a
    touches: [MS-020, MS-031, MS-034, MS-029, CR-003]
    what_went_wrong:
      - text: "I read it as a verb"
        node: MS-034
      - text: "I saw the -s and thought 'you'"
        node: MS-031
      - text: "I picked nominative because it came before the verb"
        node: MS-012
      - text: "I didn't notice the sentence already had a verb"
        node: CR-003
    note: >
      THIS IS THE SYNCRETIC ITEM. portās is both a noun form and
      a verb form. Nothing in the word decides it. Only spectat —
      already third person singular, already the verb of the
      sentence — rules out the verb reading.

      Two consequences. It cannot be generated from a word in
      isolation. And it is paper_ok: false, because the value is
      in the follow-up menu showing which piece of evidence the
      student ignored.

      Collisions like this only occur where a first declension
      noun shares a shape with a first conjugation verb.
      Enumerate the pairs by hand from the vocabulary list. Do
      not let a generator hunt for them.
    versions: {}
    teaching: ""

