      infinitive is what tells you. Why does it work?
    options:
      a: "Because the vowel before -re differs by conjugation and stays constant through the forms."
      b: "Because first conjugation verbs are always shorter."
      c: "Because the meaning of the verb determines its conjugation."
      d: "Because the first principal part already shows it."
    answer: a
    touches: [MS-032, MS-076, MS-033]
    what_went_wrong:
      - text: "I can spot the difference but didn't know why it predicts the rest"
        node: MS-036
      - text: "I thought the first principal part told you"
        node: MS-032
    note: >
      Choice d is the closest wrong answer and worth counting.
      For amō versus videō the first principal part does hint at
      it — but that stops working in Unit 2 when third and fourth
      conjugation arrive, which is why the infinitive is the
      reliable test. A student who picks d has a rule that works
      now and breaks in October.
    versions: {}
    teaching: ""

  - id: EX-EXPLAIN-011
    node: RW-013
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Romans of the Republic reacted badly to the word rex. Why?"
    options:
      a: "Because the Republic was founded by driving out a king, so kingship stood for what they had rejected."
      b: "Because rex was a foreign word Romans could not pronounce."
      c: "Because no Roman had ever been ruled by a king."
      d: "Because the word was reserved for the gods."
    answer: a
    touches: [RW-011, RW-012, RW-014]
    what_went_wrong:
      - text: "I didn't connect it to the expulsion of Tarquinius"
        node: RW-011
      - text: "I thought Rome had never had kings"
        node: RW-009
    versions: {}
    teaching: ""

  - id: EX-EXPLAIN-012
    node: MW-019
    assess: explain
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >
      Spanish, French, Italian, Portuguese and Romanian resemble
      one another closely. Why?
    options:
      a: "Because each one is a later form of the Latin spoken in that region."
      b: "Because they borrowed heavily from one another over time."
      c: "Because they all borrowed from Spanish, the largest of them."
      d: "Because they share a common ancestor that was not Latin."
    answer: a
    touches: [MW-017, MW-018]
    what_went_wrong:
      - text: "I thought they borrowed from each other"
        node: MW-019
      - text: "I know they come from Latin but not that each descended separately"
        node: MW-017
    note: >
      Choice b is the intuition most students arrive with, and
      the difference between borrowing and descent is the point
      of the node. Count it.
    versions: {}
    teaching: ""

  - id: EX-EXPLAIN-013
    node: MW-038
    assess: explain
    tier: 3
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >
      'Begin' and 'commence' mean the same thing, but 'commence'
      sounds more formal. Why?
    options:
      a: "Because it came into English through Latin and French, and that layer of the language is used in formal settings."
      b: "Because it is a longer word."
      c: "Because it is a newer word."
      d: "Because it is more precise in meaning."
    answer: a
    touches: [MW-037, MW-036]
    what_went_wrong:
      - text: "I thought it was just about word length"
        node: MW-038
      - text: "I didn't connect formality to where the word came from"
        node: MW-037
    versions: {}
    teaching: ""

