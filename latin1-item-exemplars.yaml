        node: MS-046
      - text: "I forgot nauta is masculine"
        node: MS-022
      - text: "I used the wrong case"
        node: MS-043
      - text: "I used the wrong number"
        node: MS-044
    note: >
      THIS IS THE CROSS-DECLENSION AGREEMENT ITEM. The trap is
      bona, which matches nauta letter for letter and is wrong.
      The four wrong-answer choices map exactly onto this node's
      four prerequisites in the spec, which is what makes the
      menu worth counting: "how many students this week said
      they matched the ending" is a real question with a real
      answer.

      Generate the twins with agricola and poēta. Never with a
      feminine first declension noun — the right answer and the
      trap become the same form.
    versions:
      v2:
        stem: "Choose the form of the adjective that agrees: nauta [sailor, masculine] ____ (good)"
        change: "Gloss added for nauta, including its gender. The gender is the thing being tested, so glossing it looks like giving the answer away — it is not. The item asks which adjective form agrees, and a student who knows nauta is masculine must still choose correctly among four masculine-looking options. What the gloss removes is the vocabulary gap, not the grammar."
      v3:
        change: "Two options. Keep the trap, drop the two distant ones."
        options:
          a: "bonus"
          b: "bona"
        answer: a
    teaching: ""

