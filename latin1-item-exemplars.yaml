open_issues:

  - id: ISSUE-01
    status: closed
    summary: >
      MS-157 requires dēbeō, which was missing from the Unit 1
      vocabulary in an older copy of the spec. Spec v2.0 has
      dēbeō on the week of Sep 21 with a note. No action.

  - id: ISSUE-02
    status: closed
    summary: >
      MS-076 and MS-156 had no day assigned in an older copy of
      the spec. Spec v2.0 places both on Sep 21 and MS-157 on
      Sep 23. No action.

  - id: ISSUE-03
    status: closed
    summary: >
      MS-051 teaches et, sed, -que and aut, but only et and sed
      were delivered. Both -que and aut are now on the week of
      Sep 28, bringing that list to 15 and staying inside the
      weekly range. EX-RECALL-010 and EX-TRANS-008 no longer
      depend on an undelivered word.

  - id: ISSUE-04
    status: closed
    summary: >
      Full sweep run over all 118 Unit 0–1 nodes, checking every
      Latin word named in a node label against the cumulative
      vocabulary as of that node's teaching week.

      Result: the grammar and reading strands are clean. MS-051
      was the only genuine miss and it is now fixed. MS-025
      (puer, ager) and MS-157 (dēbeō) both land in the same week
      their words arrive.

      The sweep did surface a structural point worth recording.
      Roman World and Modern World nodes carry roughly forty
      Latin words of their own — domus, ātrium, rēs pūblica,
      praenōmen, mare nostrum and the rest. None are on a core
      list and none are quizzed as vocabulary, but students must
      recognise them to answer those items. They are now listed
      separately as `content_vocabulary_units_0_1`. Items may
      use them freely and may never require a student to produce
      one from memory.

  - id: ISSUE-05
    status: open
    severity: check when roster data exists
    summary: >
      The v2 and v3 transformations in `rules` were written
      without accommodation data. They follow the standard
      distinction — accommodations change access, modifications
      change the bar — but they have not been checked against
      any actual IEP or 504 language. Expect at least one to
      need changing once the roster is known.

      One conflict has no workaround and should be known now.
      Items flagged macron_matters: true cannot be read aloud,
      because the distinction is visual. A reader saying rēgīna
      and fēmina aloud gives away the stress, which is the
      answer. Students whose accommodation is read-aloud need a
      different item on those nodes.
