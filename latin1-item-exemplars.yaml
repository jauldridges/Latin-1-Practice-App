    tag_boxes:
      - word: "Agricola"
        case: ["nominative", "nom"]
        job: ["subject"]
      - word: "dōnum"
        case: ["accusative", "acc"]
        job: ["direct object", "object", "d.o."]
      - word: "portat"
        case: ["verb"]
        job: ["verb", "third person singular", "3rd singular"]
    translation_model_answer: "The farmer carries the gift."
    translation_check: self-check
    touches: [MS-014, MS-015, MS-026, MS-028, MS-034, MS-037]
    what_went_wrong:
      - text: "I couldn't tell whether dōnum was the subject or the object"
        node: MS-028
      - text: "I labelled the cases but not the jobs"
        node: MS-013
      - text: "I translated first and worked backwards"
        node: CR-005
    note: >
      THIS IS THE SHAPE THAT REPLACES PLAIN TRANSLATION. The
      labels are checked box by box. The English is checked by
      the student. A finished translation hides how it was
      reached; the labels show whether the student read the
      endings or guessed from word order, which is the single
      thing worth knowing in the fall.

      One item yields several data points across several nodes
      but still reports to CR-005, the habit being taught.

      dōnum is only resolvable here because agricola is
      unambiguously nominative and portat is singular. Every
      sentence used for this shape needs that check.
    versions: {}
    teaching: ""

