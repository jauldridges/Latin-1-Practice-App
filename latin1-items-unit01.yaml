      written: "1-2 distinct items each (a parse, a produce, or a recognize)."
      reason: >
        These eight nodes are the eight cells of the first- and
        second-declension noun tables. Generating 8-12 parse/produce
        items each would teach that parsing means reciting a
        paradigm. The distinct shapes that exist are: a clean parse, a
