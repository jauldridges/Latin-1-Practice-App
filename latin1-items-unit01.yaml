# ============================================================
# CONNECTED READING (CR-001 – CR-010)
# Strategy nodes. Several are performance skills (reading aloud,
# using a glossary) that no mechanical check captures fully; those
# use self-check or an apply-choice about the strategy itself.
# ============================================================

# ---------- CR-001 — read aloud with correct pronunciation and stress ----------

  - id: CR001-APPLY-01
    node: CR-001
    assess: apply
    tier: 2
    format: self-check
    paper_ok: false
    macron_matters: true
    stem: >
      Read this line aloud, then check yourself against the recording.
      Fēmina in silvā aquam portat.
    model_answer: >
      FĒ-mi-na in SIL-vā A-quam POR-tat. Stress the antepenult of
      fēmina (short penult) and the first syllable of the two-syllable
      words. Consonantal v in silvā is 'w'.
    self_report: ["I read it cleanly", "I stumbled on a word or two", "I couldn't read it aloud yet"]
    touches: [MS-010, MS-003, MS-002]
    what_went_wrong:
      - text: "I stressed fēmina on the wrong syllable"
        node: MS-010
      - text: "I gave v its English sound"
        node: MS-003
    note: >
      in is a glossed preposition ('in') supplied so the line reads as
      real Latin; it is Unit 3 grammar and is not being tested here.
      Read-aloud is the point, so this item cannot be scored
      mechanically and is paper_ok:false.
    needs_review: true
    reviewer_question: "Is it acceptable to include the preposition 'in' as supplied glue this early, or should the reading line avoid Unit 3 words entirely?"
    versions:
      v2: {change: "No usable v2 in the read-aloud sense — but a student with a read-aloud accommodation IS the reader here, so provide the marked pronunciation and let them self-report. Macrons printed."}
      v3: {change: "Shorten to a two-word line (Fēmina portat) and mark the stress above it."}
    teaching: ""

  - id: CR001-APPLY-02
    node: CR-001
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: true
    stem: "You are reading agricola aloud. Which syllable takes the stress?"
    options:
      a: "a-GRI-co-la"
      b: "AG-ri-co-la"
      c: "ag-ri-CO-la"
      d: "ag-ri-co-LA"
    answer: a
    touches: [MS-010, MS-008]
    what_went_wrong:
      - text: "I didn't apply the penult rule"
        node: MS-010
      - text: "I divided the syllables wrong"
        node: MS-008
    note: >
      Penult -co- is short, so the stress falls back to the
      antepenult -gri-. A read-aloud accommodation gives the answer
      away, so a read-aloud student needs a different CR-001 item.
    read_aloud_safe: false
    versions:
      v2: {change: "No usable v2 — reading it aloud gives the stress. Marks printed."}
      v3:
        change: "Two options — the correct stress and the penult-stress error."
        options: {a: "a-GRI-co-la", b: "ag-ri-CO-la"}
        answer: a
    teaching: ""

