# ---------- MS-011 — inflection carries function ----------

  - id: MS011-EXPLAIN-01
    node: MS-011
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >
      Nauta puellam spectat and Puellam nauta spectat mean the same
      thing. Why?
    options:
