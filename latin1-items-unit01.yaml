# ---------- MS-001 — alphabet, letter inventory ----------

  - id: MS001-RECALL-01
    node: MS-001
    assess: recall
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "Classical Latin lacks two letters that English uses. Write one in each box."
    order_matters: false
    boxes:
      - label: "Letter"
        answer: ["j"]
      - label: "Letter"
        answer: ["w"]
    touches: []
    what_went_wrong: []
    versions:
      v2: {change: "Placeholder text 'a letter' in each box. No other change."}
      v3: {change: "Word bank added above the boxes: j, w, k, y."}
    teaching: ""

  - id: MS001-RECALL-02
    node: MS-001
    assess: recall
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "How many letters are in the classical Latin alphabet?"
    boxes:
      - label: "Number"
        answer: ["23", "twenty-three", "twenty three"]
    touches: []
    what_went_wrong:
      - text: "I counted 26 as in English"
        node: MS-001
    versions:
      v2: {change: "Placeholder text 'a number' in the box."}
      v3: {change: "Becomes a two-option choice: 23 or 26."}
    teaching: ""

  - id: MS001-RECOG-01
    node: MS-001
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which of these letters is NOT part of the classical Latin alphabet?"
    options:
      a: "w"
      b: "p"
      c: "t"
      d: "m"
    answer: a
    touches: []
    what_went_wrong:
      - text: "I picked a letter Latin does use"
        node: MS-001
    versions:
      v2: {change: "One letter per line, larger type; question wrapper simplified."}
      v3:
        change: "Two options, keeping the correct answer and one common letter."
        options: {a: "w", b: "m"}
        answer: a
    teaching: ""

