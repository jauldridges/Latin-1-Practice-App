  spec_or_exemplar_observations:
    - topic: "versions field convention"
      note: >
        The generation brief says to generate v2 and v3 for every
        item, and check 8 requires a version or a stated reason for
        each. But the exemplar file leaves versions:{} empty on all
        but four items. Resolved here by giving every item a concise
        versions block naming the transformation, and writing out full
        content only where a transform needs it (produce->choice,
        multi-box cuts, the no-usable-v2 macron cases). Worth a
        decision on whether the exemplars should be backfilled to
        match, or whether empty-versions is the intended default with
        transforms applied at render time.
    - topic: "core word count (78 vs 80)"
      note: >
        The brief says 'Units 0 and 1 deliver 80 core words'; the
        exemplar rules say 78 (80 with the two conjunctions from
        ISSUE-03). ISSUE-03 is closed and adds -que and aut, so the
        list is 80. No conflict in practice, just two phrasings.
    - topic: "content vocabulary vs. recall production"
      note: >
        The content-vocab rule ('may use, may not require producing
        from memory') is in tension with EX-RECALL-010, which asks
        students to produce Senātus, Populusque, Rōmānus (all content
        vocab) from memory for SPQR. RW017 here follows that exemplar;
        RW051-RECALL-01 applies the same shape to praenomen/nomen/
        cognomen and is flagged. A one-line ruling on whether
        acronym/naming-system expansions are exempt would settle both.
    - topic: "adjective examples precede the adjective-forms node"
      note: >
        MS-041 (predicate nominative, Sep 22) naturally uses an
        adjective (clārus) as the predicate, but the adjective forms
        node MS-042 is taught Sep 24. Predicate-nominative items
        therefore use adjectives two days before the forms are
        formally taught. The exemplars do the same (EX-RECOG-008,
        EX-TRANS-004). Not a blocker, but a sequencing wrinkle: a
        predicate noun (e.g. 'Poēta est nauta') avoids it if desired.
    - topic: "MS-028 timing and sum"
      note: >
        See MS028-EXPLAIN-01 above. The cleanest neuter subject/object
        contrast wants a linking verb, which is sum, delivered Sep 21;
        MS-028 is Sep 15. The exemplar has the same dependency.
    - topic: "scope window edge (Oct 5 module nodes)"
      note: >
        RW-064/065/066 and MW-063/068/069 sit in the week of Oct 5
        (some day:null modules), inside the Aug 21-Oct 8 window, so
        they are in scope and included. If the intended cut is the end
        of the Unit 1 grammar sequence rather than the calendar date,
        these six could move to a later pass.

