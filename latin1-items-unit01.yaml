# ---------- MS-009 — syllable weight ----------

  - id: MS009-RECOG-01
    node: MS-009
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: true
    stem: "In puella, the middle syllable -el- is long. Which statement is true of it?"
    options:
      a: "It is long by position, because two consonants follow the vowel."
      b: "It is long by nature, because the vowel itself is long."
      c: "It is long because it carries the stress."
      d: "It is long because the word has three syllables."
    answer: a
    touches: [MS-005, MS-008]
    what_went_wrong:
      - text: "I thought a long syllable always means a long vowel"
        node: MS-009
      - text: "I confused syllable length with stress"
        node: MS-010
      - text: "I divided the syllables wrong"
        node: MS-008
    versions:
      v2: {change: "Macrons printed; one statement per line; wrapper simplified."}
      v3:
        change: "Two options — long by position and long by nature."
        options: {a: "long by position — two consonants follow the vowel", b: "long by nature — the vowel itself is long"}
        answer: a
    teaching: ""

  - id: MS009-EXPLAIN-01
    node: MS-009
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >
      A syllable can be long even when its vowel is short. How is
      that possible?
    options:
      a: "Two consonants after a short vowel make the syllable long by position."
      b: "A short vowel becomes long whenever it is stressed."
      c: "The last syllable of a word is always long."
      d: "It is not possible; a long syllable always has a long vowel."
    answer: a
    touches: [MS-005, MS-008]
    what_went_wrong:
      - text: "I thought only a long vowel makes a long syllable"
        node: MS-009
      - text: "I confused length with stress"
        node: MS-010
    versions:
      v2: {change: "One statement per line; wrapper simplified."}
      v3:
        change: "Two options — the by-position answer and the always-long-vowel belief."
        options: {a: "Two consonants after a short vowel make it long by position.", b: "A long syllable always has a long vowel."}
        answer: a
    teaching: ""

# ---------- MS-010 — stress accent, the penult rule ----------

  - id: MS010-APPLY-01
    node: MS-010
    assess: apply
    tier: 3
    format: choice
    paper_ok: true
    macron_matters: true
    stem: >
      These two words have the same shape and the same number of
      syllables, but are stressed differently. Which syllable is
      stressed in each? (The macrons decide it.)
      rēgīna · fēmina
    options:
      a: "rē-GĪ-na and FĒ-mi-na"
      b: "RĒ-gī-na and FĒ-mi-na"
      c: "rē-GĪ-na and fē-MI-na"
      d: "RĒ-gī-na and fē-MI-na"
    answer: a
    touches: [MS-009, MS-008, MS-006, MS-005]
    what_went_wrong:
      - text: "I ignored the macrons"
        node: MS-006
      - text: "I stressed both words the same way"
        node: MS-009
      - text: "I divided the syllables wrong"
        node: MS-008
      - text: "I know the rule but couldn't tell if the middle syllable was long"
        node: MS-009
    note: >
      The penult of rēgīna is long by nature (ī), so it takes the
      stress; the penult of fēmina is short, so the stress moves back
      to the antepenult. Strip the macrons and the item cannot be
      answered — which is why they are printed.
    read_aloud_safe: false
    versions:
      v2: {change: "No usable v2 — a reader saying the words aloud gives away the stress, which is the answer. A read-aloud student gets a different MS-010 item."}
      v3:
        change: "Two options — the correct pattern and the one that ignores the macron."
        options: {a: "rē-GĪ-na and FĒ-mi-na", b: "RĒ-gī-na and fē-MI-na"}
        answer: a
    teaching: ""

  - id: MS010-EXPLAIN-01
    node: MS-010
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >
      In a Latin word of three or more syllables, the stress falls
      on the second-to-last syllable only sometimes. What decides it?
    options:
      a: "Whether the second-to-last syllable is long; if it is short, the stress moves back one."
      b: "Whether the word is a noun or a verb."
      c: "The first syllable is always stressed in longer words."
      d: "The last syllable is always stressed."
    answer: a
    touches: [MS-009, MS-008]
    what_went_wrong:
      - text: "I thought the stress was always on the same syllable"
        node: MS-010
      - text: "I know the rule but couldn't say what 'long' means here"
        node: MS-009
    versions:
      v2: {change: "Terms 'second-to-last (penult)' spelled out; one option per line."}
      v3:
        change: "Two options — the penult-weight rule and a fixed-position rule."
        options: {a: "Whether the penult is long; if short, stress moves back one.", b: "The last syllable is always stressed."}
        answer: a
    teaching: ""

