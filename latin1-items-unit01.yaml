# ============================================================
# Latin I — Generated Item Bank, Units 0 and 1
# Libertas Academy Charter School · FY27 · J. Sullivan
# Generated pass · covers nodes taught Aug 21 – Oct 8, 2026
#
# COMPANION TO latin1-spec.yaml v2.0 and
# latin1-item-exemplars.yaml (draft v2). Read both first.
#
# WHAT THIS IS
# A shippable draft item bank for every Unit 0 and Unit 1 node,
# built to the patterns in the exemplar file. Grouped by node in
# spec order so review can proceed one concept at a time.
#
# HOW VERSIONS ARE RECORDED
# v2 and v3 are not separate items. Each item carries a `versions`
# block naming the transformation to apply per
# rules.accommodated_versions. Where a transformation needs real
# content (produce->choice for v3, multi-box cuts, the
# no-usable-v2 case for macron_matters items) the content is
# written out. Otherwise the mechanical change is named.
#
# WHERE FEWER ITEMS WERE WRITTEN
# Many nodes are single cells of the same two noun/verb tables, or
# single facts. Padding them to 8-12 would teach that parsing means
# reciting a paradigm. Thin nodes carry the distinct shapes that
# exist and stop. Every such stop is logged in the review section
# at the end of this file.
# ============================================================

meta:
  course: Latin I
  scope: Units 0 and 1 only (Aug 21 – Oct 8, 2026)
  spec_version: 2.0
  built_against_exemplars: latin1-item-exemplars.yaml (draft v2)
  generated: 2026-08-29
  status: >
    Draft for review. Teaching text left blank on every node — it is
    written and approved separately. Items flagged needs_review are
    collected at the end of the file.
  id_scheme: >
    <NODE-COMPACT>-<TYPE>-<nn>, e.g. MS018-PARSE-01. Type codes:
    RECALL, RECOG, PRODUCE, PARSE, TRANS, APPLY, EXPLAIN.

