# ---------- MS-006 — macrons, notation and what they mark ----------

  - id: MS006-EXPLAIN-01
    node: MS-006
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: true
    stem: >
      liber means 'book' and līber means 'free'. The macron is the
      only difference in writing. What is the macron telling you?
    options:
      a: "That the vowel is held longer, which here makes it a different word."
      b: "That the syllable carries the stress."
      c: "That the vowel has a different quality, like a different letter."
      d: "That the word was borrowed from Greek."
    answer: a
    touches: [MS-005, MS-009]
    what_went_wrong:
      - text: "I thought the macron marked stress"
        node: MS-010
      - text: "I thought it changed the vowel's quality, not its length"
        node: MS-005
    note: >
      liber ('book') is outside the core list and glossed, which the
      vocabulary rule permits. No minimal pair inside the core list
      shows this as cleanly. (līber 'free' is on the core list.)
    versions:
      v2: {change: "No usable v2 — read_aloud gives away the length distinction. Macrons printed."}
      v3:
        change: "Two options — the length answer and the stress answer."
        options: {a: "The vowel is held longer, making it a different word.", b: "The syllable carries the stress."}
        answer: a
    read_aloud_safe: false
    teaching: ""

  - id: MS006-RECOG-01
    node: MS-006
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: true
    stem: "A macron is written how? (The mark itself is the point.)"
    options:
      a: "a straight bar over a vowel: ā"
      b: "a dot under a vowel: ạ"
      c: "an accent mark: á"
      d: "two dots over a vowel: ä"
    answer: a
    touches: [MS-005]
    what_went_wrong:
      - text: "I confused the macron with an accent mark"
        node: MS-006
    versions:
      v2: {change: "No usable v2 — the mark is visual. Marks printed large."}
      v3:
        change: "Two options — the bar and the accent."
        options: {a: "a straight bar over a vowel: ā", b: "an accent mark: á"}
        answer: a
    read_aloud_safe: false
    teaching: ""

# ---------- MS-007 — diphthongs ----------

  - id: MS007-RECOG-01
    node: MS-007
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which of these words contains a diphthong?"
    options:
      a: "nauta"
      b: "poēta"
      c: "patria"
      d: "silva"
    answer: a
    touches: [MS-005, MS-008]
    what_went_wrong:
      - text: "I picked poēta because I saw two vowels next to each other"
        node: MS-007
      - text: "I thought any two vowels in a row make a diphthong"
        node: MS-005
    note: >
      nauta has the diphthong au. poēta is the trap: o and e are
      adjacent but belong to separate syllables (po-ē-ta).
    versions:
      v2: {change: "One word per line; question wrapper simplified."}
      v3:
        change: "Two options — the diphthong word and the split-vowel trap."
        options: {a: "nauta", b: "poēta"}
        answer: a
    teaching: ""

  - id: MS007-RECOG-02
    node: MS-007
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Which pair of letters is a Latin diphthong?"
    options:
      a: "au"
      b: "ia"
      c: "ea"
      d: "io"
    answer: a
    touches: [MS-005]
    what_went_wrong:
      - text: "I picked two vowels that do not form a diphthong"
        node: MS-007
    note: >
      The six Latin diphthongs are ae, oe, au, ei, eu, ui. The wrong
