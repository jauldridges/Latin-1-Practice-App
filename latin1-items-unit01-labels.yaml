    is puer and dōna must be the object.
  teaching: ""

- id: MS028-LABEL-01
  node: MS-028
  assess: parse
  tier: 3
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
    - {latin: "Dōna", answer: "accusative · direct object"}
    - {latin: "puerī", answer: "nominative · subject"}
    - {latin: "portant.", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "vocative · direct address", "verb"]
  translation_model_answer: "The boys carry the gifts."
  touches: [MS-012, MS-024, MS-029, CR-007]
  what_went_wrong:
    - {text: "I made Dōna the subject because it came first", node: MS-012}
    - {text: "I forgot that a neuter plural can be accusative", node: MS-028}
    - {text: "I didn't notice that puerī can't be the object", node: MS-024}
  note: >
    Both nouns are plural and the verb is plural, so the verb can't decide.
    What decides is that puerī cannot be accusative (that would be puerōs),
    so puerī is the subject and dōna -- either case on its own -- is the
    object. Tier 3: the reasoning runs through what a form can't be.
  teaching: ""

- id: MS049-LABEL-01
  node: MS-049
  assess: parse
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
