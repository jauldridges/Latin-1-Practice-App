  touches: [MS-023, MS-037]
  what_went_wrong:
    - {text: "I read servōs as singular", node: MS-024}
    - {text: "I mixed up calls and call", node: MS-037}
  note: >
    Number, not case: English shows singular and plural, so that is what the
    English labels can test before genitive arrives.
  teaching: ""

