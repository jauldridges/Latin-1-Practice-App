    - {latin: "fīlium", answer: "the son"}
    - {latin: "amīcī", answer: "of the friend"}
    - {latin: "videt.", answer: "sees"}
  bank: ["the master", "of the master", "the son", "the sons", "the friend", "of the friend", "the friends", "sees", "see"]
  touches: [MS-052, MS-023, MS-024]
  what_went_wrong:
    - {text: "I read amīcī as 'the friends'", node: MS-054}
    - {text: "I didn't know what the genitive does", node: MS-052}
  note: >
    amīcī could be nominative plural, but videt is singular and Dominus is its
    subject, so amīcī says whose son.
  teaching: ""

- id: MS053-LABEL-01
  node: MS-053
  assess: translate
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Put the English on each word, as it works in this sentence."
  sentence:
    - {latin: "Nauta", answer: "the sailor"}
    - {latin: "viam", answer: "the road"}
    - {latin: "fēminārum", answer: "of the women"}
    - {latin: "spectat.", answer: "watches"}
  bank: ["the sailor", "of the sailor", "the road", "the woman", "of the woman", "the women", "of the women", "watches", "watch"]
  touches: [MS-052, MS-018, MS-019]
  what_went_wrong:
    - {text: "I read fēminārum as singular", node: MS-053}
    - {text: "I didn't recognize -ārum as genitive", node: MS-053}
  note: >
    -ārum is only ever genitive plural, so this one tests recognizing the
    ending rather than resolving an ambiguity. "of the woman" is the
    distractor for a student who knows the case but not the number.
  teaching: ""
