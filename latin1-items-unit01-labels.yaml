- id: MS052-LABEL-01
  node: MS-052
  assess: parse
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
    - {latin: "Fīlia", answer: "nominative · subject"}
    - {latin: "agricolae", answer: "genitive · possession"}
    - {latin: "aquam", answer: "accusative · direct object"}
    - {latin: "portat.", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "genitive · possession", "vocative · direct address", "verb"]
  translation_model_answer: "The farmer's daughter carries water."
  touches: [MS-053, MS-056, MS-014, MS-015]
  what_went_wrong:
    - {text: "I made agricolae a subject because it looks plural", node: MS-056}
    - {text: "I didn't know what the genitive does", node: MS-052}
    - {text: "I knew it was genitive but translated it without 'of' or 's", node: MS-052}
  note: >
    agricolae could be nominative plural, but portat is singular and fīlia is
    already its subject, so agricolae is the farmer the daughter belongs to.
  teaching: ""

- id: MS052-LABEL-02
  node: MS-052
  assess: parse
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
    - {latin: "Servī", answer: "nominative · subject"}
    - {latin: "dominī", answer: "genitive · possession"}
    - {latin: "agrum", answer: "accusative · direct object"}
    - {latin: "spectant.", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "genitive · possession", "vocative · direct address", "verb"]
  translation_model_answer: "The master's slaves look at the field."
  touches: [MS-054, MS-024, MS-037]
  what_went_wrong:
    - {text: "I made dominī a second subject", node: MS-054}
    - {text: "I couldn't tell servī and dominī apart because they end the same way", node: MS-054}
  note: >
    servī and dominī have the same ending. Either could be the subject of
    spectant; the one beside the other and doing no action is the owner.
    Placing dominī after the noun it belongs to is the usual order.
  teaching: ""

- id: MS056-LABEL-01
  node: MS-056
  assess: translate
  tier: 3
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Put the English on each word, as it works in this sentence."
  sentence:
    - {latin: "Fīliae", answer: "the daughters"}
    - {latin: "nautae", answer: "of the sailor"}
    - {latin: "aquam", answer: "water"}
    - {latin: "portant.", answer: "carry"}
  bank: ["the daughter", "the daughters", "of the daughter", "the sailor", "the sailors", "of the sailor", "water", "carries", "carry"]
  touches: [MS-052, MS-053, MS-029, CR-007]
  what_went_wrong:
    - {text: "I read nautae as 'the sailors'", node: MS-056}
    - {text: "I read fīliae as 'of the daughter'", node: MS-056}
    - {text: "I mixed up carries and carry", node: MS-037}
  note: >
    Both nouns end in -ae, and -ae is genitive singular or nominative plural.
    portant needs a plural subject, so one of them is "the ___s"; with no et
    joining them, the other belongs to it. Fīliae comes first and the sailor
    is the owner, the usual order. A student could argue for "the daughters,
    the sailors" -- the menu's contest option exists for that.
  teaching: ""

- id: MS054-LABEL-01
  node: MS-054
  assess: translate
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
