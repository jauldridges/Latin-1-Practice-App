- id: CR005-LABEL-04
  node: CR-005
  assess: parse
  tier: 2
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
    - {latin: "Puer", answer: "nominative · subject"}
    - {latin: "dōna", answer: "accusative · direct object"}
    - {latin: "videt.", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "vocative · direct address", "verb"]
  translation_model_answer: "The boy sees the gifts."
  touches: [MS-025, MS-027, MS-028, MS-035]
  what_went_wrong:
