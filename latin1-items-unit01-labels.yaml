    - {latin: "aquam", answer: "accusative · direct object"}
    - {latin: "portā!", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "vocative · direct address", "verb"]
  translation_model_answer: "Slave, carry the water!"
  touches: [MS-050, MS-015]
  what_went_wrong:
    - {text: "I labeled Serve as the subject", node: MS-049}
    - {text: "I didn't recognize portā as a command", node: MS-050}
  note: >
    The -e ending of a second-declension -us noun marks the vocative, and the
    command has no subject of its own.
  teaching: ""

- id: MS049-LABEL-02
  node: MS-049
  assess: parse
  tier: 3
  format: label-words
  paper_ok: false
  macron_matters: false
  stem: "Label each word with its case and its job. Then write the English."
  sentence:
    - {latin: "Puella,", answer: "vocative · direct address"}
    - {latin: "nauta", answer: "nominative · subject"}
    - {latin: "aquam", answer: "accusative · direct object"}
    - {latin: "portat.", answer: "verb"}
  bank: ["nominative · subject", "nominative · predicate", "accusative · direct object", "vocative · direct address", "verb"]
  translation_model_answer: "Girl, the sailor is carrying the water."
  touches: [MS-014, MS-037]
  what_went_wrong:
    - {text: "Puella looks nominative, so I made it the subject", node: MS-049}
    - {text: "I gave the sentence two subjects and didn't notice", node: MS-037}
  note: >
    In the first declension the vocative looks exactly like the nominative.
    The comma, and the fact that nauta is already the subject of a singular
    verb, are what make Puella someone being spoken to.
  teaching: ""

- id: MS041-LABEL-02
  node: MS-041
