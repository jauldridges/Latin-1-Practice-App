# Label-the-words questions: tap a label from the bank, tap the box above its
# word (format: label-words; see practice.py). Two kinds:
#
#   - case and job: "accusative · direct object", "verb". The teacher's rule:
#     a verb is just "verb" unless the question is about the verb's form.
#   - the English for each word as it works in this sentence ("the girls",
#     "of the sailor") -- how a case is translated, decided by context.
#
# Labels are reusable and every bank holds at least one label the sentence
# doesn't use, so nothing can be finished by elimination (checks.py, check 9).
#
# The first six REPLACE the typed "label each word" questions. Each names the
# question it replaces; the old one keeps its history and stops being served
# the moment the new one is approved (store.approved_items).
#
# Banks only offer cases taught by the question's week. Genitive arrives on
# 12 Oct, so the MS-052 / MS-054 / MS-056 questions use the bigger bank and
# stay unserved until then.

items:

