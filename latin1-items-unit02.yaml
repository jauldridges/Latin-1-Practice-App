    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      Nauta poētae crēdit [trusts]. In English "trusts" takes a direct object —
      you trust someone. What case is poētae, and why is that surprising?
    options:
      a: "Dative — crēdō takes a dative where English takes a direct object."
      b: "Accusative — it is the direct object, exactly as in English."
      c: "Genitive — it shows whose trust it is."
      d: "Nominative — it is a second subject."
    answer: a
    touches: [MS-057, MS-015]
    what_went_wrong:
      - text: "I assumed it matched the English"
        node: MS-060
      - text: "I read it as the direct object"
        node: MS-015
    note: >
      The whole node is that a small set of verbs — crēdō, noceō, pāreō,
      persuādeō — do not map onto English objects. Option b is what every
      student thinks first, and saying so plainly is more useful than hiding it
      among weaker distractors.
    versions:
      v2: {change: "Gloss kept; the English sentence printed alongside."}
      v3:
        change: "Two options — dative and accusative."
        options: {a: "Dative", b: "Accusative"}
        answer: a
    teaching: ''

