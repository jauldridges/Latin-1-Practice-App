# ==========================================================================
# The third declension — MS-062 to MS-071 (weeks of 2 and 9 November)
#
# The place first-year Latin usually comes apart. Two ideas do most of the
# damage: the nominative singular does not show you the stem, and gender is not
# visible in the ending. Both are facts to be accepted rather than rules to be
# derived, so several of these items are explicitly about accepting them.
# ==========================================================================

  - id: MS062-PRODUCE-01
    node: MS-062
    assess: produce
    tier: 1
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "The dictionary entry is rēx, rēgis, m. [king]. Write the stem."
    boxes:
      - label: Stem
        answer: ["reg", "rēg"]
    touches: [MS-017, MS-016]
    what_went_wrong:
      - text: "I used the nominative and wrote rex-"
        node: MS-062
      - text: "I left the -is on"
        node: MS-062
    note: >
      The whole node in one question. Take the genitive rēgis, remove -is, and
      the stem is rēg- — which the nominative rēx does not show you. A student
      who answers 'rex' has used the form that hides the stem.
    versions:
      v2: {change: "Placeholder 'the stem'; the genitive labelled in the entry."}
      v3:
        change: "Four-option choice from the answer plus wrong forms."
        format: choice
        options: {a: "rēg", b: "rēx", c: "rēgis", d: "rē"}
        answer: a
    teaching: ''

  - id: MS062-EXPLAIN-01
    node: MS-062
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      In the first declension you could find the stem from the nominative:
      puella gives puell-. In the third you cannot — rēx [king] gives rēg-, not
      rēx-. Why does the third declension need the genitive to be printed?
    options:
      a: "Because sound changes reshaped the nominative, so it no longer shows the stem the other cases are built on."
      b: "Because third declension nouns have no stem."
      c: "Because the genitive is the most frequently used case."
      d: "Because the nominative is optional in the third declension."
    answer: a
    touches: [MS-017, MS-016]
    what_went_wrong:
      - text: "I use the genitive but never knew why it was needed here"
        node: MS-062
      - text: "I thought the nominative would work if I looked harder"
        node: MS-062
    note: >
      An explain item, so the fact is in the stem and the options compete on
      the reason. The honest answer is historical — rēx is rēg-s with the two
      sounds collapsed — and a student does not need the phonology, only to
      stop expecting the nominative to cooperate.
    versions:
      v2: {change: "The two entries printed one above the other; one option per line."}
      v3:
        change: "Two options — the sound-change answer and the no-stem answer."
        options:
          a: "The nominative was reshaped and no longer shows the stem."
          b: "Third declension nouns have no stem."
        answer: a
    teaching: ''

  - id: MS062-PRODUCE-02
    node: MS-062
    assess: produce
    tier: 2
    format: boxes
    paper_ok: true
    macron_matters: false
    stem: "The dictionary entry is corpus, corporis, n. [body]. Write the stem."
    boxes:
