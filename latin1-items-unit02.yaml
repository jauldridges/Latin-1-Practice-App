  - id: MS060-TRANS-01
    node: MS-060
    assess: translate
    tier: 3
    format: self-check
    paper_ok: true
    macron_matters: false
    stem: "Write the English, then check yourself: Puella nautīs nōn crēdit [trusts]."
    model_answer: "The girl does not trust the sailors. (Not 'the sailors do not trust the girl' — nautīs is dative, not nominative.)"
    self_report:
      - I had it
      - I had it backwards
      - I didn't have it
    touches: [MS-057, MS-058]
    what_went_wrong:
      - text: "I made the sailors the ones trusting"
        node: MS-060
      - text: "I translated it as 'trusts to the sailors'"
        node: MS-060
    note: >
      The dative here becomes an ordinary English direct object, which is the
      reverse of the usual instruction to translate a dative with 'to'. A
      student who writes 'trusts to the sailors' has applied the rule
      mechanically, so that reading is named in the menu rather than left to be
      guessed at.
    versions:
      v2: {change: "Glosses under each word; model answer shown after."}
      v3:
        change: "Two-option choice — the right reading and the reversed one."
        format: choice
        options:
          a: "The girl does not trust the sailors."
          b: "The sailors do not trust the girl."
        answer: a
    teaching: ''

  - id: MS061-RECOG-01
    node: MS-061
    assess: recognize
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      Nautae est fīlia [daughter] means "the sailor has a daughter" — literally
      "to/for the sailor there is a daughter". What is nautae doing?
    options:
      a: "It is dative, naming the person the daughter belongs to; sum supplies the 'has'."
      b: "It is genitive, showing possession in the ordinary way."
      c: "It is nominative plural, so the sailors are the subject."
      d: "It is dative, but it means the daughter was given to the sailor."
    answer: a
    touches: [MS-057, MS-040, MS-052]
    what_went_wrong:
      - text: "I read it as an ordinary genitive of possession"
        node: MS-052
      - text: "I read nautae as a plural subject"
        node: MS-056
      - text: "I couldn't see where the 'has' came from"
        node: MS-061
    note: >
      nautae is dative here and could be genitive or nominative plural
      elsewhere — every wrong option is one of those real readings, so the item
      is a genuine three-way discrimination rather than a definition.
    versions:
      v2: {change: "The literal translation printed under the Latin; one option per line."}
      v3:
        change: "Two options — the dative-of-possession reading and the genitive one."
        options:
          a: "Dative — the person the daughter belongs to."
          b: "Genitive — ordinary possession."
        answer: a
    teaching: ''

