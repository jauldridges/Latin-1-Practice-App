  - id: MS063-EXPLAIN-01
    node: MS-063
    assess: explain
    tier: 2
    format: choice
    paper_ok: true
    macron_matters: false
    stem: >-
      Third declension nominative singulars look nothing alike — rēx [king],
      corpus [body], pater [father], vōx [voice]. You cannot predict one. What
      follows for how you learn these nouns?
    options:
      a: "You learn the nominative and genitive together as a pair, because neither predicts the other."
      b: "You learn the nominative and work the genitive out from it."
      c: "You learn the genitive only, since the nominative is rarely used."
      d: "You group them by their last letter and learn one pattern for each group."
    answer: a
    touches: [MS-062, MS-016]
    what_went_wrong:
      - text: "I thought I could predict the genitive from the nominative"
        node: MS-063
      - text: "I thought the nominative could be skipped"
        node: MS-063
    note: >
      Option d is the trap that costs students weeks: -x nouns do often go to
      -g- or -c-, so the pattern half works and then fails, and the failures
      are invisible until a translation goes wrong.
    versions:
      v2: {change: "The four nominatives listed one per line; one option per line."}
      v3:
        change: "Two options — learn the pair, and predict from the nominative."
        options:
          a: "Learn nominative and genitive together as a pair."
          b: "Learn the nominative and work out the genitive."
        answer: a
    teaching: ''

