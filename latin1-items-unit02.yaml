      Harder than rēx because the nominative and the stem differ in the middle
      of the word, not just at the end: corpus against corpor-. A student who
      has learned 'chop off -is' succeeds here; one who has learned 'the
      nominative is nearly right' does not.
    versions:
      v2: {change: "Placeholder 'the stem'; the genitive labelled."}
      v3:
        change: "Four-option choice from the answer plus wrong forms."
        format: choice
        options: {a: "corpor", b: "corpus", c: "corp", d: "corporis"}
        answer: a
    teaching: ''

