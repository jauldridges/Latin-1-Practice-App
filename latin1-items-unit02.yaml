  - id: MS059-EXPLAIN-01
    node: MS-059
    assess: explain
    tier: 3
    format: choice
    paper_ok: true
    macron_matters: true
    stem: >-
      The dative plural is "-īs" in both the first and the second declension,
      but the dative singular is "-ae" in the first and "-ō" in the second. Why
      would the plural fall together and the singular not?
    options:
      a: "The plural endings lost their stem vowel over time, so the two declensions ended up saying the same thing."
      b: "The plural is rarer, so Latin bothered to keep it distinct."
      c: "The singular is irregular in both declensions."
      d: "There is no reason; the two are unrelated coincidences."
    answer: a
    touches: [MS-058, MS-054]
    what_went_wrong:
      - text: "I know both endings but never wondered why they matched"
        node: MS-059
      - text: "I thought the singulars were the irregular ones"
        node: MS-059
    note: >
      Tier 3, and honestly a stretch for a first-year — but it is the item that
      turns two memorised endings into one observation, and the alternative is
      a student who thinks -īs is a coincidence. Option d is the answer a
      student gives who has never been invited to ask.
    versions:
      v2: {change: "The four endings printed in a small table; one option per line."}
      v3:
        change: "Two options — the shared-history answer and the coincidence answer."
        options:
          a: "The plural endings fell together as the stem vowel was lost."
          b: "It is a coincidence."
        answer: a
    teaching: ''

  - id: MS060-RECOG-01
