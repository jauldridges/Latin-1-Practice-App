# Render reads this when you point it at the repo. The only things left to type
# by hand are the two secrets marked `sync: false` — everything else, including
# the database and its connection string, is wired up here.
#
# Plans are the ones that were approved: $7 web + $6 Postgres. Do NOT switch the
# web service to a Free plan; free services sleep and take about thirty seconds
# to wake, which is unusable when a class opens the app at once.
#
# Why one worker and eight threads: this app is IO-bound (a database round trip
# per page, and a PBKDF2 hash on sign-in). Threads share the 512 MB; a second
# worker would double the memory for no extra throughput on half a CPU.
databases:
  - name: latin1-db
    plan: basic-256mb            # 0.1 CPU / 256 MB / 1 GB storage — $6/mo
    databaseName: latin1
    user: latin

services:
  - type: web
    # The URL comes from this name: magisters-practice-app.onrender.com. That is
    # the address given to IT for the content filter, so it does not change
    # casually — a filter allowing a stale domain fails silently, which is the
    # worst way for this to fail.
    name: magisters-practice-app
    runtime: python
    plan: starter                # 0.5 CPU / 512 MB — $7/mo
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /healthz    # touches the database, not just Flask
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: latin1-db
          property: connectionString
      - key: LATIN_PUBLIC
        value: "1"               # HTTPS-only cookies + refuses to start with no password
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true      # random, and stable across restarts
      - key: LATIN_TEACHER_PASSWORD
        sync: false              # you type this in the Render dashboard
      - key: LATIN_ID_PATTERN
        sync: false              # optional: a regex for your ID format
