# Latin I — Study skills questions: the "How to study" badge (October 2026)
#
# The check after the badge's lesson (badge_lessons.yaml, how-to-study): does
# the student know how spaced practice works and what the Lēgēs Magistrī ask?
# SK-001 is how memory works and why honest grades matter; SK-002 is the laws.
#
# Written to match how the app actually behaves (fsrs.py, goals.py, rush.py,
# teacher.py): Again comes back in five minutes, a first Good in about three
# days, a card counts once a day toward homework, the week runs Saturday to
# Friday, a badge is five right out of six. If any of that changes, these
# answers change with it.
#
# The questions never quote a law by its number: the numbers move as laws are
# approved and withdrawn.
#
# As in every bank file, the right answer is written as option a; the app
# shuffles the options for each student.

items:

# ==========================================================================
# SK-001 — How memory works
# ==========================================================================

  - id: SK001-APPLY-01
    node: SK-001
    assess: apply
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "You typed the wrong meaning for a vocabulary word. Which grade should you press?"
    options:
      a: "Again"
      b: "Hard"
      c: "Good"
      d: "Easy"
    answer: a
    touches: []
    what_went_wrong:
      - text: "I thought a better grade would help my homework"
        node: SK-001
    note: "A miss is always Again: then the card comes back in five minutes."
    teaching: ""

  - id: SK001-RECOG-01
    node: SK-001
    assess: recognize
    tier: 1
    format: choice
    paper_ok: true
    macron_matters: false
    stem: "Why does the app bring a word back after a few days instead of straight away?"
    options:
      a: "Remembering a word just as it starts to fade makes it last longer"
      b: "To make your homework take longer"
      c: "Because it forgot you had already answered it"
      d: "So you can memorize the order of the cards"
    answer: a
    touches: []
    what_went_wrong: []
    note: "The idea of spaced practice, in one line."
    teaching: ""

