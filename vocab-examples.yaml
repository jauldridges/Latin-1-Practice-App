# One example sentence per drill word: the vocabulary hint.
#
# A student asked for it: "what if you give me the word in an example Latin
# sentence". The sentence gives context without giving the meaning away.
#
#   word   the headword exactly as in vocab.yaml
#   latin  the sentence, with the word itself marked *like this*. A Latin
#          sentence for Latin words; for the week-of-Aug-24 phrases, which are
#          Latin used in English, an English sentence that uses the phrase.
#   en     the English of a Latin sentence (omitted for the English ones)
#
# What a student sees:
#   Latin -> English card:  the sentence with the word in bold, and NOT the
#                           English, which would contain the answer.
#   English -> Latin card:  the sentence with the word blanked out, and the
#                           English, which only says what the prompt says.
#   after answering:        the sentence and its English, every time.
#
# Every sentence uses only the 80 drill words and only grammar taught by the
# end of September: nominative, accusative and vocative, the present, sum,
# adjective agreement, imperatives and dēbeō + infinitive. No genitive,
# dative, ablative or prepositions yet.
#
# Students see nothing here until the teacher approves it at
# Teacher dashboard -> Vocabulary hints. Editing there saves and approves.

examples:

  # --- week of Aug 24: Latin phrases used in English ---
  - {word: "et cetera",        latin: "We packed sandwiches, apples, water bottles, *et cetera*."}
  - {word: "per sē",           latin: "The idea isn't bad *per sē* — it just needs more work."}
  - {word: "ad hoc",           latin: "With no plan in place, the class put together an *ad hoc* team to fix the problem that afternoon."}
  - {word: "alma māter",       latin: "My uncle still wears a sweatshirt from his *alma māter*, the college he graduated from."}
  - {word: "ē plūribus ūnum",  latin: "*Ē plūribus ūnum* is printed on U.S. coins — think of the thirteen colonies and the country they formed."}
  - {word: "carpe diem",       latin: "It's the last day of summer vacation — *carpe diem*, and get to the beach before it's over."}
  - {word: "sīc",              latin: "The newspaper quoted the sign exactly: \"No dogs aloud\" [*sīc*]."}
  - {word: "versus",           latin: "Tonight's game is the Red Sox *versus* the Yankees."}
  - {word: "id est",           latin: "Bring only the essentials, *id est*, a pencil, your notebook, and your ID."}
  - {word: "exemplī grātiā",   latin: "Some animals sleep through the winter, *exemplī grātiā* bears and bats."}

